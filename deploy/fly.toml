app = "occupytheoffice"
primary_region = "lax"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  grace_period = "60s"
  interval = "30s"
  timeout = "10s"
  method = "GET"
  path = "/api/city"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
