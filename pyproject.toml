[project]
name = "sightline"
version = "0.1.0"
description = "Agent that locates a caller inside a building from their phone camera and routes responders to them"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["sightline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
