[project]
name = "secondstay"
version = "0.1.0"
description = "Agent that finds vacant offices that can become housing"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest"]
sheets = ["pillow"]  # contact sheets of panoramas

[tool.setuptools]
packages = ["secondstay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
