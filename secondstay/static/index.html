function outline(rings, box, cls) {
  const [west, south, east, north] = box;
  return rings.map((ring) => `<polygon class="${cls}" points="${ring.map(([x, y]) =>
    `${(((x - west) / (east - west)) * 100).toFixed(2)},${(((north - y) / (north - south)) * 100).toFixed(2)}`).join(" ")}"/>`).join("");
}

// Position in percent of the aerial image for a (longitude, latitude) point.
function toImage([x, y], [west, south, east, north]) {
  return [((x - west) / (east - west)) * 100, ((north - y) / (north - south)) * 100];
}

// A measured gap drawn on the aerial image: the line, its end caps and a distance tag.
function dimensionLine(line, box) {
  if (!line) return { svg: "", tag: "" };
  const [a, b] = line.points.map((p) => toImage(p, box));
  const mid = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
  const svg = `<line class="dim" x1="${a[0].toFixed(2)}" y1="${a[1].toFixed(2)}" x2="${b[0].toFixed(2)}" y2="${b[1].toFixed(2)}"/>
    <circle class="dim-end" cx="${a[0].toFixed(2)}" cy="${a[1].toFixed(2)}" r="0.7"/><circle class="dim-end" cx="${b[0].toFixed(2)}" cy="${b[1].toFixed(2)}" r="0.7"/>`;
  const tag = `<span class="dim-tag" style="left:${mid[0].toFixed(1)}%;top:${mid[1].toFixed(1)}%">about ${Math.round(line.feet)} ft</span>`;
  return { svg, tag };
}

function streetLines(streets, box) {
  return (streets || []).filter((s) => s.public && s.points.length > 1).map((s) =>
    `<polyline class="street" points="${s.points.map((p) => toImage(p, box).map((v) => v.toFixed(2)).join(",")).join(" ")}"/>`).join("");
}

// Side view drawn to scale from the heights on record: what the high-rise rule actually measures.
function heightProfile(data) {
  const b = data.building, o = data.outside;
  const roof = o.height_ft ?? b.record_height_ft;
  const stories = b.stories;
  if (roof == null) return "";
  const county = data.public_records?.county_height?.feet ?? null;
  const top = data.top_occupied_ft;
  const W = 520, H = 400, ground = 360, x0 = 36, x1 = 120, lx = 160;
  const span = Math.max(roof, county || 0, 75) * 1.06;
  const y = (ft) => ground - (ft / span) * (ground - 22);
  const story = stories ? roof / stories : null;
  const floorLines = story ? Array.from({ length: stories - 1 }, (_, i) =>
    `<line class="hp-story" x1="${x0}" x2="${x1}" y1="${y(story * (i + 1)).toFixed(1)}" y2="${y(story * (i + 1)).toFixed(1)}"/>`).join("") : "";
  // The listing's floor, or the floor being looked at in the 3D view when no listing is chosen.
  const viewed = Number(new URLSearchParams(location.hash.split("?")[1] || "").get("floor")) || null;
  const floor = Number(data.floor) || viewed;
  const floorText = data.floor ? `Floor ${floor}: this listing` : `Floor ${floor}: floor in view`;
  const marks = [
    { ft: 75, cls: "hp-rule", text: "75 ft: high-rise line", full: true },
    top != null && { ft: top, cls: "hp-top", text: `Top occupied level: about ${Math.round(top)} ft (estimate)` },
    { ft: roof, cls: "hp-roof", text: `Roof, ${o.height_ft != null ? "from imagery" : "CoStar record"}: about ${Math.round(roof)} ft` },
    county != null && { ft: county, cls: "hp-county", text: `LA County ${data.public_records.county_height.year} survey: about ${Math.round(county)} ft` },
    story && floor && floor <= stories && { ft: story * (floor - 0.5), cls: "hp-suite-mark", text: floorText, suite: true },
  ].filter(Boolean).map((m) => ({ ...m, line: y(m.ft) }));
  // Spread labels so close heights stay readable; each keeps a leader to its own line.
  const placed = [...marks].sort((p, q) => p.line - q.line);
  placed.forEach((m, i) => { m.label = Math.max(m.line, i ? placed[i - 1].label + 16 : 12); });
  for (let i = placed.length - 1; i >= 0; i--) {
    const limit = i === placed.length - 1 ? ground - 6 : placed[i + 1].label - 16;
    placed[i].label = Math.min(placed[i].label, limit);
  }
  const suite = story && floor && floor <= stories
    ? `<rect class="hp-suite" x="${x0}" width="${x1 - x0}" y="${y(story * floor).toFixed(1)}" height="${(y(story * (floor - 1)) - y(story * floor)).toFixed(1)}"/>` : "";
  const drawn = marks.map((m) => `
      ${m.suite ? "" : `<line class="${m.cls}" x1="${m.full ? 12 : x0 - 6}" x2="${x1 + 6}" y1="${m.line.toFixed(1)}" y2="${m.line.toFixed(1)}"/>`}
      <polyline class="hp-leader" points="${x1 + 6},${m.line.toFixed(1)} ${lx - 6},${m.label.toFixed(1)}"/>
      <text class="hp-label${m.suite ? " hp-suite-text" : ""}" x="${lx}" y="${(m.label + 4).toFixed(1)}">${esc(m.text)}</text>`).join("");
  return `<svg class="height-profile" viewBox="0 0 ${W} ${H}" role="img" aria-label="Side view of the building heights">
      <rect class="hp-building" x="${x0}" y="${y(roof).toFixed(1)}" width="${x1 - x0}" height="${(ground - y(roof)).toFixed(1)}"/>
      ${floorLines}${suite}${drawn}
      <line class="hp-ground" x1="12" x2="${W - 12}" y1="${ground}" y2="${ground}"/>
      <text class="hp-label hp-muted" x="${x0}" y="${ground + 22}">Ground under the building (0 ft)</text>
    </svg>
    <p class="legend">Side view drawn to scale from the measured and recorded heights; not a photo.${story ? ` Floor lines are spread evenly, about ${story.toFixed(1)} ft apart (our assumption).` : ""} The rule measures from the fire department access level, which is taken here as the ground under the building and has not been measured.</p>`;
}

// The same staging as the floor view, reused for the evidence rows that the outside of the building answers.
// height: the building at its roof height with level planes for the heights the high-rise rule turns on.
// separation: the building and its neighbours at their measured heights, with the closest gap drawn.
// access: the building on its block, public streets laid on the ground, and the gap to the closest one.
// zone: the building and its neighbours on the wider aerial image of the area.
let sceneStage = null;
const SCENE_ROWS = ["height", "separation", "access", "zone"];
// Rows answered by city permit records: which topic, and what the work counts are called.
const PERMIT_TOPIC = { elevator: "elevator", sprinklers: "sprinklers", alarm: "alarm", exits: "stairs" };
function mountEvidence3D(host, data, key) {
  if (sceneStage) { sceneStage.dispose(); sceneStage = null; }
  if (!host) return;
  const b = data.building, o = data.outside, d = heightData(data);
  const stage = makeStage(host, { bloom: false }), { scene, camera, controls, ticks } = stage;
  sceneStage = stage;
  controls.autoRotate = false;
  scene.fog = null; scene.background = new THREE.Color(0xf2f1ec);
  const sun = new THREE.DirectionalLight(0xffead3, 0.8); sun.position.set(-40, 90, 50); scene.add(sun);
  const FT = 0.3048;
  const [w, s, e, n] = o.bbox, lat = (s + n) / 2, lon = (w + e) / 2;
  const kx = 111320 * Math.cos(lat * Math.PI / 180), ky = 110540;
  const local = ([x, y]) => [(x - lon) * kx, (y - lat) * ky];
  const rings = o.footprint.map((ring) => ring.map(local));
  const pts = rings.flat(), xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]);
  const cx = (Math.min(...xs) + Math.max(...xs)) / 2, cy = (Math.min(...ys) + Math.max(...ys)) / 2;
  const span = Math.max(Math.max(...xs) - Math.min(...xs), Math.max(...ys) - Math.min(...ys), 10);
  const world = (p, y = 0) => { const [x, z] = local(p); return new THREE.Vector3(x - cx, y, -(z - cy)); };
  const shapeOf = (ring) => new THREE.Shape(ring.map(local).map(([x, y]) => new THREE.Vector2(x - cx, y - cy)));
  const shapes = o.footprint.map(shapeOf);
  const roofM = (d.roof ?? 30) * FT;
  // Aerial image on the ground, as in the floor view; the zone row uses the wider picture of the area.
  // Like the floor view: the detailed image near the building over the wider image of the area.
  // The height row reads better on a plain ground: a flat photo of rooftops under a raised model looks out of place there.
  const topicKey = PERMIT_TOPIC[key], plainGround = key === "height" || !!topicKey;
  const layers = plainGround ? [] : key === "zone" ? [[o.context_bbox, "?context=1", -0.05]] : [[o.bbox, "", -0.05], [o.context_bbox, "?context=1", -0.15]];
  if (plainGround) {
    const size = Math.max(span * 4, roofM * 2.2);
    const plain = new THREE.Mesh(new THREE.CircleGeometry(size / 2, 64).rotateX(-Math.PI / 2),
      new THREE.MeshBasicMaterial({ color: 0xe9e7e1 }));
    plain.position.y = -0.06; scene.add(plain);
    const cell = 25 * FT, grid = new THREE.GridHelper(Math.round(size / cell) * cell, Math.round(size / cell), 0xd3d0c7, 0xe4e2db);
    grid.position.y = -0.03; scene.add(grid);
    // The footprint on the ground, so the base of the model reads as standing on its own outline.
    shapes.forEach((shape) => {
      const base = new THREE.Mesh(new THREE.ShapeGeometry(shape).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0x8a877d, transparent: true, opacity: 0.35 }));
      base.position.y = 0.01; scene.add(base);
    });
  }
  let detailed = null;
  for (const [box, suffix, elevation] of layers) {
    if (!box?.length) continue;
    const groundMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const ground = new THREE.Mesh(new THREE.PlaneGeometry((box[2] - box[0]) * kx, (box[3] - box[1]) * ky).rotateX(-Math.PI / 2), groundMat);
    ground.position.copy(world([(box[0] + box[2]) / 2, (box[1] + box[3]) / 2], elevation)); ground.visible = false; scene.add(ground);
    if (box === o.bbox) detailed = { ground, box };
    new THREE.TextureLoader().load(`/api/spaces/${b.property_id}/aerial.jpg${suffix}`, (texture) => {
      if (!host.isConnected) { texture.dispose(); return; }
      texture.colorSpace = THREE.SRGBColorSpace; texture.anisotropy = 8; groundMat.map = texture; groundMat.needsUpdate = true; ground.visible = true;
    });
  }
  const tag = (text, at, cls = "", center = [0.5, 1.2]) => {
    const el = document.createElement("span"); el.className = "tag3d " + cls; el.textContent = text;
    const t = new CSS2DObject(el); t.center.set(...center); t.position.copy(at); scene.add(t); return t;
  };
  const line = (points, color, onTop = false) => {
    const l = new THREE.Line(new THREE.BufferGeometry().setFromPoints(points), new THREE.LineBasicMaterial({ color, depthTest: !onTop }));
    if (onTop) l.renderOrder = 10;
    scene.add(l); return l;
  };
  const massing = (shape, heightM, color, opacity, edge, group = scene) => {
    const g = new THREE.ExtrudeGeometry(shape, { depth: Math.max(heightM, 0.3), bevelEnabled: false }).rotateX(-Math.PI / 2);
    group.add(new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color, transparent: true, opacity, roughness: 0.8, side: THREE.DoubleSide, depthWrite: false })));
    group.add(new THREE.LineSegments(new THREE.EdgesGeometry(g), new THREE.LineBasicMaterial({ color: edge, transparent: true, opacity: 0.7 })));
  };
  const neighbourGroup = new THREE.Group(); scene.add(neighbourGroup);
  // This building.
  shapes.forEach((shape) => massing(shape, roofM, plainGround ? 0xb9c9cf : CYAN, plainGround ? (topicKey ? 0.16 : 0.35) : 0.42, CYAN));
  // Neighbours at their measured heights; ones without a reading stay as outlines on the ground.
  if (!plainGround) o.neighbors.forEach((ring, i) => {
    const ft = (o.neighbor_heights_ft || [])[i];
    if (ft != null) massing(shapeOf(ring), ft * FT, 0xc9c6bd, 0.3, 0x8c8a82, neighbourGroup);
    else neighbourGroup.add(line(ring.map((p) => world(p, 0.2)), 0x8c8a82));
  });

  if (key === "height") {
    const outline = (y, color, opacity) => shapes.forEach((shape) => {
      scene.add(new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(shape.getPoints().map((p) => new THREE.Vector3(p.x, y, -p.y))),
        new THREE.LineBasicMaterial({ color, transparent: true, opacity })));
    });
    if (d.story) for (let i = 1; i < d.stories; i++) outline(d.story * i * FT, CYAN, 0.35);
    if (d.story && d.floor) shapes.forEach((shape) => {
      const g = new THREE.ExtrudeGeometry(shape, { depth: d.story * FT, bevelEnabled: false }).rotateX(-Math.PI / 2);
      const slab = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: CYAN, transparent: true, opacity: 0.7 }));
      slab.position.y = d.story * (d.floor - 1) * FT; scene.add(slab);
    });
    // Level planes, with labels on a pole beside the building.
    const size = span * 1.5, poleX = span * 0.75 + 4;
    d.marks.filter((m) => !m.suite).forEach((m) => {
      const y = m.ft * FT, color = { "hp-rule": AMBER, "hp-top": 0x2f6b45, "hp-roof": INK, "hp-county": 0x0f5f78 }[m.cls];
      const plane = new THREE.Mesh(new THREE.PlaneGeometry(size, size).rotateX(-Math.PI / 2),
        new THREE.MeshBasicMaterial({ color, transparent: true, opacity: m.cls === "hp-rule" ? 0.22 : 0.1, side: THREE.DoubleSide, depthWrite: false }));
      plane.position.y = y; scene.add(plane);
      const edge = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.PlaneGeometry(size, size).rotateX(-Math.PI / 2)), new THREE.LineBasicMaterial({ color }));
      edge.position.y = y; scene.add(edge);
    });
    line([new THREE.Vector3(poleX, 0, 0), new THREE.Vector3(poleX, roofM * 1.04, 0)], 0x66645d);
    spreadLabels(d.marks.map((m) => ({ ...m })), (d.roof ?? 30) * 0.055).forEach((m) => {
      const at = m.ft * FT, labelAt = m.label * FT;
      line([new THREE.Vector3(poleX, at, 0), new THREE.Vector3(poleX + 3, labelAt, 0)], 0x66645d);
      tag(m.text, new THREE.Vector3(poleX + 3.5, labelAt, 0), { "hp-rule": "amber", "hp-suite-mark": "cyan" }[m.cls] || "", [0, 0.5]);
    });
    const mid = roofM * 0.52, size2 = Math.max(roofM, span) * 1.7;
    camera.position.set(poleX * 0.6 + size2 * 0.45, mid + size2 * 0.16, size2);
    controls.target.set(poleX * 0.6, mid, 0); controls.maxPolarAngle = Math.PI * 0.49; controls.update();
  } else if (topicKey) {
    // Each floor where a permit names work is filled; deeper colour for more permits. Floors are spread evenly (our assumption).
    const topic = data.permits?.topics?.[topicKey] || { floors: {} };
    const counts = Object.entries(topic.floors || {}).map(([f, c]) => [Number(f), c]).filter(([f]) => f >= 1 && f <= (d.stories || 0));
    const most = Math.max(1, ...counts.map(([, c]) => c));
    const story = d.story || roofM / FT / Math.max(1, d.stories || 1);
    for (let i = 1; i < (d.stories || 1); i++) shapes.forEach((shape) => {
      scene.add(new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(shape.getPoints().map((pt) => new THREE.Vector3(pt.x, story * i * FT, -pt.y))),
        new THREE.LineBasicMaterial({ color: CYAN, transparent: true, opacity: 0.35 })));
    });
    counts.forEach(([f, c]) => shapes.forEach((shape) => {
      const g = new THREE.ExtrudeGeometry(shape, { depth: story * FT * 0.82, bevelEnabled: false }).rotateX(-Math.PI / 2);
      const slab = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: AMBER, transparent: true, opacity: 0.35 + 0.55 * (c / most) }));
      slab.position.y = story * (f - 1) * FT + story * FT * 0.09; scene.add(slab);
    }));
    if (d.floor) shapes.forEach((shape) => {
      scene.add(new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(shape.getPoints().map((pt) => new THREE.Vector3(pt.x, story * (d.floor - 0.5) * FT, -pt.y))),
        new THREE.LineBasicMaterial({ color: CYAN })));
    });
    const poleX = span * 0.75 + 4;
    line([new THREE.Vector3(poleX, 0, 0), new THREE.Vector3(poleX, roofM * 1.02, 0)], 0x66645d);
    const marks = counts.length <= 8
      ? counts.map(([f, c]) => ({ ft: story * (f - 0.5), text: `Floor ${f}: ${c} permit${c > 1 ? "s" : ""}` }))
      : [{ ft: story * (d.stories - 0.5), text: `Work named on ${counts.length} of ${d.stories} floors` }];
    if (d.floor) marks.push({ ft: story * (d.floor - 0.5), text: data.floor ? `Floor ${d.floor}: this listing` : `Floor ${d.floor}: floor in view`, cyan: true });
    spreadLabels(marks, (d.roof ?? 30) * 0.055).forEach((m) => {
      line([new THREE.Vector3(poleX, m.ft * FT, 0), new THREE.Vector3(poleX + 3, m.label * FT, 0)], 0x66645d);
      tag(m.text, new THREE.Vector3(poleX + 3.5, m.label * FT, 0), m.cyan ? "cyan" : "amber", [0, 0.5]);
    });
    const mid = roofM * 0.52, size2 = Math.max(roofM, span) * 1.7;
    camera.position.set(poleX * 0.6 + size2 * 0.45, mid + size2 * 0.16, size2);
    controls.target.set(poleX * 0.6, mid, 0); controls.maxPolarAngle = Math.PI * 0.49; controls.update();
  } else if (key === "separation" || key === "access") {
    if (key === "access") (data.streets || []).filter((st) => st.public && st.points.length > 1).forEach((st) => {
      // A flat ribbon on the ground for each public street.
      const path = st.points.map((p) => world(p, 0.3));
      for (let i = 1; i < path.length; i++) {
        const a = path[i - 1], c = path[i], len = a.distanceTo(c);
        if (len < 0.01) continue;
        const strip = new THREE.Mesh(new THREE.PlaneGeometry(len, 3).rotateX(-Math.PI / 2),
          new THREE.MeshBasicMaterial({ color: AMBER, transparent: true, opacity: 0.55, depthWrite: false }));
        strip.position.copy(a.clone().add(c).multiplyScalar(0.5));
        strip.rotation.y = -Math.atan2(c.z - a.z, c.x - a.x);
        scene.add(strip);
      }
    });
    const gap = (data.measure_lines || {})[key];
    let focus = new THREE.Vector3(0, roofM * 0.2, 0);
    if (gap) {
      // The measured gap, raised a little above the ground with posts at both ends.
      // Drawn over the buildings so the gap stays visible from any angle.
      const h = 2, [a, c] = gap.points.map((p) => world(p, h));
      // A solid bar rather than a hairline, so a gap of a few metres still reads at this scale.
      const bar = (from, to, r) => {
        const len = from.distanceTo(to); if (len < 0.01) return;
        const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, 10), new THREE.MeshBasicMaterial({ color: 0xffffff, depthTest: false }));
        m.position.copy(from.clone().add(to).multiplyScalar(0.5));
        m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), to.clone().sub(from).normalize());
        m.renderOrder = 10; scene.add(m);
      };
      bar(a, c, 0.6);
      [a, c].forEach((p) => bar(new THREE.Vector3(p.x, 0, p.z), p.clone().setY(h + 6), 0.35));
      [a, c].forEach((p) => { const dot = new THREE.Mesh(new THREE.SphereGeometry(1.1, 12, 8), new THREE.MeshBasicMaterial({ color: 0xffffff, depthTest: false })); dot.renderOrder = 11; dot.position.copy(p); scene.add(dot); });
      const mid = a.clone().add(c).multiplyScalar(0.5);
      tag(`${gap.label}: about ${Math.round(gap.feet)} ft`, mid.clone().setY(h + 8));
      focus = new THREE.Vector3(mid.x * 0.5, 0, mid.z * 0.5);
    }
    // A steep view from above, so the ground between tall buildings can be seen.
    const size = Math.max(span * 3, roofM * 2.1);
    camera.position.set(focus.x + size * 0.25, size * 1.2, focus.z + size * 0.5);
    controls.target.copy(focus); controls.maxPolarAngle = Math.PI * 0.49; controls.update();
  } else {
    const size = Math.max(span * 5, roofM * 1.8);
    camera.position.set(size * 0.35, size * 0.95, size * 0.75);
    controls.target.set(0, 0, 0); controls.maxPolarAngle = Math.PI * 0.49; controls.update();
  }
  // Separation and access: lay the aerial photo over Vexcel's surface heights, so the trees, cars, lamps and
  // neighbouring buildings in the photo stand up as captured. The drawn neighbour blocks then step aside.
  if ((key === "separation" || key === "access") && detailed) {
    fetch(`/api/spaces/${b.property_id}/surface.json`).then((r) => (r.ok ? r.json() : null)).then((surface) => {
      if (!surface?.heights || !host.isConnected || sceneStage !== stage) return;
      const { ground, box } = detailed;
      const shell = surfaceShell(surface, (box[2] - box[0]) * kx, (box[3] - box[1]) * ky, o.footprint.map((ring) => ring.map(local)));
      shell.position.copy(ground.position); scene.add(shell);
      neighbourGroup.visible = false;
      host.classList.add("draped");
    }).catch(() => {});
  }
  ticks.push(() => { if (!host.isConnected && sceneStage === stage) { stage.dispose(); sceneStage = null; } });
}

// Shared by the 3D view and the drawing fallback: the heights shown and their labels.
function heightData(data) {
  const b = data.building, o = data.outside;
  const roof = o.height_ft ?? b.record_height_ft;
  const stories = b.stories || null;
  const county = data.public_records?.county_height?.feet ?? null;
  const top = data.top_occupied_ft;
  const story = stories && roof != null ? roof / stories : null;
  const viewed = Number(new URLSearchParams(location.hash.split("?")[1] || "").get("floor")) || null;
  const floorNo = Number(data.floor) || viewed;
  const floor = story && floorNo && floorNo <= stories ? floorNo : null;
  const marks = roof == null ? [] : [
    { ft: 75, cls: "hp-rule", text: "75 ft: high-rise line", full: true },
    top != null && { ft: top, cls: "hp-top", text: `Top occupied: about ${Math.round(top)} ft (estimate)` },
    { ft: roof, cls: "hp-roof", text: `Roof, ${o.height_ft != null ? "from imagery" : "CoStar record"}: about ${Math.round(roof)} ft` },
    county != null && { ft: county, cls: "hp-county", text: `LA County ${data.public_records.county_height.year} survey: about ${Math.round(county)} ft` },
    floor && { ft: story * (floor - 0.5), cls: "hp-suite-mark", text: data.floor ? `Floor ${floor}: this listing` : `Floor ${floor}: floor in view`, suite: true },
  ].filter(Boolean);
  return { roof, stories, story, floor, marks };
}

// Spread label heights apart by at least `gap` (in the marks' own units), keeping their order.
function spreadLabels(marks, gap) {
  const sorted = marks.sort((p, q) => q.ft - p.ft);
  sorted.forEach((m, i) => { m.label = i ? Math.min(m.ft, sorted[i - 1].label - gap) : m.ft; });
  for (let i = sorted.length - 1; i >= 0; i--) {
    const floor = i === sorted.length - 1 ? gap * 0.5 : sorted[i + 1].label + gap;
    sorted[i].label = Math.max(sorted[i].label, floor);
  }
  return sorted;
}

function aerialView(row, data) {
  const b = data.building, o = data.outside;
  const photos = b.aerial_urls.length ? b.aerial_urls : (b.photo_url ? [b.photo_url] : []);
  const photoLabel = b.aerial_urls.length ? "CoStar aerial photo" : "CoStar building photo";
  const sources = [o.loaded ? `Vexcel aerial imagery${o.captured ? ", captured " + esc(o.captured) : ""}` : "",
    row.key === "access" && (data.streets || []).length ? "OpenStreetMap streets" : "",
    row.key === "height" && data.public_records?.county_height ? "LA County building outlines" : "",
    row.fields.some((f) => !f.field.startsWith("Vexcel")) ? "CoStar commercial property record" : ""].filter(Boolean);
  const photoBlock = photos.length ? `<div class="thumbs${row.key === "height" ? " large" : ""}">${photos.map((u) => `<a href="${esc(u)}" target="_blank" rel="noopener"><img src="${esc(u)}" alt="${photoLabel}"></a>`).join("")}</div>
      <p class="legend">${photoLabel}${photos.length > 1 ? "s" : ""} from the record${row.key === "height" ? ": the building seen from the side" : ""}.</p>` : "";
  let visual = "";
  if (row.key === "height") {
    const d = heightData(data);
    visual = (o.loaded && d.roof != null ? `<div class="stage scene3d" data-scene3d><div class="gl"></div><div class="labels"></div></div>
      <p class="legend">3D view drawn to scale from the measured and recorded heights; drag to turn it. The building shape is the footprint traced from imagery, raised to the roof height; the grid on the ground is 25 ft.${d.story ? ` Floor lines are spread evenly, about ${d.story.toFixed(1)} ft apart (our assumption).` : ""} Level planes mark the heights listed. The rule measures from the fire department access level, which is taken here as the ground under the building and has not been measured.</p>`
      : heightProfile(data)) + photoBlock;
  } else if (o.loaded) {
    const line = (data.measure_lines || {})[row.key];
    const dim = dimensionLine(line, o.bbox);
    const streetsSvg = row.key === "access" ? streetLines(data.streets, o.bbox) : "";
    const legend = row.key === "access"
      ? "3D view: this building (blue) on its block; yellow bands are public streets from OpenStreetMap; the white line is the measured gap to the closest public street."
      : "3D view: this building (blue) among the structures around it; the white line is the measured gap to the closest structure, taken between footprint outlines.";
    const surfaceNote = " Everything standing around it (neighbouring buildings, trees, cars) is drawn as a see-through shell from Vexcel's surface heights (DSM); the shapes are approximate and shown for context only. Where the surface is not available, neighbours are drawn as blocks at their measured roof heights.";
    visual = `<div class="stage scene3d" data-scene3d><div class="gl"></div><div class="labels"></div></div>
      <p class="legend">${legend}${line ? ` ${esc(line.label)}: about ${Math.round(line.feet)} ft.` : ""}${surfaceNote} Drag to turn the view.</p>
      <details class="flat-view"><summary>Flat aerial view</summary>
      <div class="aerial"><img src="/api/spaces/${b.property_id}/aerial.jpg" alt="Vexcel aerial image" loading="lazy">
      <svg viewBox="0 0 100 100" preserveAspectRatio="none">${streetsSvg}${outline(o.neighbors, o.bbox, "other")}${outline(o.footprint, o.bbox, "me")}${dim.svg}</svg>${dim.tag}</div></details>${photoBlock}`;
  } else {
    visual = photoBlock;
  }
  const note = row.key === "height"
    ? (o.height_ft != null ? "Imagery height is the highest roof point sampled over the footprint, minus the ground below; it includes rooftop equipment. The highest occupied level is our estimate: roof height less one story." : "No height was measured from imagery; the record value is shown.")
    : (o.loaded ? "Distances are measured between outlines traced from imagery: read from images, not measured on site." : esc(o.error));
  return `<div class="src">SOURCE · ${sources.join(" · ") || "no image on record"}</div>
    <p class="statement">${esc(row.evidence)}</p>
    ${row.fields.length ? fieldTable(row, false) : ""}
    ${visual}
    <p class="note">${note}</p>`;
}

function planView(data) {
  const p = data.plan;
  if (!p || (!p.image && !p.reading)) return data.space ? `<h3 style="margin-top:18px">Floor plan on record</h3><p class="note">CoStar holds no floor plan for this suite.</p>` : "";
  const r = p.reading;
  if (!p.image) p.image = p.reading_from;
  const shown = (v) => (v == null ? '<span class="sub">not legible on the plan</span>' : v);
  return `<h3 style="margin-top:18px">Floor plan on record</h3>
    <div class="src">SOURCE · CoStar ${p.image.source === "building" ? "building record" : "space for lease"} · ${p.count} plans on record · <a href="#/plans">see all</a></div>
    <a href="${esc(p.image.url)}" target="_blank" rel="noopener"><img class="sheet" style="background:#fff" src="${esc(p.image.url)}" alt="Floor plan"></a>
    ${p.reading_from ? `<p class="legend">The reading below is from another plan attached to this building. Check its stated coverage before using it for this suite.</p>` : ""}
    ${r ? `<table class="kv">
      <tr><td>Stairwells drawn</td><td>${shown(r.stairs)}</td></tr>
      <tr><td>Elevator cars drawn</td><td>${shown(r.elevators)}</td></tr>
      <tr><td>What the plan covers</td><td>${esc({ floor: "A whole floor with the core", part: "Part of a floor", suite: "One suite, no core", diagram: "A leasing diagram" }[r.covers] || r.covers)}</td></tr>
      <tr><td>Limits of the reading</td><td>${esc(r.notes)}</td></tr>
    </table><p class="legend">${esc(r.reader)} · read from the image, not measured</p>` : '<p class="legend">This plan has not been read yet.</p>'}`;
}

// Pictures for rows that would otherwise be text only. Each is drawn from the same records the row states.
function permitTimeline(topic) {
  const recs = (topic.records || []).filter((r) => /^\d{4}/.test(r.issued || ""));
  if (!recs.length) return "";
  const years = recs.map((r) => Number(r.issued.slice(0, 4)));
  const start = Math.min(Number(String(topic.first).slice(0, 4)) || Math.min(...years), ...years), end = new Date().getFullYear();
  const W = 520, H = 92, x = (yr) => 16 + ((yr - start) / Math.max(1, end - start)) * (W - 32);
  const byYear = {}; years.forEach((y) => (byYear[y] = (byYear[y] || 0) + 1));
  const step = Math.min(7, 44 / Math.max(...Object.values(byYear)));
  const dots = Object.entries(byYear).map(([y, c]) => Array.from({ length: c }, (_, i) =>
    `<circle cx="${x(+y).toFixed(1)}" cy="${(52 - i * step).toFixed(1)}" r="${Math.min(3, step / 2 + 0.6).toFixed(1)}" class="tl-dot"/>`).join("")).join("");
  const ticks = [start, Math.round((start + end) / 2), end].map((y) =>
    `<line x1="${x(y)}" x2="${x(y)}" y1="60" y2="66" class="tl-axis"/><text x="${x(y)}" y="80" text-anchor="middle" class="tl-text">${y}</text>`).join("");
  return `<svg class="viz" viewBox="0 0 ${W} ${H}" role="img" aria-label="Permits by year">
      <line x1="16" x2="${W - 16}" y1="60" y2="60" class="tl-axis"/>${ticks}${dots}</svg>
    <p class="legend">Each dot is one permit by the year it was issued${recs.length < topic.count ? `; the latest ${recs.length} of ${topic.count} are shown` : ""}. Permits record work that was filed, not what is installed today.</p>`;
}

function ageTimeline(year) {
  if (!year) return "";
  const now = new Date().getFullYear(), start = Math.min(year - 5, now - 60), W = 520, H = 96;
  const x = (yr) => 16 + ((yr - start) / (now - start)) * (W - 32);
  return `<svg class="viz" viewBox="0 0 ${W} ${H}" role="img" aria-label="Building age against the 5 and 15 year lines">
      <rect x="${x(start)}" y="30" width="${x(now - 15) - x(start)}" height="18" class="age-old"/>
      <rect x="${x(now - 15)}" y="30" width="${x(now - 5) - x(now - 15)}" height="18" class="age-mid"/>
      <rect x="${x(now - 5)}" y="30" width="${x(now) - x(now - 5)}" height="18" class="age-new"/>
      <line x1="${x(year)}" x2="${x(year)}" y1="18" y2="58" class="age-mark"/>
      <text x="${x(year)}" y="13" text-anchor="middle" class="tl-text strong">Built ${year}</text>
      <text x="${x(now - 15)}" y="72" text-anchor="middle" class="tl-text">${now - 15}</text>
      <text x="${x(now - 5)}" y="26" text-anchor="middle" class="tl-text">${now - 5}</text>
      <text x="${x(now)}" y="72" text-anchor="end" class="tl-text">${now}</text>
      <text x="${x(start)}" y="90" class="tl-text muted">built 15+ years ago</text>
      <text x="${x(now - 15) + 4}" y="90" class="tl-text muted">5 to 15</text>
    </svg>
    <p class="legend">Green: built at least 15 years ago. Amber: 5 to 15 years, which the ordinance routes through a Zoning Administrator. Grey: under 5 years.</p>`;
}

function unitsGraphic(row) {
  const area = Number((row.evidence.match(/([\d,]+) sq ft of rentable area/) || [])[1]?.replace(/,/g, ""));
  const units = Number((row.evidence.match(/about ([\d,]+) units/) || [])[1]?.replace(/,/g, ""));
  if (!area || !units) return "";
  const usable = Math.round(area * 0.8), per = Math.max(1, Math.ceil(units / 120)), cells = Math.ceil(units / per);
  const grid = Array.from({ length: cells }, (_, i) => `<rect x="${16 + (i % 30) * 16.4}" y="${118 + Math.floor(i / 30) * 16.4}" width="13" height="13" rx="2" class="unit-cell"/>`).join("");
  const W = 520, rows = Math.ceil(cells / 30), H = 130 + rows * 16.4;
  const bar = (y, w, cls, text) => `<rect x="16" y="${y}" width="${w}" height="22" rx="4" class="${cls}"/><text x="24" y="${y + 15}" class="tl-text strong dark">${esc(text)}</text>`;
  return `<svg class="viz" viewBox="0 0 ${W} ${H.toFixed(0)}" role="img" aria-label="From floor area to units">
      ${bar(8, W - 32, "area-all", `${num(area)} sq ft rentable area on record`)}
      ${bar(40, (W - 32) * 0.8, "area-use", `${num(usable)} sq ft usable (80%, our assumption)`)}
      <text x="16" y="88" class="tl-text">÷ 500 sq ft per unit (our assumption) =</text>
      <text x="16" y="106" class="tl-text strong">about ${num(units)} units${per > 1 ? ` · each square is ${per} units` : ""}</text>
      ${grid}</svg>
    <p class="legend">A planning estimate from the recorded area, not a layout. Unit sizes and the usable share are set by the architect's layout.</p>`;
}

function stayCalendar(row) {
  const days = Number((row.evidence.match(/(\d+) days/) || [])[1]) || 31;
  const W = 520, cell = 15.2, H = 70;
  const boxes = Array.from({ length: days }, (_, i) => `<rect x="${16 + i * cell}" y="20" width="${cell - 3}" height="22" rx="3" class="${i < 30 ? "day" : "day over"}"/>`).join("");
  return `<svg class="viz" viewBox="0 0 ${W} ${H}" role="img" aria-label="Minimum stay against the 30 day line">${boxes}
      <line x1="${16 + 30 * cell - 1.5}" x2="${16 + 30 * cell - 1.5}" y1="12" y2="50" class="age-mark"/>
      <text x="16" y="62" class="tl-text">Day 1</text><text x="${16 + 30 * cell - 1.5}" y="10" text-anchor="middle" class="tl-text strong">30 days</text>
      <text x="${16 + days * cell}" y="62" text-anchor="end" class="tl-text">Day ${days}</text></svg>
    <p class="legend">Each box is one night of the planned minimum stay; stays past day 30 are outside the short-term rental rules.</p>`;
}

function recordCards(cards) {
  return `<div class="cards">${cards.map((c) => `<div class="card ${c.tone}"><span class="card-icon">${c.icon}</span>
      <div><b>${esc(c.title)}</b><span>${esc(c.text)}</span>${c.link ? `<a href="${esc(c.link)}" target="_blank" rel="noopener">${esc(c.linkText)}</a>` : ""}</div></div>`).join("")}</div>`;
}

function rowVisual(row, data) {
  const b = data.building, pub = data.public_records || {};
  const topicKey = PERMIT_TOPIC[row.key], topic = data.permits?.topics?.[topicKey];
  const stage = `<div class="stage scene3d" data-scene3d><div class="gl"></div><div class="labels"></div></div>`;
  if (topic && topic.count && data.outside.loaded) {
    return `<h3 style="margin-top:18px">Where city permits name the work</h3>${stage}
      <p class="legend">3D view of the building, raised to its roof height. Amber floors are named in ${esc(topic.label.toLowerCase())} permits; deeper amber means more permits. Floors are spread evenly (our assumption); permits without a floor are not shown. Drag to turn the view.</p>
      ${permitTimeline(topic)}<div data-permit-years></div>`;
  }
  if (row.key === "age") return ageTimeline(b.year_built);
  if (row.key === "units") return unitsGraphic(row);
  if (row.key === "stay") return stayCalendar(row);
  if (row.key === "seismic") {
    const fz = pub.fault_zone;
    return recordCards([
      { icon: "⚑", tone: "warn", title: "Analysis", text: "Called for in every conversion: 75% of the design earthquake." },
      fz ? { icon: "≋", tone: "warn", title: "Alquist-Priolo fault zone", text: `Inside the zone on the ${fz.quad} map${fz.released ? `, released ${fz.released}` : ""}.`, link: fz.map, linkText: "Open the state map" }
         : { icon: "≋", tone: "ok", title: "Alquist-Priolo fault zone", text: "Not inside a mapped zone." },
      { icon: "◍", tone: pub.liquefaction ? "warn" : "ok", title: "Liquefaction zone", text: pub.liquefaction ? "Inside a mapped zone." : "Not inside a mapped zone." },
      { icon: "▦", tone: pub.ndc ? "warn" : "ok", title: "Non-ductile concrete list", text: pub.ndc ? "On LADBS's retrofit list." : "Not on LADBS's retrofit list." },
    ]);
  }
  if (row.key === "historic") {
    const listed = (pub.historic || []).length;
    const photo = b.photo_url ? `<div class="thumbs large"><a href="${esc(b.photo_url)}" target="_blank" rel="noopener"><img src="${esc(b.photo_url)}" alt="CoStar building photo"></a></div>
      <p class="legend">CoStar building photo from the record: the exterior a historic review would look at.</p>` : "";
    return recordCards([
      { icon: "★", tone: listed ? "warn" : "ok", title: "Historic-Cultural Monument, HPOZ", text: listed ? `${listed} listing${listed > 1 ? "s" : ""} on record.` : "No listing covers the site." },
      { icon: "☆", tone: listed ? "warn" : "ok", title: "National and California Registers", text: listed ? "See the listing on record." : "No listing covers the site." },
      { icon: "?", tone: "open", title: "SurveyLA", text: "Surveyed resources were not checked." },
    ]) + photo;
  }
  return "";
}

// Real pictures that show what a record row is about; rows with no fitting picture get none.
function recordPictures(row, data) {
  const b = data.building, o = data.outside;
  if (row.key === "age") {
    const photos = b.photo_url ? [b.photo_url] : b.aerial_urls;
    if (!photos.length) return "";
    return `<h3 style="margin-top:18px">The building on record</h3>
      <div class="thumbs large">${photos.slice(0, 1).map((u) => `<a href="${esc(u)}" target="_blank" rel="noopener"><img src="${esc(u)}" alt="CoStar building photo"></a>`).join("")}</div>
      <p class="legend">CoStar building photo from the record. The age itself comes from the recorded completion year, not from the photo.</p>`;
  }
  if (row.key === "zone" && o.loaded && o.context_bbox?.length) {
    return `<h3 style="margin-top:18px">The area around the building</h3>
      <div class="stage scene3d" data-scene3d><div class="gl"></div><div class="labels"></div></div>
      <p class="legend">Vexcel aerial imagery${o.captured ? ", captured " + esc(o.captured) : ""}, with this building (blue) and nearby structures raised to their measured roof heights. Drag to turn the view. The zone comes from the record and the City zoning lookup; the picture shows the surrounding uses only.</p>`;
  }
  return "";
}

function evidenceView(row, data) {
  let body;
  const visual = rowVisual(row, data);
  if (row.view === "record") body = recordView(row) + recordPictures(row, data) + visual + (row.key === "elevator" ? planView(data) : "");
  else if (row.view === "scan") body = scanView(row, data) + (row.key === "units" ? visual : "") + (row.key === "exits" ? planView(data) + visual : "");
  else if (row.view === "aerial") body = aerialView(row, data);
  else if (row.view === "setting") body = `<div class="src">SOURCE · product setting</div><p class="statement">${esc(row.evidence)}</p>
      ${visual}<p class="note">SecondStay plans stays of 31 days or longer. This is a setting, not a property of the building.</p>`;
  else if (visual) body = `<div class="src">SOURCE · ${esc(row.layer)}</div><p class="statement">${esc(row.evidence)}</p>${visual}
      <p class="note">To be confirmed by: ${esc(row.confirmed_by)}.</p>`;
  else body = `<div class="src">SOURCE · none of our data layers</div><p class="statement">${esc(row.evidence)}</p>
      <p class="note">Records, 3D scans and aerial imagery cannot answer this requirement. To be confirmed by: ${esc(row.confirmed_by)}.</p>`;
  return `<div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start">
      <h3>${esc(row.requirement)}</h3>${badge(row.state)}</div>${body}`;
}

const UNIT_WORDS = { sqft: " sq ft", each: "", linear_ft: " ft", story: " stories", lump: "" };
const LANES = [
  ["called_for", "c1", "Called for by the published rule", "The rule applies and the evidence shows the work is missing."],
  ["possible", "c2", "Possible, to be confirmed", "The evidence points to the work, but what is already in the building is not known."],
  ["unknown", "c3", "Not known from the data", "Records, scans and imagery cannot say either way."],
];
function changesView(data) {
  return `<div class="changes">${LANES.map(([key, cls, title, sub]) => {
    const items = data.changes.filter((c) => c.certainty === key);
    return `<div class="panel lane ${cls}"><h3>${title}<span>${items.length}</span></h3><p class="sub">${sub}</p>
      ${items.map((c) => `<div class="chg"><div class="t"><span>${esc(c.title)}</span>
        <span class="q ${c.quantity == null ? "none" : ""}">${c.quantity == null ? "quantity not known" : num(c.quantity) + UNIT_WORDS[c.unit]}</span></div>
        <div class="r">${esc(c.reason)}</div><div class="w">${esc(c.quantity_basis)} · confirm with ${esc(c.confirmed_by)}</div></div>`).join("")}</div>`;
  }).join("")}</div>
  <p class="note">Each item carries the quantity it is priced on. Costs, unknown prices and assumptions are in the cost panel under the tour.</p>`;
}

  let tourScan = "";
  function loadTour(scan, name) {
    const view = document.getElementById("tour-view");
    if (scan === tourScan && view.firstChild) return;
    tourScan = scan;
    const url = `https://my.matterport.com/show/?m=${encodeURIComponent(scan)}&qs=1&brand=0&help=0&play=1`;
    view.innerHTML = `<iframe title="Matterport 3D tour" allow="xr-spatial-tracking; fullscreen" allowfullscreen src="${esc(url)}"></iframe>
      <div class="tour-bar"><span><button class="btn" data-tour-back>← Back to floor plan</button>
        <b>Matterport 3D tour</b>${name ? " · " + esc(name) : ""} · photographed as listed</span>
        <span><a class="btn" href="#costs">Cost and income estimate ↓</a> <a class="btn" href="${esc(url)}" target="_blank" rel="noopener">Open in new tab</a></span></div>`;
    view.querySelector('a[href="#costs"]').onclick = event => { event.preventDefault(); document.getElementById("costs")?.scrollIntoView({ behavior: "smooth" }); };
    view.querySelector("[data-tour-back]").onclick = () => leaveTour();
  }
  const selectedName = () => data.scan.suite ? `Suite ${data.scan.suite}` : (sp?.suite ? `Suite ${sp.suite}` : "");
  function showTour(on) {
    const host = document.getElementById("stage"), view = document.getElementById("tour-view");
    if (!on && host.classList.contains("tour-over")) live?.leaveTour?.();
    host.classList.toggle("tour-mode", on); host.classList.remove("tour-over");
    view.hidden = !on; view.classList.toggle("shown", on); view.classList.remove("warming");
    for (const el of [document.getElementById("floor-directory"), document.querySelector(".floor-resource-bar")]) if (el) el.style.display = on ? "none" : "";
    if (on) loadTour(data.scan.model_id, selectedName());
  }
  // From the floor view: the camera dives into the room and the tour fades in over it.
  function enterTour(room) {
    if (!room.scan) { flash(`${room.name}: plan only, no 3D tour on record`); return; }
    const host = document.getElementById("stage"), view = document.getElementById("tour-view");
    loadTour(room.scan, room.name);
    host.classList.add("tour-over"); view.hidden = false; view.classList.remove("warming");
    requestAnimationFrame(() => view.classList.add("shown"));
  }
  function leaveTour() {
    const host = document.getElementById("stage"), view = document.getElementById("tour-view");
    if (viewMode === "tour") { showScene(sp && data.floor ? "isolated" : "building"); return; }
    view.classList.remove("shown");
    setTimeout(() => { if (!view.classList.contains("shown")) { view.classList.add("warming"); host.classList.remove("tour-over"); } }, 650);
    live?.leaveTour?.();
  }
  function showScene(mode, floor = chosenFloor) {
    if (mode === "tour" && !data.scan.model_id) mode = "building";
    if (mode === "tour") {
      stopScene(); viewMode = "tour"; updateFloorControls();
      document.getElementById("floor-detail").hidden = true;
      document.getElementById("floor-plan-view").hidden = true;
      document.getElementById("stage").classList.remove("floor-mode", "plan-only");
      showTour(true);
      document.querySelectorAll("[data-scene-mode]").forEach(el => el.setAttribute("aria-pressed", String(el.dataset.sceneMode === "tour")));
      document.getElementById("scene-column").dataset.mode = "tour";
      rememberScene(); return;
    }
    showTour(false);
    if (!o.loaded) return;
    chosenFloor = Number(floor); viewMode = mode;
    updateFloorControls();
    const host = document.getElementById("stage");
    if (mode === "building") {
      stopScene(); host.classList.remove("floor-mode");
      document.getElementById("floor-detail").hidden = true;
      document.getElementById("floor-plan-view").hidden = true; host.classList.remove("plan-only");
      live = buildingScene(host, data); data.playIntro = false;
    } else if (live?.selectFloor) {
      live.selectFloor(chosenFloor, mode);
    } else {
      stopScene(); document.getElementById("introcap").style.display = "none";
      live = floorExplorer(host, data, makeStage, chosenFloor, (floor, mode, asset) => { chosenFloor = floor; viewMode = mode; data.interiorAsset = asset || ""; updateFloorControls(); rememberScene(); }, enterTour);
      live.selectFloor(chosenFloor, mode);
    }
    document.querySelectorAll("[data-scene-mode]").forEach(el => el.setAttribute("aria-pressed", String(el.dataset.sceneMode === mode)));
    document.getElementById("scene-column").dataset.mode = mode; // floor controls show only in the floor views
    rememberScene();
  }
  document.querySelectorAll("[data-scene-mode]").forEach(el => el.onclick = () => showScene(el.dataset.sceneMode));
  document.getElementById("floor-resource").onchange = event => { data.interiorAsset = event.target.value; showScene("isolated"); };
  updateFloorControls();
  document.getElementById("floor-picker").onchange = event => showScene("isolated", event.target.value);
  showScene(["exploded", "isolated", "building", "tour"].includes(requestedView) ? requestedView
    : sp && data.floor ? "isolated" : "building");
  const hudToggle = document.getElementById("hud-toggle");
  if (hudToggle) {
    const stageEl = document.getElementById("stage");
    const apply = (hidden) => { stageEl.classList.toggle("clean", hidden); hudToggle.setAttribute("aria-pressed", String(hidden));
      hudToggle.textContent = hidden ? "Show figures" : "Hide figures"; };
    let hidden = false; try { hidden = localStorage.getItem("secondstay-clean") === "1"; } catch {}
    apply(hidden);
    hudToggle.onclick = () => { hidden = !hidden; apply(hidden); try { localStorage.setItem("secondstay-clean", hidden ? "1" : "0"); } catch {} };
  }
  const showScanViewer = mountScanViewer(document.getElementById("scan-viewer"), data);
  const drawer = document.getElementById("evidence-drawer"), scrim = document.getElementById("drawer-scrim");
  const openDrawer = (on) => { drawer.classList.toggle("open", on); drawer.setAttribute("aria-hidden", String(!on)); scrim.hidden = !on; };
  document.getElementById("drawer-close").onclick = () => openDrawer(false);
  scrim.onclick = () => openDrawer(false);
  document.addEventListener("keydown", (event) => { if (event.key === "Escape" && drawer.isConnected) openDrawer(false); });
  const select = (key, open = false) => {
    current = data.rows.find((r) => r.key === key);
    if (open) openDrawer(true);
    app.querySelectorAll(".row").forEach((el) => el.classList.toggle("on", el.dataset.key === key));
    document.getElementById("evidence").innerHTML = evidenceView(current, data);
    mountEvidence3D(document.querySelector("#evidence [data-scene3d]"), data, current.key);
    import("/static/permit_years.mjs").then((m) => m.mountPermitYears(document.querySelector("#evidence [data-permit-years]"), data.building.property_id)).catch(() => {});
    showScanViewer(current.view === "scan");
    if (viewMode === "building" && ["units", "exits", "escape", "elevator"].includes(key)) showScene("isolated");
    else if (viewMode === "tour") return;
    else live?.setMode?.(key);
  };
  app.querySelectorAll(".row").forEach((el) => (el.onclick = () => select(el.dataset.key, true)));
  const picker = document.getElementById("scan");
  if (picker) picker.onchange = () => reopen(spaceId, picker.value);
  wireTourFilter(app, "suite-tours");
  const showAll = document.getElementById("show-all-spaces");
  if (showAll) showAll.onclick = () => { document.getElementById("market").classList.remove("collapsed"); showAll.remove(); };
  app.querySelectorAll("tr[data-space]").forEach((tr) => (tr.onclick = () => reopen(tr.dataset.space)));
  const clear = document.getElementById("clearspace");
  if (clear) clear.onclick = (event) => { event.preventDefault(); reopen(""); };
  const spaceSelect = document.getElementById("space-pick");
  if (spaceSelect) spaceSelect.onchange = () => reopen(spaceSelect.value);
  select(current.key);
}

function mountAgent(host, buildingId, spaceId, scanId) {
  let timer = null, playing = false;
  host.innerHTML = `<h2>Check with AI</h2><p class="sub">An AI agent re-reads every record for this building, cross-checks them and lists what to confirm next.</p>
    <p class="sub" id="agent-config" hidden>Checking local model settings…</p>
    <div class="agent-actions"><button class="btn primary" id="agent-start" disabled>Run the check</button>
    <button class="btn" id="agent-replay" disabled>Show last check</button></div>
    <label class="sub agent-history">Earlier checks <select id="agent-history" aria-label="Earlier checks"></select></label>
    <p id="agent-status" role="status" aria-live="polite"></p>
    <ol class="agent-log" id="agent-log"></ol><div class="agent-result" id="agent-result"></div>`;
  const el = (id) => host.querySelector(`#agent-${id}`);
  const query = new URLSearchParams({ space: spaceId, scan: scanId });
  const endpoint = `/api/spaces/${buildingId}/reviews`;
  const request = async (url, options) => {
    const response = await fetch(url, options);
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || "The evidence service is unavailable.");
    return data;
  };
  const showResult = (run) => {
    if (!run.result) { el("result").innerHTML = ""; return; }
    el("result").innerHTML = `<h3>Recorded agent checklist</h3>${counts(run.result.counts)}
      <p class="sub">This review uses the sources gathered during this run. Image observations are read from images, not measured.</p>
      <a class="btn" href="/api/reviews/${encodeURIComponent(run.id)}/report.md">Export this review</a>
      <details><summary>Evidence and who confirms it</summary>${run.result.rows.map(r => `<article>
        <b>${esc(r.requirement)}</b> ${badge(r.state)}<p>${esc(r.evidence)}</p>
        <p class="sub">${esc(r.layer)} · To be confirmed by ${esc(r.confirmed_by)}</p></article>`).join("")}</details>`;
  };
  const draw = (run, limit = run.events.length) => {
    const entries = run.events.slice(0, limit);
    el("log").innerHTML = entries.filter(e => e.stage !== "finished").map(e => `<li>${esc(e.message)}
      <small>${esc(new Date(e.at).toLocaleTimeString())}${e.stage ? (e.by && e.by !== "lead" ? ` · delegated to ${esc(e.by)}` : " · tool selected") : ""}</small></li>`).join("");
    for (const event of entries.filter(e => e.stage === "finished" && (e.observation?.unavailable || e.observation?.error))) {
      const item = document.createElement("li");
      item.textContent = `${event.action.replaceAll("_", " ")}: ${event.observation.unavailable || event.observation.error}`;
      el("log").appendChild(item);
    }
    el("status").textContent = `${playing ? "Recorded replay" : run.mode === "live" ? "Model run" : "Test run"} · ${limit < run.events.length ? "playing" : run.status}`;
    if (limit === run.events.length) showResult(run);
  };
  const history = async () => {
    const data = await request(`${endpoint}?${query}`);
    if (!host.isConnected) return;
    el("history").innerHTML = data.runs.map(r => `<option value="${esc(r.id)}">${esc(new Date(r.started_at).toLocaleString())} · ${esc(r.mode)} · ${esc(r.status)}</option>`).join("");
    el("replay").disabled = !data.runs.length;
    return data.runs;
  };
  const poll = async (id) => {
    if (!host.isConnected) return;
    try {
      const run = await request(`/api/reviews/${encodeURIComponent(id)}`);
      if (!host.isConnected) return;
      draw(run);
      if (run.status === "running") timer = setTimeout(() => poll(id), 1000);
      else { el("start").disabled = false; await history(); }
    } catch (error) { if (host.isConnected) { el("status").textContent = error.message; el("start").disabled = false; } }
  };
  el("start").onclick = async () => {
    clearTimeout(timer); playing = false; el("start").disabled = true; el("replay").disabled = true;
    el("result").innerHTML = ""; el("log").innerHTML = "";
    try {
      const run = await request(endpoint, { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({space:spaceId,scan:scanId}) });
      await poll(run.id);
    } catch (error) { el("status").textContent = error.message; el("start").disabled = false; await history(); }
  };
  el("replay").onclick = async () => {
    clearTimeout(timer); playing = true; el("result").innerHTML = "";
    try {
      const run = await request(`/api/reviews/${encodeURIComponent(el("history").value)}`);
      let n = 0;
      const tick = () => {
        if (!host.isConnected) return;
        draw(run, ++n);
        if (n < run.events.length) timer = setTimeout(tick, 550);
      };
      tick();
    } catch (error) { el("status").textContent = error.message; }
  };
  Promise.all([request("/api/agent"), history()]).then(([config, runs]) => {
    if (!host.isConnected) return;
    el("config").textContent = config.message;
    el("start").disabled = !config.ready;
    if (runs?.[0]?.status === "running") { el("start").disabled = true; poll(runs[0].id); }
  }).catch(error => { if (host.isConnected) el("status").textContent = error.message; });
}

async function showPlans() {
  const data = await api("/api/spaces");
  const withPlans = data.spaces.filter((s) => s.floor_plans?.length)
    .sort((a, c) => c.floor_plans.filter((p) => p.source === "building").length - a.floor_plans.filter((p) => p.source === "building").length);
  const total = withPlans.reduce((t, s) => t + s.floor_plans.length, 0);
  app.innerHTML = `
    <p style="margin:0 0 10px"><a href="#/search">← All buildings</a></p>
    <h1>Floor plans CoStar holds for these buildings</h1>
    <p class="sub">${total} plans on ${withPlans.length} of ${data.spaces.length} buildings. Plans are attached to building records or listed spaces.
      Check each sheet for its floor, suite and coverage. Select a plan to open it at full size.</p>
    ${withPlans.map((s) => {
      const shown = s.floor_plans;
      return `<div class="planhead"><h3>${esc(s.name || s.address)}</h3>
        <span class="sub">${s.floor_plans.filter((p) => p.source === "building").length} building attachments · ${s.floor_plans.filter((p) => p.source === "space").length} listing attachments ·
          <a href="#/space/${s.property_id}">open the evidence review</a></span></div>
        <div class="plans">${shown.map((p) => `<a class="plan" href="${esc(p.url)}" target="_blank" rel="noopener">
          <img loading="lazy" src="${esc(p.url)}" alt="Floor plan"><span>${p.source === "building" ? "Building attachment" : "Listing attachment"} · ${esc(p.caption)}</span></a>`).join("")}</div>`;
    }).join("")}`;
}

async function showPlansToRead(page) {
  const data = await api("/api/spaces");
  const chosen = data.spaces.filter((s) => s.plan_to_read);
  const s = chosen[page];
  if (!s) { app.innerHTML = '<p class="loading">No more plans.</p>'; return; }
  const r = s.plan_reading;
  app.innerHTML = `
    <p style="margin:0 0 8px"><a href="#/plans">← All floor plans</a> · the plan read for each building, ${page + 1} of ${chosen.length}
      · ${page ? `<a href="#/plans/read/${page - 1}">previous</a> · ` : ""}${page + 1 < chosen.length ? `<a href="#/plans/read/${page + 1}">next</a>` : ""}
      · <a href="#/space/${s.property_id}">${esc(s.name || s.address)}</a></p>
    <div style="background:#fff;border:1px solid var(--line);overflow:hidden">
      <div style="font-size:12px;font-weight:600;color:var(--ink);background:var(--paper2);padding:4px 8px">#${s.property_id} · ${s.plan_to_read.source === "building" ? "building attachment" : "listing attachment"} · ${s.stories ?? "?"} stories on record${r ? ` · read: ${r.stairs} stairs, ${r.elevators} elevators` : ""}</div>
      <img src="${esc(s.plan_to_read.url)}" alt="Floor plan" style="width:100%;height:740px;object-fit:contain;display:block"></div>`;
}

function flash(text) {
  const el = document.getElementById("flash");
  if (!el) return;
  el.textContent = text; el.style.display = "block";
  clearTimeout(flash.timer); flash.timer = setTimeout(() => { el.style.display = "none"; }, 2600);
}

function showError(error) { if (error.message === "stale") return; app.innerHTML = `<p class="loading">${esc(error.message)}</p>`; }
function route() {
  document.body.classList.toggle("home", !/^#\/[a-z]/i.test(location.hash));
  const match = location.hash.match(/^#\/space\/(\d+)/);
  visit += 1;
  stopScene();
  app.innerHTML = '<p class="loading">Reading the three data layers…</p>';
  const read = location.hash.match(/^#\/plans\/read\/(\d+)/);
  const selection = new URLSearchParams(location.hash.split("?")[1] || "");
  (match ? showSpace(match[1], selection.get("scan"), undefined, selection.get("space"), selection.get("floor"), selection.get("view"), selection.get("interior")) : read ? showPlansToRead(Number(read[1])) : location.hash.startsWith("#/search") ? showSearch(selection.get("q") || "") : location.hash.startsWith("#/plans") ? showPlans() : showList()).catch(showError);
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
route();
</script>
