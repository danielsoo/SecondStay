<style>
    :root {

  }

  /* 3D stage */

  #stage .hud.tr .badge { font-size: 12px; }
  .tour-filter { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 0 0 10px; }
  .tour-filter button { font: 600 12px var(--sans); padding: 5px 10px; border-radius: 0; cursor: pointer;
    background: var(--panel2); color: var(--muted); border: 1px solid var(--line); }
  .tour-filter button[aria-pressed="true"] { color: var(--ink); border-color: var(--accent); background: var(--select); }
  .tour-yes { color: var(--accent); font-weight: 600; }
  .hud-toggle { position: absolute; z-index: 4; right: 12px; bottom: 58px; font: 600 12px var(--sans); padding: 5px 9px; border-radius: 0;
    background: var(--surface); color: var(--ink); border: 1px solid var(--line); cursor: pointer; }
  .hud-toggle:hover { border-color: var(--accent); }

  .city-card b { color: var(--accent); font-size: 13px; } .city-card .why { color: var(--muted); }
  .city-card .cost-line { color: var(--found); font-weight: 600; }
  .stage.city .tour-switch { pointer-events: auto; margin-bottom: 6px; }

  .btn.primary { background: var(--accent); color: #FFFFFF; border-color: var(--accent); font-weight: 600; }

  #tour-view { position: absolute; inset: 0; z-index: 4; background: #000; display: flex; flex-direction: column;
    opacity: 0; transform: scale(0.94); transition: opacity 0.6s ease, transform 0.6s ease; }
  #tour-view.shown { opacity: 1; transform: none; }
  /* Kept loaded after leaving, behind the floor view; a tour first loaded while invisible stays black, so none is preloaded. */
  #tour-view.warming { opacity: 0; pointer-events: none; z-index: -1; transform: none; transition: none; }
  #tour-view.warming * { pointer-events: none; }

  #tour-view[hidden] { display: none; }

    background: var(--surface); font-size: 13px; color: var(--muted); }
  #tour-view .tour-bar b { color: var(--ink); }
  .stage.tour-mode { height: 640px; }
  .stage.tour-mode .hud, .stage.tour-mode .gl, .stage.tour-mode .labels, .stage.tour-mode .flat { display: none; }
  .stage .flat { position: absolute; inset: 0; z-index: 1; overflow: hidden; pointer-events: none; }

  .stage .labels { z-index: 2; }
  .floor-card { font: 12px var(--sans); line-height: 1.45; padding: 6px 9px; transform-origin: right bottom; border-radius: 0; background: var(--surface);
    border: 1px solid var(--line); color: var(--ink); white-space: nowrap; }
  .floor-card b { color: var(--accent); }

  .ledger-bar { display: flex; height: 12px; border-radius: 0; overflow: hidden; margin: 8px 0; background: var(--paper2); }

  .ledger-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
  .ledger-list li { display: grid; grid-template-columns: 10px minmax(110px, auto) 110px 1fr auto; gap: 10px; align-items: baseline; font-size: 13px; }
  .ledger-list i { width: 10px; height: 10px; border-radius: 0; display: inline-block; }
  .ledger-list .num { font-family: var(--sans); text-align: right; }

    border-radius: 0; padding: 6px 10px; font-size: 12.5px; display: none; }

  /* list of spaces */
  table.spaces { width: 100%; border-collapse: collapse; }
  table.spaces th { text-align: left; font: 500 12px var(--sans); letter-spacing: 0; color: var(--muted);
    padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  table.spaces td { padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  table.spaces tr:last-child td { border-bottom: 0; }

  td.num, th.num { text-align: right; font-family: var(--sans); font-size: 13px; }
  .name { font-weight: 600; }

  /* one space */
  .cols { display: grid; grid-template-columns: minmax(340px, 5fr) 7fr; gap: 16px; align-items: start; margin-top: 16px; }
  @media (max-width: 900px) { .cols { grid-template-columns: 1fr; } .hud.tl { max-width: 90%; } .stage { height: 460px; } }
  .rows { overflow: hidden; }
  .row { display: block; width: 100%; text-align: left; background: none; border: 0;
    border-bottom: 1px solid var(--line); padding: 11px 14px; cursor: pointer; }
  .row:last-child { border-bottom: 0; }

  .evidence iframe { width: 100%; height: 460px; border: 0; border-radius: 0; background: #000; }
  .evidence [hidden] { display: none !important; }

  img.sheet { width: 100%; border-radius: 0; border: 1px solid var(--line); display: block; margin-bottom: 8px; }
  .legend { font-size: 12px; color: var(--muted); margin: 6px 0 0; }

  .viz .age-mark { stroke: var(--ink); stroke-width: 2; }
  .viz .area-all { fill: var(--nodata); } .viz .area-use { fill: var(--accent); } .viz .unit-cell { fill: var(--accent); opacity: 0.75; }

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const app = document.getElementById("app");
const tip = document.getElementById("tip");
const FT = 0.3048, HIGH_RISE_FT = 75;
// Pacific blue (has a 3D tour, windows) and permit ochre (plan only, doors) read on paper and on aerial photos.
const CYAN = 0x1c7a98, AMBER = 0xc08a2e, GHOST = 0x8c8a82, INK = 0x1f1e1b, PAPER = 0xf7f6f2;
const STATE_CLASS = {
  "Evidence found": ["s-found", "●"], "Possible issue": ["s-issue", "▲"],
  "Not enough data": ["s-nodata", "○"], "Needs professional review": ["s-review", "◆"],

const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const badge = (state, text) => {

  return `<span class="badge ${cls}" title="${esc(state)}"><i>${glyph}</i>${esc(text ?? state)}</span>`;
};
// Evidence states as one proportional bar with the numbers beside it, in place of four badges.
const STATE_GLYPH = { "Evidence found": "✓", "Possible issue": "!", "Not enough data": "–", "Needs professional review": "?" };
// Small line icons for the key figures (the stroke follows the text colour).
const svgIcon = (d) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const ICON = {
  cost: svgIcon('<path d="M12 3v18"/><path d="M16.5 7.5c0-1.7-2-3-4.5-3s-4.5 1.3-4.5 3 2 2.6 4.5 3 4.5 1.3 4.5 3-2 3-4.5 3-4.5-1.3-4.5-3"/>'),
  check: svgIcon('<circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.8 2.8L16.5 9"/>'),
  flag: svgIcon('<path d="M5 21V4"/><path d="M5 4h11l-2 4 2 4H5"/>'),
  area: svgIcon('<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 10h16M10 4v16"/>'),
  rent: svgIcon('<path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-5h4v5"/>'),
};
const BAR_CLASS = { "Evidence found": "s-found", "Possible issue": "s-issue", "Not enough data": "s-nodata", "Needs professional review": "s-review" };
const ruleMeter = (c) => {
  const total = Object.values(c || {}).reduce((t, n) => t + n, 0), found = (c || {})["Evidence found"] || 0;
  if (!total) return '<span class="sub">–</span>';
  return `<span class="meter" title="${found} of ${total} rules have evidence"><span style="width:${(found / total * 100).toFixed(0)}%"></span></span> <span class="meter-n">${found}/${total}</span>`;
};
const stateBar = (c) => {
  const total = Object.values(c).reduce((t, n) => t + n, 0) || 1;
  return `<div class="state-bar" role="img" aria-label="${Object.entries(c).map(([s, n]) => `${s} ${n}`).join(", ")}">
    <div class="bar-track">${Object.entries(c).filter(([, n]) => n).map(([s, n]) => `<span class="${BAR_CLASS[s] || ""}" style="width:${(n / total * 100).toFixed(1)}%" title="${esc(s)}: ${n}"></span>`).join("")}</div>
    <div class="bar-keys">${Object.entries(c).map(([s, n]) => `<span class="${BAR_CLASS[s] || ""}">${n} ${esc(s.toLowerCase())}</span>`).join("")}</div></div>`;
};
const counts = (c) => `<div class="counts">${Object.entries(c).map(([s, n]) => badge(s, `${s} ${n}`)).join("")}</div>`;
const shortCounts = (c) => `<div class="counts">${Object.entries(c).map(([s, n]) => badge(s, n)).join("")}</div>`;

let visit = 0; // goes up on every navigation, so a slow answer for an earlier screen is dropped
async function api(path) {
  const mine = visit;
  const response = await fetch(path);
  if (!response.ok) throw new Error(`Request did not complete (${response.status})`);
  const data = await response.json();
  if (mine !== visit) throw new Error("stale");
  return data;
}

/* ---------- shared 3D plumbing ---------- */

let live = null; // the scene currently on screen
const introSeen = new Set(); // buildings whose photo-to-model intro has already played
function stopScene() { if (live) { live.dispose(); live = null; } tip.style.display = "none"; }

function makeStage(host, options = {}) {
  const gl = host.querySelector(".gl"), labelHost = host.querySelector(".labels");
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  gl.appendChild(renderer.domElement);
  const labels = new CSS2DRenderer({ element: labelHost });
  // Plan images cannot be read as textures (their host sends no cross-origin header), so they are laid in as page elements.
  const flatHost = document.createElement("div"); flatHost.className = "flat"; host.insertBefore(flatHost, labelHost);
  const flat = new CSS3DRenderer({ element: flatHost });
  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(PAPER, 0.0016);
  const camera = new THREE.PerspectiveCamera(42, 1, 0.5, 6000);
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.autoRotate = true; controls.autoRotateSpeed = 0.55;
  controls.maxPolarAngle = Math.PI * 0.49;
  scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8578, 1.0));
  const sun = new THREE.DirectionalLight(0xffffff, 0.9); sun.position.set(120, 260, 80); scene.add(sun);

  const composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  if (options.bloom === true) composer.addPass(new UnrealBloomPass(new THREE.Vector2(1, 1), 0.5, 0.6, 0.72)); // flat theme: no glow unless asked
  composer.addPass(new OutputPass());

  const size = () => {
    const w = host.clientWidth, h = host.clientHeight;
    renderer.setSize(w, h); composer.setSize(w, h); labels.setSize(w, h); flat.setSize(w, h);
    camera.aspect = w / h; camera.updateProjectionMatrix();
  };
  const watcher = new ResizeObserver(size); watcher.observe(host); size();
  renderer.domElement.addEventListener("pointerdown", () => { controls.autoRotate = false; });

  const ticks = [];
  let frame = 0, alive = true;
  const clock = new THREE.Clock();
  const loop = () => {
    if (!alive) return;
    frame = requestAnimationFrame(loop);
    const t = clock.getElapsedTime();
    ticks.forEach((fn) => fn(t));
    controls.update(); composer.render(); flat.render(scene, camera); labels.render(scene, camera);
  };
  loop();
  const dispose = () => {
    alive = false; cancelAnimationFrame(frame); watcher.disconnect(); controls.dispose();
    scene.traverse((o) => { o.geometry?.dispose(); if (o.material) [].concat(o.material).forEach((m) => { m.map?.dispose(); m.dispose(); }); });
    composer.dispose(); renderer.dispose(); gl.replaceChildren(); labelHost.replaceChildren(); flatHost.remove();
  };
  return { scene, camera, controls, renderer, ticks, dispose };
}

function tag(text, cls = "") {
  const el = document.createElement("div");
  el.className = `tag3d ${cls}`; el.textContent = text;
  return new CSS2DObject(el);
}
const lineMat = (color, opacity = 1) => new THREE.LineBasicMaterial({ color, transparent: opacity < 1, opacity });
function polyline(points, material, closed = false) {
  const geo = new THREE.BufferGeometry().setFromPoints(points);
  return closed ? new THREE.LineLoop(geo, material) : new THREE.Line(geo, material);
}

/* ---------- one building in its surroundings ---------- */

function closestPair(ringsA, ringsB) {
  let best = { d: Infinity };
  const seg = (p, a, b) => {
    const dx = b[0] - a[0], dy = b[1] - a[1], len = dx * dx + dy * dy;
    const t = len ? Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / len)) : 0;
    return [a[0] + t * dx, a[1] + t * dy];
  };
  const scan = (from, to, flip) => from.forEach((ra) => ra.forEach((p) => to.forEach((rb) => {
    for (let i = 0; i < rb.length - 1; i++) {
      const q = seg(p, rb[i], rb[i + 1]), d = Math.hypot(p[0] - q[0], p[1] - q[1]);
      if (d < best.d) best = flip ? { d, a: q, b: p } : { d, a: p, b: q };
    }
  })));
  scan(ringsA, ringsB, false); scan(ringsB, ringsA, true);
  return best;
}

function introPhotoHeight(width, depth, centerX, centerY, aspect, fov, preferred) {
  // Keep every viewport edge within the georeferenced photo, without stretching it.
  const halfWidth = Math.max(0, width / 2 - Math.abs(centerX));
  const halfDepth = Math.max(0, depth / 2 - Math.abs(centerY));
  const tangent = Math.tan(fov * Math.PI / 360);
  return Math.min(preferred, 0.98 * Math.min(halfWidth / aspect, halfDepth) / tangent);
}

// Vexcel's surface heights as a colourless, see-through shell: whatever stands above the ground (neighbouring
// buildings, trees, cars) keeps its shape without the stretched photo. Ground-level cells draw nothing, and cells
// inside `flatten` rings (this building, in the same metre grid) are left out so the drawn model stands alone.
// The grid's centre is the image centre; its cells run west to east, then north to south.
const SURFACE_MIN_M = 1.2;
function surfaceShell(surface, width, depth, flatten = [], material = null) {
  const n = surface.size, geometry = new THREE.PlaneGeometry(width, depth, n - 1, n - 1).rotateX(-Math.PI / 2);
  const position = geometry.attributes.position;
  const inside = (x, y, ring) => { let hit = false; for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const [xi, yi] = ring[i], [xj, yj] = ring[j];
    if ((yi > y) !== (yj > y) && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) hit = !hit; } return hit; };
  const pad = 1.5; // metres: the footprint edge in the surface is a little soft
  const grown = flatten.map((ring) => { const mx = ring.reduce((a, p) => a + p[0], 0) / ring.length, my = ring.reduce((a, p) => a + p[1], 0) / ring.length;
    return ring.map(([px, py]) => { const d = Math.hypot(px - mx, py - my) || 1; return [px + ((px - mx) / d) * pad, py + ((py - my) / d) * pad]; }); });
  const raised = new Uint8Array(position.count);
  for (let i = 0; i < position.count; i++) {
    const x = position.getX(i), y = -position.getZ(i);
    const h = grown.some((ring) => inside(x, y, ring)) ? 0 : Math.max(0, surface.heights[i]);
    position.setY(i, h); raised[i] = h >= SURFACE_MIN_M ? 1 : 0;
  }
  // Keep only triangles that touch something standing; the photo underneath shows the ground itself.
  const index = geometry.index.array, kept = [];

    color: 0xd7dee2, transparent: true, opacity: 0.32, roughness: 0.85, side: THREE.DoubleSide, depthWrite: false }));
  mesh.renderOrder = 1;

}

function buildingScene(host, data) {
  const o = data.outside, b = data.building;
  const stage = makeStage(host);
  const { scene, camera, controls, ticks } = stage;
  const [west, south, east, north] = o.bbox;
  const lat0 = (south + north) / 2, lon0 = (west + east) / 2;
  const kx = 111320 * Math.cos((lat0 * Math.PI) / 180), ky = 110540;
  const toM = ([lon, lat]) => [(lon - lon0) * kx, (lat - lat0) * ky]; // x east, y north
  const subject = o.footprint.map((ring) => ring.map(toM));
  const others = o.neighbors.map((ring) => ring.map(toM));
  const all = subject.flat();
  const minX = Math.min(...all.map((p) => p[0])), maxX = Math.max(...all.map((p) => p[0]));
  const minY = Math.min(...all.map((p) => p[1])), maxY = Math.max(...all.map((p) => p[1]));

  const at = ([x, y], h = 0) => new THREE.Vector3(x - cx, h, -(y - cy)); // north is -Z, up is Y
  const v3 = (x, y, z) => new THREE.Vector3(x, y, z);

  const H = (o.height_ft || (b.stories || 2) * 12) * FT;
  const stories = b.stories || Math.max(1, Math.round(H / 4));
  const floorH = H / stories;
  const topFt = data.top_occupied_ft, highRise = topFt != null && topFt >= HIGH_RISE_FT;
  const main = highRise ? AMBER : CYAN;
  const white = lineMat(0xffffff, 0.95);

  // ground: the aerial image, toned down so the drawing reads on top of it
  const gw = (east - west) * kx, gh = (north - south) * ky;
  const groundMat = new THREE.MeshBasicMaterial({ color: 0xe3e5e1 });
  new THREE.TextureLoader().load(`/api/spaces/${b.property_id}/aerial.jpg`, (texture) => {
    texture.colorSpace = THREE.SRGBColorSpace; texture.anisotropy = 8; groundMat.map = texture; groundMat.needsUpdate = true;
  });
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(gw, gh).rotateX(-Math.PI / 2), groundMat);
  ground.position.set(-cx, 0, cy); scene.add(ground);
  // Wider, lower-resolution real imagery beneath the detailed central photo.
  // Give it its own geographic bounds; stretching the central image would misplace buildings.
  let contextMat = null;
  if (o.context_bbox?.length === 4) {
    const [cw, cs, ce, cn] = o.context_bbox;
    const [mx, my] = toM([(cw + ce) / 2, (cs + cn) / 2]);
    contextMat = new THREE.MeshBasicMaterial({ color: groundMat.color });
    const contextGround = new THREE.Mesh(new THREE.PlaneGeometry((ce - cw) * kx, (cn - cs) * ky).rotateX(-Math.PI / 2), contextMat);
    contextGround.position.set(mx - cx, -0.1, -(my - cy));
    contextGround.visible = false; scene.add(contextGround);
    new THREE.TextureLoader().load(`/api/spaces/${b.property_id}/aerial.jpg?context=1`, (texture) => {
      if (!host.isConnected) { texture.dispose(); return; }
      texture.colorSpace = THREE.SRGBColorSpace; texture.anisotropy = 8;

  }
  const grid = new THREE.GridHelper(Math.max(gw, gh) * 3, 60, 0xd3d0c7, 0xe4e2db);
  grid.position.y = -0.3; scene.add(grid);
  // Lay the photo over Vexcel's surface heights, so the trees, cars, lamps and neighbouring buildings in it stand up

  let draped = false;
  let surfaceMesh = null;
  fetch(`/api/spaces/${b.property_id}/surface.json`).then((r) => (r.ok ? r.json() : null)).then((surface) => {
    if (!surface?.heights || !host.isConnected) return;
    const n = surface.size;
    surfaceMesh = surfaceShell(surface, gw, gh, subject);
    surfaceMesh.position.copy(ground.position); scene.add(surfaceMesh);
    draped = true;
    // Standing neighbours can now block the view, so look from the side where the surface is lowest.
    const heightAt = (x, y) => {
      const c = Math.round(((x + gw / 2) / gw) * (n - 1)), r = Math.round(((gh / 2 - y) / gh) * (n - 1));
      return c < 0 || r < 0 || c >= n || r >= n ? 0 : Math.max(0, surface.heights[r * n + c]);
    };
    const near = span * 0.6, far = Math.min(Math.max(gw, gh) / 2, reach), base = Math.PI / 4;
    let best = { score: Infinity, phi: base };
    for (let k = 0; k < 16; k++) {
      const phi = base + (k * Math.PI) / 8;
      let score = 0;

      }
      if (score < best.score - 2) best = { score, phi };
    }
    turn = -(best.phi - base);
    if (!intro) setMode(lastKey);
  }).catch(() => {});

  const shapeOf = (ring) => new THREE.Shape(ring.map(([x, y]) => new THREE.Vector2(x - cx, y - cy)));
  const extrude = (ring, height) => new THREE.ExtrudeGeometry(shapeOf(ring), { depth: height, bevelEnabled: false }).rotateX(-Math.PI / 2);

  // neighbours as ghosts; the closest one is kept apart so it can be brought forward
  const pair = others.length ? closestPair(subject, others) : {};
  const nearestIndex = pair.b ? others.findIndex((ring) => ring.some((p, k) => k < ring.length - 1 &&
    Math.abs((ring[k + 1][0] - p[0]) * (pair.b[1] - p[1]) - (ring[k + 1][1] - p[1]) * (pair.b[0] - p[0])) < 0.5 &&
    Math.min(p[0], ring[k + 1][0]) - 0.5 <= pair.b[0] && pair.b[0] <= Math.max(p[0], ring[k + 1][0]) + 0.5 &&
    Math.min(p[1], ring[k + 1][1]) - 0.5 <= pair.b[1] && pair.b[1] <= Math.max(p[1], ring[k + 1][1]) + 0.5)) : -1;
  const ghosts = new THREE.Group(), nearest = new THREE.Group(); scene.add(ghosts, nearest);
  const ghostFill = new THREE.MeshStandardMaterial({ color: 0xaeb9b3, transparent: true, opacity: 0.42, roughness: 0.9, depthWrite: false });
  const ghostEdge = lineMat(0xc6d2cf, 0.18);
  const nearFill = new THREE.MeshStandardMaterial({ color: 0xb1bba9, transparent: true, opacity: 0.42, roughness: 0.9, depthWrite: false });
  const nearEdge = lineMat(0xffffff, 0.45);
  others.forEach((ring, k) => {
    const geo = extrude(ring, Math.max(3, (o.neighbor_heights_ft?.[k] ?? 20) * FT));
    const close = k === nearestIndex;

    (close ? nearest : ghosts).add(new THREE.LineSegments(new THREE.EdgesGeometry(geo, 30), close ? nearEdge : ghostEdge));
  });

  const shell = new THREE.Group(); scene.add(shell);
  const shellFill = new THREE.MeshStandardMaterial({ color: 0xd5c7ad, transparent: true, opacity: 0.6, roughness: 0.65, metalness: 0.1, side: THREE.DoubleSide, depthWrite: false });
  const shellEdge = lineMat(main, 1);
  subject.forEach((ring) => {
    const geo = extrude(ring, H);
    shell.add(new THREE.Mesh(geo, shellFill));
    shell.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo, 25), shellEdge));
  });
  const slabs = new THREE.Group(); scene.add(slabs);
  const slabFill = new THREE.MeshBasicMaterial({ color: main, transparent: true, opacity: 0, side: THREE.DoubleSide, depthWrite: false });
  const slabEdge = lineMat(main, 0.32);
  const topFill = slabFill.clone();  // the floor that is opened
  const marketFill = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0, side: THREE.DoubleSide, depthWrite: false });
  const marketEdge = lineMat(0xffffff, 0.9);
  const marketed = new Set((b.spaces || []).map((sp) => sp.floor).filter(Boolean));
  const openAt = Math.min(stories, Math.max(1, data.floor || stories)) - 1; // index of the floor that opens
  const levels = [], slabMeshes = [];
  for (let n = 0; n < stories; n++) {
    const level = new THREE.Group(); level.userData.base = n * floorH; level.userData.floor = n + 1;
    const onMarket = marketed.has(n + 1);
    subject.forEach((ring) => {
      const mesh = new THREE.Mesh(new THREE.ShapeGeometry(shapeOf(ring)).rotateX(-Math.PI / 2), n === openAt ? topFill : onMarket ? marketFill : slabFill);
      mesh.userData.floor = n + 1; level.add(mesh); slabMeshes.push(mesh);
      level.add(polyline(ring.map((p) => at(p, 0)), onMarket || n === openAt ? marketEdge : slabEdge, true));
    });
    slabs.add(level); levels.push(level);
  }
  const openLevel = levels[openAt];

  // Detailed interiors live in the floor explorer; source images stay in the document view.
  const planGroup = new THREE.Group(); openLevel.add(planGroup);
  const wallMat = lineMat(0xffffff), windowMat = lineMat(CYAN), doorMat = lineMat(AMBER);
  const floorLines = null, planImage = null, planSpan = span;

  // a scan line that keeps travelling up the building
  const sweep = new THREE.Group(); scene.add(sweep);
  subject.forEach((ring) => sweep.add(polyline(ring.map((p) => at(p, 0)), white, true)));

  // 75 ft threshold, measured to the highest occupied level
  const limit = new THREE.Group(); scene.add(limit);
  const limitY = HIGH_RISE_FT * FT, half = span * 0.62;
  const limitMat = new THREE.MeshBasicMaterial({ color: AMBER, transparent: true, opacity: 0.08, side: THREE.DoubleSide, depthWrite: false });
  const plane = new THREE.Mesh(new THREE.PlaneGeometry(half * 2, half * 2).rotateX(-Math.PI / 2), limitMat);
  plane.position.y = limitY; limit.add(plane);
  const corners = [[-half, -half], [half, -half], [half, half], [-half, half]].map(([x, z]) => new THREE.Vector3(x, limitY, z));
  const limitLine = lineMat(AMBER, 0.9);
  limit.add(polyline(corners, limitLine, true));
  const limitTag = tag("75 ft · high-rise threshold", "amber"); limitTag.position.copy(corners[2]); limit.add(limitTag);

  // height read-out beside the corner furthest east
  const dims = new THREE.Group(); scene.add(dims);
  const east0 = subject[0].reduce((m, p) => (p[0] > m[0] ? p : m)), west0 = subject[0].reduce((m, p) => (p[0] < m[0] ? p : m));
  const off = at(east0).add(new THREE.Vector3(span * 0.08, 0, 0));
  dims.add(polyline([off.clone(), off.clone().setY(H)], white));
  [0, H].forEach((y) => dims.add(polyline([off.clone().setY(y).add(new THREE.Vector3(-2.5, 0, 0)), off.clone().setY(y).add(new THREE.Vector3(2.5, 0, 0))], white)));
  const tags = []; // labels do not follow a hidden group, so each is switched on its own
  if (o.height_ft) { const t = tag(`roof ≈ ${Math.round(o.height_ft)} ft`); t.position.copy(off.clone().setY(H)); dims.add(t); tags.push([t, "dims"]); }
  if (topFt != null && stories > 1) {
    const t = tag(`highest occupied level ≈ ${Math.round(topFt)} ft`, highRise ? "amber" : "cyan");
    t.position.copy(at(west0, topFt * FT)); dims.add(t); tags.push([t, "dims"]);
  }

  let gapMid = new THREE.Vector3(0, 4, 0), gapDir = new THREE.Vector3(1, 0, 0), gapLen = 10;
  if (pair.a) {

    [a, c].forEach((p) => gap.add(polyline([p.clone().setY(0), p.clone().setY(7)], white)));
    gapMid = a.clone().lerp(c, 0.5); gapLen = Math.max(a.distanceTo(c), 1);

    const t = tag(`≈ ${Math.round(pair.d / FT)} ft to the closest structure`); t.position.copy(gapMid.clone().setY(8)); gap.add(t); tags.push([t, "gap"]);
  }

  const streetMat = lineMat(0x9fe6ff, 0.55), laneMat = lineMat(GHOST, 0.25);
  (data.streets || []).forEach((street) => {

  });

    height: { pos: v(reach * 1.05, H * 0.5, reach * 0.3), look: v(0, H * 0.5, 0), limit: 0.24, ghost: 0.16 },
    elevator: { pos: v(reach * 0.85, H * pulled * 0.62, reach * 0.85), look: v(0, H * pulled * 0.5, 0), explode: 1, ghost: 0.08, limit: 0.03 },
    units: { ...openShot },
    exits: { ...openShot, pos: v(frame * 0.15, openY + frame * 1.45, frame * 0.5) },
    escape: { ...openShot, pos: v(frame * 1.3, openY + frame * 0.55, frame * 0.5) },
    separation: { pos: gapMid.clone().add(side.clone().multiplyScalar(Math.max(70, gapLen * 4, span))).setY(Math.max(55, gapLen * 2.5, span * 0.7)), look: gapMid.clone(), ghost: 0.14, near: 0.85, shell: 0.34, limit: 0 },
    access: { pos: v(0.5, Math.max(reach * 1.5, 230), 1), look: v(0, 0, 0), flat: 0.06, ghost: 0.5, shell: 0.3, limit: 0, street: 1, bright: 1 },
    sprinklers: { pos: v(reach * 0.5, H * 0.62, reach * 0.62), look: v(0, H * 0.5, 0), ghost: 0.1, shell: 0.3, limit: 0.03 },
    seismic: { pos: v(-reach * 0.6, H * 0.3, reach * 0.75), look: v(0, H * 0.42, 0), ghost: 0.1, shell: 0.28, limit: 0.03 },
  };
  shots.alarm = shots.sprinklers; shots.historic = shots.seismic; shots.age = shots.zone = shots.stay = shots[""];

  const want = { ...now };
  let fly = null;
  const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  // Shots that look at the building from a fixed side are turned to the clearest side once the surface is known.
  const aim = (key, shot) => (turn && !["separation", "access"].includes(key)
    ? { ...shot, pos: shot.pos.clone().sub(shot.look).applyAxisAngle(v(0, 1, 0), turn).add(shot.look) } : shot);
  const setMode = (key) => {
    lastKey = key;
    if (intro) return; // the intro ends by coming to this view

    Object.assign(want, { explode: 0, lift: 0, flat: 1, ghost: 0.42, near: 0.42, shell: 0.2, limit: 0.08, street: 0.55 }, shot);
    want.near = shot.near ?? want.ghost;
    fly = { t0: performance.now(), ms: 1300, fromPos: camera.position.clone(), fromLook: controls.target.clone(), toPos: shot.pos, toLook: shot.look, from: { ...now } };
    controls.autoRotate = false;
    groundMat.color.set(shot.bright ? 0xffffff : 0xe3e5e1);
    const closed = !shot.explode;
    dims.visible = closed && ["", "age", "zone", "stay", "height", "sprinklers", "alarm", "seismic", "historic"].includes(key);
    gap.visible = closed && ["", "age", "zone", "stay", "separation"].includes(key);
    tags.forEach(([t, group]) => { t.visible = group === "dims" ? dims.visible : gap.visible; });
    limitTag.visible = closed && ["", "age", "zone", "stay", "height"].includes(key);

    if (intro) stepIntro();
    if (contextMat) contextMat.color.copy(groundMat.color);

    shell.scale.y = Math.max(grow, 0.001); slabs.visible = grow > 0.02;

    marketFill.opacity = 0.02 + now.explode * 0.1 * (1 - 0.8 * now.lift); marketEdge.opacity = 0.45 + now.explode * 0.5;
    slabFill.opacity = 0.04 + now.explode * 0.16 * (1 - 0.85 * now.lift);
    topFill.opacity = 0.05 + now.explode * 0.2 + now.lift * 0.12;
    planGroup.visible = now.lift > 0.02;
    wallMat.opacity = 0.95 * now.lift; windowMat.opacity = now.lift; doorMat.opacity = now.lift;
    if (planImage) planImage.element.style.opacity = planImage.userData.ready ? String(0.92 * now.lift) : "0";
    shell.visible = now.explode < 0.98; shellFill.opacity = now.shell * (1 - now.explode); shellEdge.opacity = 1 - now.explode;
    ghosts.scale.y = nearest.scale.y = Math.max(now.flat * grow, 0.001);
    if (surfaceMesh) surfaceMesh.scale.y = Math.max(grow, 0.001);

    const ghostShare = draped ? 0.12 : 1;
    ghostFill.opacity = now.ghost * ghostShare; ghostEdge.opacity = now.ghost * (draped ? 0.6 : 0.3);
    nearFill.opacity = now.near * (draped ? 0.35 : 1); nearEdge.opacity = Math.min(1, now.near + 0.15);
    limitMat.opacity = now.limit; limitLine.opacity = Math.min(0.9, now.limit * 6); limit.visible = now.limit > 0.005;
    streetMat.opacity = now.street; laneMat.opacity = now.street * 0.5;
    sweep.position.y = ((t * 0.16) % 1) * H;
  });

  /* ---- intro: the aerial photo turns into the model ---- */
  const trace = new THREE.Group(); scene.add(trace);
  const traced = [];
  const outlineOf = (ring, material) => {
    const line = polyline([...ring, ring[0]].map((p) => at(p, 0.7)), material);
    line.geometry.setDrawRange(0, 0); line.userData.count = ring.length + 1; trace.add(line); traced.push(line);
  };
  subject.forEach((ring) => outlineOf(ring, lineMat(0xffffff, 1)));
  others.forEach((ring) => outlineOf(ring, lineMat(0x9fe6ff, 0.9)));
  const scanBar = polyline([v(-gw / 2 - cx, 1.2, 0), v(gw / 2 - cx, 1.2, 0)], lineMat(0xffffff, 1)); scene.add(scanBar); scanBar.visible = false;
  const caption = host.querySelector("#introcap");
  const say = (text) => { if (caption) { caption.textContent = text; caption.style.display = text ? "block" : "none"; } };
  const photoHeight = () => introPhotoHeight(gw, gh, cx, cy, camera.aspect, camera.fov, Math.max(span * 2.4, 170));
  const above = v(0, photoHeight(), 0.0001);
  const clamp = (x) => Math.max(0, Math.min(1, x));
  let intro = null, grow = 1, lastKey = "", turn = 0;
  const playIntro = () => {
    above.y = photoHeight();
    intro = { t0: performance.now(), ms: 6200 };
    fly = null; controls.autoRotate = false; controls.enabled = false;
    Object.assign(now, { explode: 0, lift: 0, flat: 1, ghost: 0.42, near: 0.42, shell: 0.2, limit: 0, street: 0 });
    [dims, gap, limit, roads, sweep].forEach((g) => { g.visible = false; });
    tags.forEach(([t]) => { t.visible = false; }); limitTag.visible = false; if (streetTag) streetTag.visible = false;
    camera.position.copy(above); controls.target.set(0, 0, 0);
  };
  const stepIntro = () => {
    above.y = photoHeight(); // Refit if the panel is resized during the intro.
    const k = clamp((performance.now() - intro.t0) / intro.ms);
    // 1. the photo as it is, swept once
    scanBar.visible = k < 0.26; scanBar.position.z = cy - gh / 2 + gh * clamp(k / 0.26);
    // 2. footprints are traced on it
    const drawn = clamp((k - 0.18) / 0.27);
    traced.forEach((line) => line.geometry.setDrawRange(0, Math.ceil(line.userData.count * drawn)));
    // 3. the photo recedes and the buildings rise to their measured heights
    const rise = clamp((k - 0.45) / 0.33); grow = 1 - Math.pow(1 - rise, 3);
    groundMat.color.lerpColors(new THREE.Color(0xffffff), new THREE.Color(0xe3e5e1), clamp((k - 0.42) / 0.3));
    trace.children.forEach((line) => { line.material.opacity = 1 - clamp((k - 0.7) / 0.25); });
    // 4. the camera comes down from overhead to the working view
    const swing = ease(clamp((k - 0.5) / 0.5)), shot = aim(lastKey, shots[lastKey] || shots[""]);
    camera.position.lerpVectors(above, shot.pos, swing); controls.target.lerpVectors(v(0, 0, 0), shot.look, swing);
    say(k < 0.18 ? `Vexcel aerial image${o.captured ? " · captured " + o.captured : ""}`
      : k < 0.45 ? `Tracing ${others.length + 1} building footprints`
      : k < 0.8 ? `Raising to measured height${o.height_ft ? " · " + Math.round(o.height_ft) + " ft" : ""}` : "");
    if (k === 1) {
      intro = null; grow = 1; trace.visible = false; scanBar.visible = false; controls.enabled = true; say("");
      [limit, roads].forEach((g) => { g.visible = true; });
      setMode(lastKey);
    }
  };
  host.querySelector("#replay").onclick = (event) => { event.preventDefault(); trace.visible = true; playIntro(); };

  // taking hold of the view stops the flight, so the camera never fights the person
  stage.renderer.domElement.addEventListener("pointerdown", () => { if (fly) { fly.toPos = camera.position.clone(); fly.fromPos = fly.toPos; fly.toLook = controls.target.clone(); fly.fromLook = fly.toLook; } });
  stage.renderer.domElement.addEventListener("wheel", () => { if (fly) { fly.toPos = camera.position.clone(); fly.fromPos = fly.toPos; fly.toLook = controls.target.clone(); fly.fromLook = fly.toLook; } }, { passive: true });

  const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
  let downAt = null;
  const canvas = stage.renderer.domElement;
  canvas.addEventListener("pointerdown", (event) => { downAt = [event.clientX, event.clientY]; });
  canvas.addEventListener("pointerup", (event) => {
    if (!downAt || Math.hypot(event.clientX - downAt[0], event.clientY - downAt[1]) > 5 || now.explode < 0.5) return;
    const box = canvas.getBoundingClientRect();
    mouse.set(((event.clientX - box.left) / box.width) * 2 - 1, -((event.clientY - box.top) / box.height) * 2 + 1);
    ray.setFromCamera(mouse, camera);

    controls.target.copy(hero.look);
  }
  controls.update();
  setMode("");
  return { dispose: stage.dispose, setMode };
}

/* Every building on the market, standing on one Vexcel image of the area they cover. */
// The auto tour (fly from building to building) can make some people dizzy; the choice is kept per browser.
function autoTour() { try { return localStorage.getItem("secondstay.autoTour") !== "off"; } catch { return true; } }
function setAutoTourPreference(on) { try { localStorage.setItem("secondstay.autoTour", on ? "on" : "off"); } catch {} }
const CITY_EXAGGERATION = 3; // buildings are 60 m wide on a 25 km map, so heights are drawn three times taller

function cityScene(host, city, onPick) {
  const stage = makeStage(host);
  const { scene, camera, controls, ticks } = stage;
  scene.fog = null; camera.far = 80000; camera.updateProjectionMatrix();
  const [west, south, east, north] = city.bbox;
  const lat0 = (south + north) / 2, lon0 = (west + east) / 2;
  const kx = 111320 * Math.cos((lat0 * Math.PI) / 180), ky = 110540;
  const toM = ([lon, lat]) => [(lon - lon0) * kx, (lat - lat0) * ky];
  const W = (east - west) * kx, D = (north - south) * ky;

  const groundMat = new THREE.MeshBasicMaterial({ color: 0xe9e7e1 });
  new THREE.TextureLoader().load(city.image, (texture) => {
    texture.colorSpace = THREE.SRGBColorSpace; texture.anisotropy = 8;
    groundMat.map = texture; groundMat.color.set(0xeeece6); groundMat.needsUpdate = true;
  });
  scene.add(new THREE.Mesh(new THREE.PlaneGeometry(W, D).rotateX(-Math.PI / 2), groundMat));

  // Buildings rise one after another, west to east.
  const items = city.buildings.filter((b) => b.latitude != null)
    .sort((p, q) => p.longitude - q.longitude);
  const picks = [], risers = [];
  items.forEach((b, n) => {
    const [x, y] = toM([b.longitude, b.latitude]);
    const heightM = (b.height_ft || (b.stories || 3) * 12) * FT * CITY_EXAGGERATION;
    const color = b.tours ? CYAN : AMBER;
    const group = new THREE.Group(); group.position.set(x, 0, -y); scene.add(group);
    let body;
    const ring = b.footprint?.[0];
    if (ring && ring.length > 3) {
      const shape = new THREE.Shape(ring.map((p) => { const [mx, my] = toM(p); return new THREE.Vector2(mx - x, my - y); }));
      body = new THREE.Mesh(new THREE.ExtrudeGeometry(shape, { depth: heightM, bevelEnabled: false }).rotateX(-Math.PI / 2),
        new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.08, roughness: 0.7, transparent: true, opacity: 0.92 }));
    } else {
      body = new THREE.Mesh(new THREE.BoxGeometry(70, heightM, 70).translate(0, heightM / 2, 0),
        new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.08, transparent: true, opacity: 0.92 }));
    }
    const beam = new THREE.Mesh(new THREE.CylinderGeometry(9, 9, 900, 8, 1, true).translate(0, heightM + 450, 0),
      new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0, depthWrite: false })); // a thin solid marker, not a glow
    group.add(body, beam);
    group.scale.y = 0.001;
    body.userData.building = beam.userData.building = b;
    picks.push(body, beam);
    risers.push({ group, beam, delay: 1.2 + n * 0.05, heightM, building: b });
  });

  // The label renderer sets each element's display from its object, so visibility goes through `card.visible`.
  const cardEl = document.createElement("div"); cardEl.className = "city-card";
  const card = new CSS2DObject(cardEl); card.visible = false; scene.add(card);
  const sqft = (n) => n ? Math.round(n).toLocaleString("en-US") + " sq ft" : "–";

  // Arrive from straight above, then tip into a three-quarter view.
  // Frame the buildings, not the whole image: they sit in a few districts across it.
  const xs = risers.map((r) => r.group.position.x), zs = risers.map((r) => r.group.position.z);
  const center = new THREE.Vector3((Math.min(...xs) + Math.max(...xs)) / 2, 0, (Math.min(...zs) + Math.max(...zs)) / 2);
  const reach = Math.max(Math.max(...xs) - Math.min(...xs), Math.max(...zs) - Math.min(...zs), 4000);
  const overhead = center.clone().add(new THREE.Vector3(0, reach * 1.25, 1));
  const oblique = center.clone().add(new THREE.Vector3(reach * 0.05, reach * 0.5, reach * 0.72));
  camera.position.copy(overhead); controls.target.copy(center); controls.autoRotate = false;
  controls.minDistance = 300; controls.maxDistance = Math.max(W, D) * 1.6;
  // The landing map is the page's background: the wheel and a vertical swipe scroll the page, never zoom the map.
  controls.enableZoom = false; stage.renderer.domElement.style.touchAction = "pan-y";
  let flight = { at: performance.now() + 600, from: overhead.clone(), to: oblique, look: center.clone(), target: center.clone(), ms: 2600 };
  const ease = (t) => t * t * (3 - 2 * t);
  let start = null, stretch = 1;
  ticks.push((t) => {
    if (start === null) start = t;
    // Far out, heights are exaggerated and beams mark each building; close in, buildings return to their measured
    // height over the aerial photo and the beams go, so nothing floats above the real roofs.
    const far = Math.min(1, Math.max(0, (camera.position.distanceTo(controls.target) - 1500) / 4500));
    stretch = (1 + (CITY_EXAGGERATION - 1) * far) / CITY_EXAGGERATION;
    for (const r of risers) {
      const k = Math.min(1, Math.max(0, (t - start - r.delay) / 0.8));
      r.group.scale.y = Math.max(0.001, ease(k)) * stretch;
      const active = hovered || focused;
      r.beam.material.opacity = 0.85 * ease(k) * far * (active && active !== r.building ? 0.35 : 1);
      r.beam.visible = far > 0.02;
    }
    if (flight) {
      const k = Math.min(1, Math.max(0, (performance.now() - flight.at) / flight.ms)), e = ease(k);
      camera.position.lerpVectors(flight.from, flight.to, e); controls.target.lerpVectors(flight.look, flight.target, e);
      if (flight.hop) camera.position.y += flight.hop * Math.sin(Math.PI * e); // rise over the city between buildings
      if (k >= 1) { const then = flight.then; flight = null; if (then) then(); else controls.autoRotate = true; }
    }
    showcaseTick();
  });
  controls.autoRotateSpeed = 0.25;

  const ray = new THREE.Raycaster(), mouse = new THREE.Vector2(), canvas = stage.renderer.domElement;
  let hovered = null, focused = null, downAt = null;
  const pick = (event) => {
    const box = canvas.getBoundingClientRect();
    mouse.set(((event.clientX - box.left) / box.width) * 2 - 1, -((event.clientY - box.top) / box.height) * 2 + 1);
    ray.setFromCamera(mouse, camera);
    return ray.intersectObjects(picks.filter((o) => o.visible && o.parent.visible), false)[0]?.object.userData.building || null;
  };
  const riserOf = (b) => risers.find((r) => r.building === b);
  const dimAllBut = (b) => risers.forEach((r) => r.group.children[0].material.opacity = !b || r.building === b ? 0.92 : 0.35);
  const money0 = (n) => "$" + Math.round(n).toLocaleString("en-US");
  const costLine = (b) => {
    const c = b.cost;
    if (!c) return '<div class="why">Minimum cost: reading…</div>';
    if (!c.per_home) return '<div class="why">Minimum cost: not enough area on record</div>';
    return `<div class="cost-line">From ${money0(c.per_home)} per home · ${Math.round(c.homes)} home${c.homes === 1 ? "" : "s"}</div>
      <div class="why">${c.to_quote} called-for item${c.to_quote === 1 ? "" : "s"} still to quote · ${c.to_confirm} to confirm</div>`;
  };
  function showCard(b, lead = "") {
    if (!b) { card.visible = false; return; }
    const r = riserOf(b);
    cardEl.innerHTML = `${lead ? `<div class="why">${esc(lead)}</div>` : ""}<b>${esc(b.name || b.address)}</b><div>${esc(b.address)}</div>
      <div>${b.spaces} space${b.spaces === 1 ? "" : "s"} on the market · ${sqft(b.available_sqft)}</div>
      <div>${b.tours} with a 3D tour · ${b.plans} with a plan</div>
      ${costLine(b)}
      <div class="why">${b.height_ft ? Math.round(b.height_ft) + " ft roof" : "height not measured"} · click to open</div>`;
    card.visible = true;
    card.position.set(r.group.position.x, r.heightM * stretch + (focused === b ? 70 : 950), r.group.position.z); // close up: just above the roof
  }

  // The building's own sharper aerial photo, laid over the area image when the camera comes close.
  const patches = new Map();
  function sharpPhoto(b) {
    if (patches.has(b.property_id) || (b.photo_bbox || []).length !== 4) return;
    const [pw, ps, pe, pn] = b.photo_bbox, [x0, y0] = toM([pw, ps]), [x1, y1] = toM([pe, pn]);
    const mat = new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false });
    const plane = new THREE.Mesh(new THREE.PlaneGeometry(x1 - x0, y1 - y0).rotateX(-Math.PI / 2), mat);
    plane.position.set((x0 + x1) / 2, 0.8, -(y0 + y1) / 2); plane.renderOrder = 1;
    patches.set(b.property_id, { plane, ready: false });
    new THREE.TextureLoader().load(`/api/spaces/${b.property_id}/aerial.jpg?context=1`, (texture) => {
      texture.colorSpace = THREE.SRGBColorSpace; texture.anisotropy = 8; mat.map = texture; mat.needsUpdate = true;
      scene.add(plane); patches.get(b.property_id).ready = true;
    }, undefined, () => patches.delete(b.property_id));
  }

  // Showcase: the area for a few seconds, then one building after another, close up and turning slowly.
  // Any drag, scroll or pointing pauses it; it picks up again after a quiet spell.
  const OVERVIEW_MS = 6000, FOCUS_MS = 7000, IDLE_MS = 15000, EVERY = 5;
  const showcase = { on: autoTour(), next: performance.now() + 600 + 2600 + OVERVIEW_MS, shown: 0, lastInput: 0, last: null };
  // The first visits go through the most complete buildings, in the landing's order; then any building.
  const leaders = risers.filter((r) => (r.building.floors_3d || 0) >= 4 && r.building.footprint?.length);
  function pickNext() {
    showcase.led ??= 0;
    while (showcase.led < leaders.length) { const r = leaders[showcase.led++]; if (r.group.visible) return r; }
    const pool = risers.filter((r) => r.group.visible && r.building !== showcase.last && r.building.footprint?.length);
    const toured = pool.filter((r) => r.building.tours);
    const from = toured.length && Math.random() < 0.7 ? toured : pool;
    return from[Math.floor(Math.random() * from.length)];
  }
  function visit(r) {
    const trueH = r.heightM / CITY_EXAGGERATION; // close up, buildings stand at their measured height
    const b = r.building, top = new THREE.Vector3(r.group.position.x, trueH * 0.5, r.group.position.z);
    const d = Math.max(450, trueH * 4.5), turn = Math.random() * Math.PI * 2;
    focused = b; showcase.last = b; sharpPhoto(b); dimAllBut(b); showCard(b, "Now showing");
    controls.autoRotate = false;
    const to = top.clone().add(new THREE.Vector3(Math.cos(turn) * d, d * 0.6, Math.sin(turn) * d));
    flight = { at: performance.now(), from: camera.position.clone(), to, look: controls.target.clone(), target: top, ms: 3600,
      hop: Math.min(5000, camera.position.distanceTo(to) * 0.4), then: () => { controls.autoRotateSpeed = 0.9; controls.autoRotate = true; } };
  }
  function backOut() {
    focused = null; dimAllBut(null); card.visible = false; controls.autoRotate = false;
    flight = { at: performance.now(), from: camera.position.clone(), to: oblique.clone(), look: controls.target.clone(),
      target: center.clone(), ms: 3000, then: () => { controls.autoRotateSpeed = 0.25; controls.autoRotate = true; } };
  }
  function showcaseTick() {
    const now = performance.now();
    if (!showcase.on) {
      if (autoTour() && !hovered && !downAt && now - showcase.lastInput > IDLE_MS) { showcase.on = true; showcase.next = now; }
      return;
    }
    if (flight || now < showcase.next) return;
    showcase.shown += 1;
    if (showcase.shown % (EVERY + 1) === 0) { backOut(); showcase.next = now + 3000 + OVERVIEW_MS; return; }
    const r = pickNext();
    if (r) { visit(r); showcase.next = now + 3600 + FOCUS_MS; }
  }
  function pause() {
    showcase.on = false; showcase.lastInput = performance.now();
    if (focused) { focused = null; dimAllBut(hovered); if (!hovered) card.visible = false; }
  }
  // Fade each sharp photo in as the camera nears it.
  ticks.push(() => {
    for (const [id, p] of patches) {
      if (!p.ready) continue;
      const near = camera.position.distanceTo(p.plane.position) < 6000;
      p.plane.material.opacity += ((near ? 1 : 0) - p.plane.material.opacity) * 0.06;
    }
  });

  canvas.addEventListener("pointermove", (event) => {
    if (downAt) return;
    const b = pick(event);
    if (b === hovered) return;
    hovered = b; canvas.style.cursor = b ? "pointer" : "";
    if (b) { pause(); controls.autoRotate = false; } // hold still while a building is pointed at
    dimAllBut(b || focused); showCard(b || focused, b ? "" : "Now showing");
    if (b) sharpPhoto(b);
  });
  canvas.addEventListener("pointerdown", (event) => { downAt = [event.clientX, event.clientY]; flight = null; controls.autoRotate = false; pause(); });
  canvas.addEventListener("wheel", pause, { passive: true });
  canvas.addEventListener("pointerup", (event) => {
    const moved = downAt && Math.hypot(event.clientX - downAt[0], event.clientY - downAt[1]) > 5; downAt = null;
    showcase.lastInput = performance.now();
    if (moved) return;
    const b = pick(event);
    if (!b) return;
    // Fly down to the building, then open its review.
    const r = riserOf(b), target = new THREE.Vector3(r.group.position.x, r.heightM * 0.4 / CITY_EXAGGERATION, r.group.position.z);
    card.visible = false;
    flight = { at: performance.now(), from: camera.position.clone(), to: target.clone().add(new THREE.Vector3(420, 520, 700)),
      look: controls.target.clone(), target, ms: 1300, then: () => onPick(b) };
  });
  return { dispose: stage.dispose, highlight(id) {
    const r = risers.find((x) => x.building.property_id === id);
    if (r) pause();
    dimAllBut(r?.building || null);
  }, setAutoTour(on) {
    if (on) { showcase.on = true; showcase.next = performance.now() + 800; return; }
    showcase.on = false; flight = null; focused = null; dimAllBut(hovered); if (!hovered) card.visible = false;
    controls.autoRotateSpeed = 0.25; controls.autoRotate = true;
  }, setTourFilter(show) {
    for (const r of risers) r.group.visible = show === "all" || (show === "yes" ? r.building.tours > 0 : !r.building.tours);
    if (focused && !riserOf(focused)?.group.visible) { focused = null; card.visible = false; }
  }, setCosts(costs) {
    for (const r of risers) r.building.cost = costs[String(r.building.property_id)] || null;
    const shown = hovered || focused;
    if (shown) showCard(shown, focused === shown && !hovered ? "Now showing" : "");
  } };
}

function wireTourFilter(root, id, onChange = () => {}) {

    bar.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.show === show)));
    table?.querySelectorAll("tbody tr[data-tour]").forEach((tr) => { tr.hidden = show !== "all" && tr.dataset.tour !== show; });
    bar.parentElement.querySelector(".market")?.classList.toggle("collapsed", show === "all" && !!bar.parentElement.querySelector(".show-all"));
    try { localStorage.setItem(`secondstay-${id}`, show); } catch {}

// Address search over the buildings we hold evidence for. Words of the query must all appear in the
// building's name or address; "Boulevard" and "Blvd" (and the like) count as the same word.
const STREET_WORDS = { boulevard: "blvd", avenue: "ave", street: "st", drive: "dr", place: "pl", road: "rd", west: "w", east: "e", north: "n", south: "s", suite: "", ste: "", los: "", angeles: "", ca: "", california: "" };
const words = (t) => String(t || "").toLowerCase().replace(/[.,#]/g, " ").split(/\s+/).map((w) => STREET_WORDS[w] ?? w).filter((w) => w && !/^9\d{4}$/.test(w));
function matchBuildings(list, q) {
  const want = words(q);
  if (!want.length) return list;
  return list.filter((s) => { const have = words(`${s.name} ${s.address}`); return want.every((w) => have.some((h) => h.startsWith(w))); });
}
