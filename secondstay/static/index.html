<html lang="en">
<head>

<title>SecondStay · evidence pre-check</title>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"

<style>
  :root {
    --bg: #060a11; --panel: #0c121d; --panel2: #101827; --line: #1b2535; --ink: #e8eef8; --muted: #8493a8;
    --accent: #5ad1ff; --amber: #ffc24a; --select: #121c2e;
    --found: #5fe0a0; --found-bg: #0f2a20;
    --issue: #ffc24a; --issue-bg: #33270d;
    --nodata: #a6b0bf; --nodata-bg: #1a2230;
    --review: #8fb8ff; --review-bg: #14233f;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
  a { color: var(--accent); }
  button, select { font: inherit; color: inherit; }
  header.top { display: flex; align-items: baseline; gap: 16px; padding: 14px 24px 10px; }
  header.top .brand { font-weight: 700; font-size: 18px; letter-spacing: 0.02em; text-decoration: none; color: var(--ink); }
  header.top .brand b { color: var(--accent); font-weight: 700; }
  header.top .tag { color: var(--muted); font-size: 12px; font-family: var(--mono); letter-spacing: 0.04em; text-transform: uppercase; }
  .notice { margin: 0 24px; padding: 7px 12px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--panel); color: var(--muted); font-size: 12.5px; }
  main { padding: 16px 24px 56px; max-width: 1480px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 2px; letter-spacing: -0.01em; }
  h2 { font-size: 12px; font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin: 30px 0 10px; font-weight: 500; }
  .sub { color: var(--muted); }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }

  .badge { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px;
    font-size: 12px; font-weight: 600; white-space: nowrap; }
  .badge i { font-style: normal; font-size: 10px; }
  .s-found { color: var(--found); background: var(--found-bg); }
  .s-issue { color: var(--issue); background: var(--issue-bg); }
  .s-nodata { color: var(--nodata); background: var(--nodata-bg); }
  .s-review { color: var(--review); background: var(--review-bg); }
  .counts { display: flex; flex-wrap: wrap; gap: 6px; }

  /* 3D stage */
  .stage { position: relative; height: 560px; border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
    background: radial-gradient(120% 90% at 50% 100%, #0d1a2b 0%, #060a11 70%); }
  .stage.small { height: 440px; }
  .stage .gl, .stage .labels { position: absolute; inset: 0; }
  .stage .labels { pointer-events: none; }
  .stage canvas { display: block; }
  .hud { position: absolute; z-index: 3; pointer-events: none; }
  .hud.tl { top: 16px; left: 18px; max-width: 46%; }
  .hud.tr { top: 16px; right: 18px; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; pointer-events: auto; max-width: 46%; }
  .hud.tr .counts { justify-content: flex-end; }
  .hud.bl { left: 18px; bottom: 16px; right: 18px; display: flex; flex-wrap: wrap; gap: 8px; }
  .hud.br { right: 18px; bottom: 74px; text-align: right; font: 11px var(--mono); color: var(--muted); }
  .hud h1 { font-size: 26px; text-shadow: 0 2px 18px #000; }
  .hud .sub { text-shadow: 0 1px 10px #000; }
  .metric { background: rgba(8, 13, 22, 0.72); backdrop-filter: blur(8px); border: 1px solid var(--line);
    border-radius: 10px; padding: 7px 12px; min-width: 112px; }
  .metric .k { font: 10px var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .metric .v { font: 600 18px var(--mono); color: var(--ink); }
  .metric .v small { font-size: 11px; color: var(--muted); font-weight: 400; }
  .metric.hot .v { color: var(--amber); }
  .tag3d { font: 600 11px var(--mono); padding: 3px 7px; border-radius: 6px; white-space: nowrap;
    background: rgba(6, 10, 17, 0.8); border: 1px solid #2a3a52; color: var(--ink); }
  .tag3d.amber { border-color: #6b5320; color: var(--amber); }
  .tag3d.cyan { border-color: #1f5670; color: var(--accent); }
  .stage .empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); padding: 40px; text-align: center; }
  .tip { position: fixed; z-index: 10; pointer-events: none; background: rgba(8, 13, 22, 0.92); border: 1px solid #2a3a52;
    border-radius: 8px; padding: 6px 10px; font-size: 12.5px; display: none; }
  .tip b { display: block; }
  .tip span { font: 11px var(--mono); color: var(--muted); }

  /* list of spaces */
  table.spaces { width: 100%; border-collapse: collapse; }
  table.spaces th { text-align: left; font: 500 11px var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted);
    padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  table.spaces td { padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  table.spaces tr:last-child td { border-bottom: 0; }
  table.spaces tbody tr { cursor: pointer; }
  table.spaces tbody tr:hover, table.spaces tbody tr.on { background: var(--select); }
  td.num, th.num { text-align: right; font-family: var(--mono); font-size: 13px; }
  .name { font-weight: 600; }

  /* one space */
  .cols { display: grid; grid-template-columns: minmax(340px, 5fr) 7fr; gap: 16px; align-items: start; margin-top: 16px; }
  @media (max-width: 900px) { .cols { grid-template-columns: 1fr; } .hud.tl { max-width: 90%; } .stage { height: 460px; } }
  .rows { overflow: hidden; }
  .row { display: block; width: 100%; text-align: left; background: none; border: 0;
    border-bottom: 1px solid var(--line); padding: 11px 14px; cursor: pointer; }
  .row:last-child { border-bottom: 0; }
  .row:hover, .row.on { background: var(--select); }
  .row.on { box-shadow: inset 3px 0 0 var(--accent); }
  .row .line1 { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
  .row .req { font-weight: 600; }
  .row .ev { color: var(--muted); font-size: 13px; margin-top: 3px; }
  .row .more { display: none; margin-top: 8px; font-size: 13px; }
  .row.on .more { display: block; }
  .more dt { color: var(--muted); font: 10px var(--mono); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 6px; }
  .more dd { margin: 0; }

  .evidence { position: sticky; top: 12px; padding: 16px; min-height: 420px; }
  .evidence h3 { margin: 0 0 2px; font-size: 17px; }
  .evidence .src { color: var(--muted); font: 11px var(--mono); margin-bottom: 12px; }
  .evidence iframe { width: 100%; height: 460px; border: 0; border-radius: 8px; background: #000; }
  .aerial { position: relative; line-height: 0; }
  .aerial svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .aerial .me { fill: rgba(90, 209, 255, 0.16); stroke: #5ad1ff; stroke-width: 0.6; }
  .aerial .other { fill: none; stroke: #ffffff; stroke-width: 0.35; stroke-dasharray: 1.2 0.8; }
  .aerial img { width: 100%; border-radius: 8px; display: block; }
  .legend { font-size: 12px; color: var(--muted); margin: 6px 0 0; }
  .thumbs { display: flex; gap: 6px; margin-top: 10px; }
  .thumbs img { width: 84px; height: 56px; object-fit: cover; border-radius: 6px; }
  table.kv { width: 100%; border-collapse: collapse; margin: 6px 0 12px; }
  table.kv td { padding: 9px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.kv td:first-child { color: var(--muted); width: 42%; }
  table.kv .big { font: 650 20px var(--mono); }
  table.kv code { color: #5d6b80; font-size: 11px; display: block; }
  .note { font-size: 13px; color: var(--muted); border-left: 3px solid var(--line); padding: 2px 0 2px 10px; margin: 12px 0 0; }
  .statement { margin: 0 0 12px; }

  /* changes */
  .changes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  @media (max-width: 900px) { .changes { grid-template-columns: 1fr; } }
  .lane { padding: 14px; }
  .lane h3 { margin: 0; font-size: 14px; display: flex; justify-content: space-between; align-items: baseline; }
  .lane h3 span { font: 600 20px var(--mono); }
  .lane p.sub { margin: 2px 0 10px; font-size: 12.5px; }
  .lane.c1 { border-top: 2px solid var(--accent); } .lane.c1 h3 span { color: var(--accent); }
  .lane.c2 { border-top: 2px solid var(--amber); } .lane.c2 h3 span { color: var(--amber); }
  .lane.c3 { border-top: 2px solid #55627a; } .lane.c3 h3 span { color: var(--nodata); }
  .chg { border: 1px solid var(--line); background: var(--panel2); border-radius: 9px; padding: 9px 11px; margin-top: 8px; }
  .chg .t { display: flex; justify-content: space-between; gap: 10px; font-weight: 600; font-size: 13.5px; }
  .chg .q { font: 600 12.5px var(--mono); color: var(--accent); white-space: nowrap; }
  .chg .q.none { color: var(--muted); font-weight: 400; }
  .chg .r { color: var(--muted); font-size: 12.5px; margin-top: 3px; }
  .chg .w { font: 10.5px var(--mono); color: #6c7a90; margin-top: 5px; text-transform: uppercase; letter-spacing: 0.05em; }

  .steps { padding: 4px 16px 14px; }
  .steps h4 { margin: 14px 0 4px; font-size: 14px; }
  .steps ul { margin: 0; padding-left: 18px; }
  .steps li { margin: 3px 0; }
  .bar { display: flex; justify-content: space-between; align-items: center; }
  .btn { display: inline-block; border: 1px solid var(--line); background: var(--panel); border-radius: 8px;
    padding: 6px 12px; text-decoration: none; color: var(--ink); font-size: 13px; font-weight: 600; }
  .btn:hover { border-color: var(--accent); }
  select { background: rgba(8, 13, 22, 0.8); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; max-width: 260px; }
  .loading { color: var(--muted); padding: 60px 0; text-align: center; font-family: var(--mono); font-size: 13px; }
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="#/">Second<b>Stay</b></a>
  <span class="tag">Evidence pre-check · housing conversion · Los Angeles</span>
</header>
<p class="notice" id="notice">This is a preliminary evidence review, not a legal or code determination. Final decisions are made by LADBS and licensed professionals.</p>
<main id="app"><p class="loading">Loading…</p></main>
<div class="tip" id="tip"></div>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { CSS2DRenderer, CSS2DObject } from "three/addons/renderers/CSS2DRenderer.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

const app = document.getElementById("app");
const tip = document.getElementById("tip");
const FT = 0.3048, HIGH_RISE_FT = 75;
const CYAN = 0x5ad1ff, AMBER = 0xffc24a, GHOST = 0x7f93b0;
const STATE_CLASS = {
  "Evidence found": ["s-found", "●"], "Possible issue": ["s-issue", "▲"],
  "Not enough data": ["s-nodata", "○"], "Needs professional review": ["s-review", "◆"],
};
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = (v) => (v ? Math.round(v).toLocaleString("en-US") : "–");
const badge = (state, text) => {
  const [cls, glyph] = STATE_CLASS[state];
  return `<span class="badge ${cls}" title="${esc(state)}"><i>${glyph}</i>${esc(text ?? state)}</span>`;
};
const counts = (c) => `<div class="counts">${Object.entries(c).map(([s, n]) => badge(s, `${s} ${n}`)).join("")}</div>`;
const shortCounts = (c) => `<div class="counts">${Object.entries(c).map(([s, n]) => badge(s, n)).join("")}</div>`;

async function api(path) {
  const response = await fetch(path);
  if (!response.ok) throw new Error(`Request did not complete (${response.status})`);
  return response.json();
}

/* ---------- shared 3D plumbing ---------- */

let live = null; // the scene currently on screen
function stopScene() { if (live) { live.dispose(); live = null; } tip.style.display = "none"; }

function makeStage(host) {
  const gl = host.querySelector(".gl"), labelHost = host.querySelector(".labels");
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  gl.appendChild(renderer.domElement);
  const labels = new CSS2DRenderer({ element: labelHost });
  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x060a11, 0.0016);
  const camera = new THREE.PerspectiveCamera(42, 1, 0.5, 6000);
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.autoRotate = true; controls.autoRotateSpeed = 0.55;
  controls.maxPolarAngle = Math.PI * 0.49;
  scene.add(new THREE.HemisphereLight(0xbfd9ff, 0x0a1220, 0.9));
  const sun = new THREE.DirectionalLight(0xffffff, 0.9); sun.position.set(120, 260, 80); scene.add(sun);

  const composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  composer.addPass(new UnrealBloomPass(new THREE.Vector2(1, 1), 0.75, 0.7, 0.55));
  composer.addPass(new OutputPass());

  const size = () => {
    const w = host.clientWidth, h = host.clientHeight;
    renderer.setSize(w, h); composer.setSize(w, h); labels.setSize(w, h);
    camera.aspect = w / h; camera.updateProjectionMatrix();
  };
  const watcher = new ResizeObserver(size); watcher.observe(host); size();
  renderer.domElement.addEventListener("pointerdown", () => { controls.autoRotate = false; });

  const ticks = [];
  let frame = 0, alive = true;
  const clock = new THREE.Clock();
  const loop = () => {
    if (!alive) return;
    frame = requestAnimationFrame(loop);
    const t = clock.getElapsedTime();
    ticks.forEach((fn) => fn(t));
    controls.update(); composer.render(); labels.render(scene, camera);
  };
  loop();
  const dispose = () => {
    alive = false; cancelAnimationFrame(frame); watcher.disconnect(); controls.dispose();
    scene.traverse((o) => { o.geometry?.dispose(); if (o.material) [].concat(o.material).forEach((m) => { m.map?.dispose(); m.dispose(); }); });
    renderer.dispose(); gl.replaceChildren(); labelHost.replaceChildren();
  };
  return { scene, camera, controls, renderer, ticks, dispose };
}

function tag(text, cls = "") {
  const el = document.createElement("div");
  el.className = `tag3d ${cls}`; el.textContent = text;
  return new CSS2DObject(el);
}
const lineMat = (color, opacity = 1) => new THREE.LineBasicMaterial({ color, transparent: opacity < 1, opacity });
function polyline(points, material, closed = false) {
  const geo = new THREE.BufferGeometry().setFromPoints(points);
  return closed ? new THREE.LineLoop(geo, material) : new THREE.Line(geo, material);
}

/* ---------- one building in its surroundings ---------- */

function closestPair(ringsA, ringsB) {
  let best = { d: Infinity };
  const seg = (p, a, b) => {
    const dx = b[0] - a[0], dy = b[1] - a[1], len = dx * dx + dy * dy;
    const t = len ? Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / len)) : 0;
    return [a[0] + t * dx, a[1] + t * dy];
  };
  const scan = (from, to, flip) => from.forEach((ra) => ra.forEach((p) => to.forEach((rb) => {
    for (let i = 0; i < rb.length - 1; i++) {
      const q = seg(p, rb[i], rb[i + 1]), d = Math.hypot(p[0] - q[0], p[1] - q[1]);
      if (d < best.d) best = flip ? { d, a: q, b: p } : { d, a: p, b: q };
    }
  })));
  scan(ringsA, ringsB, false); scan(ringsB, ringsA, true);
  return best;
}

function buildingScene(host, data) {
  const o = data.outside, b = data.building;
  const stage = makeStage(host);
  const { scene, camera, controls, ticks } = stage;
  const [west, south, east, north] = o.bbox;
  const lat0 = (south + north) / 2, lon0 = (west + east) / 2;
  const kx = 111320 * Math.cos((lat0 * Math.PI) / 180), ky = 110540;
  const toM = ([lon, lat]) => [(lon - lon0) * kx, (lat - lat0) * ky]; // x east, y north
  const subject = o.footprint.map((ring) => ring.map(toM));
  const others = o.neighbors.map((ring) => ring.map(toM));
  const all = subject.flat();
  const minX = Math.min(...all.map((p) => p[0])), maxX = Math.max(...all.map((p) => p[0]));
  const minY = Math.min(...all.map((p) => p[1])), maxY = Math.max(...all.map((p) => p[1]));
  const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2, span = Math.max(maxX - minX, maxY - minY);
  const at = ([x, y], h = 0) => new THREE.Vector3(x - cx, h, -(y - cy)); // north is -Z, up is Y

  const H = (o.height_ft || (b.stories || 2) * 12) * FT;
  const stories = b.stories || Math.max(1, Math.round(H / 4));
  const topFt = data.top_occupied_ft, highRise = topFt != null && topFt >= HIGH_RISE_FT;
  const main = highRise ? AMBER : CYAN;
  const white = lineMat(0xffffff, 0.95);

  // ground: the aerial image, toned down so the drawing reads on top of it
  const gw = (east - west) * kx, gh = (north - south) * ky;
  const groundMat = new THREE.MeshBasicMaterial({ color: 0x5b6779 });
  new THREE.TextureLoader().load(`/api/spaces/${b.property_id}/aerial.jpg`, (texture) => {
    texture.colorSpace = THREE.SRGBColorSpace; texture.anisotropy = 8; groundMat.map = texture; groundMat.needsUpdate = true;
  });
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(gw, gh).rotateX(-Math.PI / 2), groundMat);
  ground.position.set(-cx, 0, cy); scene.add(ground);
  const grid = new THREE.GridHelper(Math.max(gw, gh) * 3, 60, 0x1c3148, 0x101b2a);
  grid.position.y = -0.3; scene.add(grid);

  const extrude = (ring, height) => {
    const shape = new THREE.Shape(ring.map(([x, y]) => new THREE.Vector2(x - cx, y - cy)));
    return new THREE.ExtrudeGeometry(shape, { depth: height, bevelEnabled: false }).rotateX(-Math.PI / 2);
  };

  // neighbours as ghosts
  const ghosts = new THREE.Group(); scene.add(ghosts);
  const ghostFill = new THREE.MeshStandardMaterial({ color: 0x23344d, transparent: true, opacity: 0.42, roughness: 0.9, depthWrite: false });
  const ghostEdge = lineMat(GHOST, 0.45);
  others.forEach((ring, i) => {
    const geo = extrude(ring, Math.max(3, (o.neighbor_heights_ft?.[i] ?? 20) * FT));
    ghosts.add(new THREE.Mesh(geo, ghostFill));
    ghosts.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo, 30), ghostEdge));
  });

  // the building: translucent shell, bright edges, a plate per story
  const shell = new THREE.Group(); scene.add(shell);
  const shellFill = new THREE.MeshStandardMaterial({ color: main, transparent: true, opacity: 0.2, roughness: 0.35, metalness: 0.1, side: THREE.DoubleSide, depthWrite: false });
  const plateMat = lineMat(main, 0.32);
  subject.forEach((ring) => {
    const geo = extrude(ring, H);
    shell.add(new THREE.Mesh(geo, shellFill));
    shell.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo, 25), lineMat(main, 1)));
    for (let s = 1; s < stories; s++) shell.add(polyline(ring.map((p) => at(p, (H * s) / stories)), plateMat, true));
  });

  // a scan line that keeps travelling up the building
  const sweep = new THREE.Group(); scene.add(sweep);
  subject.forEach((ring) => sweep.add(polyline(ring.map((p) => at(p, 0)), white, true)));
  ticks.push((t) => { sweep.position.y = ((t * 0.16) % 1) * H; });

  // 75 ft threshold, measured to the highest occupied level
  const limit = new THREE.Group(); scene.add(limit);
  const limitY = HIGH_RISE_FT * FT, half = span * 0.75;
  const limitMat = new THREE.MeshBasicMaterial({ color: AMBER, transparent: true, opacity: 0.1, side: THREE.DoubleSide, depthWrite: false });
  const plane = new THREE.Mesh(new THREE.PlaneGeometry(half * 2, half * 2).rotateX(-Math.PI / 2), limitMat);
  plane.position.y = limitY; limit.add(plane);
  const corners = [[-half, -half], [half, -half], [half, half], [-half, half]].map(([x, z]) => new THREE.Vector3(x, limitY, z));
  limit.add(polyline(corners, lineMat(AMBER, 0.9), true));
  const limitTag = tag("75 ft · high-rise threshold", "amber"); limitTag.position.copy(corners[2]); limit.add(limitTag);

  // height read-out beside the corner furthest east
  const dims = new THREE.Group(); scene.add(dims);
  const east0 = subject[0].reduce((m, p) => (p[0] > m[0] ? p : m)), west0 = subject[0].reduce((m, p) => (p[0] < m[0] ? p : m));
  const off = at(east0).add(new THREE.Vector3(span * 0.08, 0, 0));
  dims.add(polyline([off.clone(), off.clone().setY(H)], white));
  [0, H].forEach((y) => dims.add(polyline([off.clone().setY(y).add(new THREE.Vector3(-2.5, 0, 0)), off.clone().setY(y).add(new THREE.Vector3(2.5, 0, 0))], white)));
  if (o.height_ft) { const t = tag(`roof ≈ ${Math.round(o.height_ft)} ft`); t.position.copy(off.clone().setY(H)); dims.add(t); }
  if (topFt != null && stories > 1) {
    const y = topFt * FT;
    subject.forEach((ring) => dims.add(polyline(ring.map((p) => at(p, y)), white, true)));
    const t = tag(`highest occupied level ≈ ${Math.round(topFt)} ft`, highRise ? "amber" : "cyan");
    t.position.copy(at(west0, y)); dims.add(t);
  }

  // gap to the closest structure
  const gap = new THREE.Group(); scene.add(gap);
  if (others.length) {
    const pair = closestPair(subject, others);
    if (pair.a) {
      const a = at(pair.a, 2), c = at(pair.b, 2);
      gap.add(polyline([a, c], white));
      [a, c].forEach((p) => gap.add(polyline([p.clone().setY(0), p.clone().setY(7)], white)));
      const t = tag(`≈ ${Math.round(pair.d / FT)} ft to the closest structure`); t.position.copy(a.clone().lerp(c, 0.5).setY(8)); gap.add(t);
    }
  }

  // camera
  const reach = Math.max(span * 1.7, H * 2.1, 90);
  camera.position.set(reach * 0.78, H * 0.75 + reach * 0.3, reach * 0.78);
  controls.target.set(0, H * 0.4, 0); controls.minDistance = 30; controls.maxDistance = reach * 4; controls.update();

  // what each requirement brings forward
  const setMode = (key) => {
    const height = key === "height" || key === "elevator";
    const around = key === "separation" || key === "access";
    limit.visible = !around; limitMat.opacity = height ? 0.22 : 0.08;
    dims.visible = !around; gap.visible = key !== "height";
    ghostFill.opacity = around ? 0.8 : height ? 0.25 : 0.42; ghostEdge.opacity = around ? 0.95 : 0.4;
    shellFill.opacity = around ? 0.1 : 0.2;
    plateMat.opacity = ["elevator", "units", "exits", "escape"].includes(key) ? 0.75 : 0.32;
    groundMat.color.set(key === "access" ? 0xb9c4d2 : 0x5b6779);
  };
  setMode("");
  return { dispose: stage.dispose, setMode };
}

/* ---------- every building at once ---------- */

function skylineScene(host, spaces, onPick) {
  const stage = makeStage(host);
  const { scene, camera, controls, renderer } = stage;
  const placed = spaces.filter((s) => s.latitude && s.longitude);
  const lat0 = placed.reduce((t, s) => t + s.latitude, 0) / placed.length;
  const lon0 = placed.reduce((t, s) => t + s.longitude, 0) / placed.length;
  const kx = 111.32 * Math.cos((lat0 * Math.PI) / 180), ky = 110.54; // km
  const pos = placed.map((s) => [(s.longitude - lon0) * kx, (s.latitude - lat0) * ky]);
  // scale to where most buildings are, so a few far-off ones do not shrink the cluster
  const reachKm = pos.map(([x, y]) => Math.max(Math.abs(x), Math.abs(y))).sort((a, c) => a - c);
  const scale = 120 / Math.max(reachKm[Math.floor(reachKm.length * 0.8)], 1);

  const ground = new THREE.Mesh(new THREE.CircleGeometry(260, 64).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0x08101b }));
  ground.position.y = -0.2; scene.add(ground);
  scene.add(new THREE.GridHelper(520, 104, 0x1b3350, 0x0e1826));
  scene.fog.density = 0.0022;

  const meshes = [];
  placed.forEach((s, i) => {
    const feet = s.height_ft || (s.stories ? s.stories * 13 : 30);
    const top = s.stories ? (feet * (s.stories - 1)) / s.stories : feet;
    const color = top >= HIGH_RISE_FT ? AMBER : CYAN;
    const side = Math.max(2.2, Math.min(7, Math.sqrt(s.footprint_sqft || 8000) / 28));
    const h = Math.max(1.2, feet / 9);
    const geo = new THREE.BoxGeometry(side, h, side); geo.translate(0, h / 2, 0);
    const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color, transparent: true, opacity: 0.28, roughness: 0.4, depthWrite: false }));
    mesh.position.set(pos[i][0] * scale, 0, -pos[i][1] * scale);
    mesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo), lineMat(color, 0.95)));
    mesh.userData = s; scene.add(mesh); meshes.push(mesh);
  });

  camera.position.set(130, 95, 170); controls.target.set(0, 10, 0); controls.autoRotateSpeed = 0.35;
  controls.minDistance = 40; controls.maxDistance = 520; controls.update();

  const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
  let hot = null;
  const light = (mesh, on) => { if (mesh) { mesh.material.opacity = on ? 0.85 : 0.28; mesh.scale.setScalar(on ? 1.12 : 1); } };
  const pick = (event) => {
    const box = renderer.domElement.getBoundingClientRect();
    mouse.set(((event.clientX - box.left) / box.width) * 2 - 1, -((event.clientY - box.top) / box.height) * 2 + 1);
    ray.setFromCamera(mouse, camera);
    return ray.intersectObjects(meshes, false)[0]?.object ?? null;
  };
  const highlight = (mesh) => { if (mesh !== hot) { light(hot, false); hot = mesh; light(hot, true); } };
  renderer.domElement.addEventListener("pointermove", (event) => {
    const mesh = pick(event); highlight(mesh);
    renderer.domElement.style.cursor = mesh ? "pointer" : "grab";
    if (!mesh) { tip.style.display = "none"; return; }
    const s = mesh.userData;
    tip.innerHTML = `<b>${esc(s.name || s.address)}</b><span>${s.stories ?? "–"} stories · ${s.height_ft ? Math.round(s.height_ft) + " ft" : "height not read"} · built ${s.year_built ?? "–"}</span>`;
    tip.style.display = "block"; tip.style.left = `${event.clientX + 14}px`; tip.style.top = `${event.clientY + 14}px`;
  });
  renderer.domElement.addEventListener("pointerleave", () => { highlight(null); tip.style.display = "none"; });
  let downAt = null;
  renderer.domElement.addEventListener("pointerdown", (event) => { downAt = [event.clientX, event.clientY]; });
  renderer.domElement.addEventListener("pointerup", (event) => {
    if (downAt && Math.hypot(event.clientX - downAt[0], event.clientY - downAt[1]) < 5) { const mesh = pick(event); if (mesh) onPick(mesh.userData); }
  });
  return { dispose: stage.dispose, highlight: (id) => highlight(meshes.find((m) => m.userData.property_id === id) ?? null) };
}

/* ---------- screens ---------- */

async function showList() {
  const data = await api("/api/spaces");
  document.getElementById("notice").textContent = data.notice;
  const tall = data.spaces.filter((s) => s.height_ft && s.stories && (s.height_ft * (s.stories - 1)) / s.stories >= HIGH_RISE_FT).length;
  const read = data.spaces.filter((s) => s.height_ft).length;
  const marketed = data.spaces.reduce((t, s) => t + s.available_sqft, 0) / 1e6;
  app.innerHTML = `
    <div class="stage small" id="stage"><div class="gl"></div><div class="labels"></div>
      <div class="hud tl"><h1>${data.spaces.length} office buildings, read from three data layers</h1>
        <div class="sub">CoStar records · Matterport 3D scans · Vexcel aerial imagery. Each bar is one Los Angeles office building at its measured height. Select one to open its evidence review.</div></div>
      <div class="hud bl">
        <div class="metric"><div class="k">Buildings</div><div class="v">${data.spaces.length}</div></div>
        <div class="metric"><div class="k">Height measured</div><div class="v">${read}</div></div>
        <div class="metric hot"><div class="k">Top level ≥ 75 ft</div><div class="v">${tall}</div></div>
        <div class="metric"><div class="k">Space on the market</div><div class="v">${marketed.toFixed(1)}<small> M sq ft</small></div></div>
      </div>
      <div class="hud br">drag to orbit · scroll to zoom<br>amber: highest occupied level estimated at 75 ft or more</div>
    </div>
    <h2>Buildings, most available space first</h2>
    <p class="counts" style="margin:0 0 12px">${data.states.map((s) => badge(s)).join(" ")}</p>
    <div class="panel"><table class="spaces">
      <thead><tr><th>Building</th><th class="num">Built</th><th class="num">Stories</th><th class="num">Height ft</th><th>Zone</th>
        <th class="num">Available sq ft</th><th class="num">Asking $/sq ft/yr</th>
        <th class="num">No tenancy on record</th><th class="num">Scans</th><th>Requirements by evidence state</th></tr></thead>
      <tbody>${data.spaces.map((s) => `
        <tr data-id="${s.property_id}">
          <td><div class="name">${esc(s.name || s.address)}</div><div class="sub">${esc(s.name ? s.address : "")}</div></td>
          <td class="num">${s.year_built ?? "–"}</td>
          <td class="num">${s.stories ?? "–"}</td>
          <td class="num">${s.height_ft ? Math.round(s.height_ft) : "–"}</td>
          <td>${esc(s.zone ?? "–")}</td>
          <td class="num">${num(s.available_sqft)}</td>
          <td class="num">${s.asking_rent_per_sqft_year ? s.asking_rent_per_sqft_year.toFixed(0) : "–"}</td>
          <td class="num">${s.unaccounted_share == null ? "–" : Math.round(s.unaccounted_share * 100) + "%"}</td>
          <td class="num">${s.scans}</td>
          <td>${shortCounts(s.counts)}</td>
        </tr>`).join("")}</tbody>
    </table></div>
    <p class="note">Available space is space being marketed, which can still be occupied. "No tenancy on record" is the share of
      rentable area without a current tenancy in the data; it is an indication of vacancy, and some tenancies have no area recorded.
      Asking rents mix service types. Heights are the highest roof point seen in imagery.</p>`;
  live = skylineScene(document.getElementById("stage"), data.spaces, (s) => (location.hash = `#/space/${s.property_id}`));
  app.querySelectorAll("tr[data-id]").forEach((tr) => {
    tr.onclick = () => (location.hash = `#/space/${tr.dataset.id}`);
    tr.onmouseenter = () => live?.highlight?.(Number(tr.dataset.id));
  });
}

const fieldTable = (row, big) => `<table class="kv">${row.fields.map((f, i) => `
  <tr><td>${esc(f.label)}<code>${esc(f.field)}</code></td>
  <td class="${big && i === 0 ? "big" : ""}">${f.value == null || f.value === "" ? '<span class="sub">not measured or recorded</span>' : esc(f.value)}</td></tr>`).join("")}</table>`;

function recordView(row) {
  return `<div class="src">SOURCE · CoStar commercial property record</div>
    <p class="statement">${esc(row.evidence)}</p>${fieldTable(row, true)}`;
}

function scanView(row, data) {
  const scan = data.scan;
  if (!scan.model_id) return `<p class="statement">${esc(row.evidence)}</p><p class="note">This building has no 3D scan.</p>`;
  const key = data.sdk_key ? `&applicationKey=${encodeURIComponent(data.sdk_key)}` : "";
  const measured = scan.loaded ? `
    <table class="kv">
      <tr><td>Floors in the scan</td><td>${scan.floors}</td></tr>
      <tr><td>Floor area measured</td><td>${scan.area_sqft ? num(scan.area_sqft) + " sq ft" : '<span class="sub">not measured</span>'}</td></tr>
      <tr><td>Use recorded on the scan</td><td>${esc(scan.uses.join(", ") || "not recorded")}</td></tr>
      <tr><td>Room labels in the scan</td><td>${esc(Object.entries(scan.room_kinds).map(([k, n]) => `${k} ${n}`).join(", ") || "none")}</td></tr>
    </table>` : `<p class="note">${esc(scan.error)}</p>`;
  return `<div class="src">SOURCE · Matterport 3D scan${scan.name ? " · " + esc(scan.name) : ""}</div>
    <p class="statement">${esc(row.evidence)}</p>
    <iframe src="https://my.matterport.com/show/?m=${encodeURIComponent(scan.model_id)}&qs=1&brand=0&help=0${key}" allow="xr-spatial-tracking; fullscreen" allowfullscreen></iframe>
    ${measured}`;
}

function outline(rings, box, cls) {
  const [west, south, east, north] = box;
  return rings.map((ring) => `<polygon class="${cls}" points="${ring.map(([x, y]) =>
    `${(((x - west) / (east - west)) * 100).toFixed(2)},${(((north - y) / (north - south)) * 100).toFixed(2)}`).join(" ")}"/>`).join("");
}

function aerialView(row, data) {
  const b = data.building, o = data.outside;
  const photos = b.aerial_urls.length ? b.aerial_urls : (b.photo_url ? [b.photo_url] : []);
  const photoLabel = b.aerial_urls.length ? "CoStar aerial photo" : "CoStar building photo";
  const sources = [o.loaded ? `Vexcel aerial imagery${o.captured ? ", captured " + esc(o.captured) : ""}` : "",
    row.fields.some((f) => !f.field.startsWith("Vexcel")) ? "CoStar commercial property record" : ""].filter(Boolean);
  const image = o.loaded ? `
    <div class="aerial"><img src="/api/spaces/${b.property_id}/aerial.jpg" alt="Vexcel aerial image">
      <svg viewBox="0 0 100 100" preserveAspectRatio="none">${outline(o.neighbors, o.bbox, "other")}${outline(o.footprint, o.bbox, "me")}</svg></div>
    <p class="legend">Blue: the footprint matched to this building. Dashed white: other structures nearby. The same data drives the 3D view above.</p>` : "";
  return `<div class="src">SOURCE · ${sources.join(" · ") || "no image on record"}</div>
    <p class="statement">${esc(row.evidence)}</p>
    ${row.fields.length ? fieldTable(row, false) : ""}
    ${image}
    ${photos.length ? `<div class="thumbs">${photos.map((u) => `<a href="${esc(u)}" target="_blank" rel="noopener"><img src="${esc(u)}" alt="${photoLabel}"></a>`).join("")}</div>
      <p class="legend">${photoLabel}${photos.length > 1 ? "s" : ""} from the record.</p>` : ""}
    <p class="note">${o.loaded ? "Height is the highest roof point sampled over the footprint, minus the ground below; it includes rooftop equipment. The highest occupied level is our estimate: roof height less one story. Distances are measured between footprint outlines."
      : esc(o.error)}</p>`;
}

function evidenceView(row, data) {
  let body;
  if (row.view === "record") body = recordView(row);
  else if (row.view === "scan") body = scanView(row, data);
  else if (row.view === "aerial") body = aerialView(row, data);
  else if (row.view === "setting") body = `<div class="src">SOURCE · product setting</div><p class="statement">${esc(row.evidence)}</p>
      <p class="note">SecondStay plans stays of 31 days or longer. This is a setting, not a property of the building.</p>`;
  else body = `<div class="src">SOURCE · none of our data layers</div><p class="statement">${esc(row.evidence)}</p>
      <p class="note">Records, 3D scans and aerial imagery cannot answer this requirement. To be confirmed by: ${esc(row.confirmed_by)}.</p>`;
  return `<div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start">
      <h3>${esc(row.requirement)}</h3>${badge(row.state)}</div>${body}`;
}

const UNIT_WORDS = { sqft: " sq ft", each: "", linear_ft: " ft", story: " stories", lump: "" };
const LANES = [
  ["called_for", "c1", "Called for by the published rule", "The rule applies and the evidence shows the work is missing."],
  ["possible", "c2", "Possible, to be confirmed", "The evidence points to the work, but what is already in the building is not known."],
  ["unknown", "c3", "Not known from the data", "Records, scans and imagery cannot say either way."],
];
function changesView(data) {
  return `<div class="changes">${LANES.map(([key, cls, title, sub]) => {
    const items = data.changes.filter((c) => c.certainty === key);
    return `<div class="panel lane ${cls}"><h3>${title}<span>${items.length}</span></h3><p class="sub">${sub}</p>
      ${items.map((c) => `<div class="chg"><div class="t"><span>${esc(c.title)}</span>
        <span class="q ${c.quantity == null ? "none" : ""}">${c.quantity == null ? "quantity not known" : num(c.quantity) + UNIT_WORDS[c.unit]}</span></div>
        <div class="r">${esc(c.reason)}</div><div class="w">${esc(c.quantity_basis)} · confirm with ${esc(c.confirmed_by)}</div></div>`).join("")}</div>`;
  }).join("")}</div>
  <p class="note">Each item carries the quantity it would be priced on. The cost model is not connected yet, so no figures are shown.</p>`;
}

async function showSpace(id, scanId, selected) {
  const query = scanId ? `?scan=${encodeURIComponent(scanId)}` : "";
  const data = await api(`/api/spaces/${id}${query}`);
  const b = data.building, o = data.outside;
  let current = data.rows.find((r) => r.key === selected) || data.rows[0];
  const top = data.top_occupied_ft;
  const scanPicker = b.scans.length > 1 ? `<label class="sub" style="font-size:12px">Scan
      <select id="scan">${b.scans.map((s, i) => `<option value="${esc(s.model_id)}" ${s.model_id === data.scan.model_id ? "selected" : ""}>
        ${esc(s.caption || "Scan")} (${i + 1} of ${b.scans.length})</option>`).join("")}</select></label>` : "";
  const metric = (k, v, unit = "", hot = false) => `<div class="metric ${hot ? "hot" : ""}"><div class="k">${k}</div><div class="v">${v}<small>${unit}</small></div></div>`;
  app.innerHTML = `
    <p style="margin:0 0 10px"><a href="#/">← All buildings</a></p>
    <div class="stage" id="stage"><div class="gl"></div><div class="labels"></div>
      ${o.loaded ? "" : `<div class="empty">${esc(o.error || "No imagery for this building.")}</div>`}
      <div class="hud tl"><h1>${esc(b.name || b.address)}</h1>
        <div class="sub">${esc(b.address)}, Los Angeles · ${esc(b.property_type)} · built ${b.year_built ?? "–"} · zone ${esc(b.zone ?? "–")}</div></div>
      <div class="hud tr">${counts(data.counts)}${scanPicker}</div>
      <div class="hud br">drag to orbit · scroll to zoom<br>select a requirement to bring its evidence forward</div>
      <div class="hud bl">
        ${metric("Roof height", o.height_ft ? Math.round(o.height_ft) : "–", " ft")}
        ${metric("Highest occupied level", top != null ? "≈ " + Math.round(top) : "–", " ft", top != null && top >= HIGH_RISE_FT)}
        ${metric("Stories", b.stories ?? "–")}
        ${metric("Closest structure", o.neighbor_gap_ft != null ? Math.round(o.neighbor_gap_ft) : "–", " ft")}
        ${metric("Footprint", num(o.footprint_sqft), " sq ft")}
        ${metric("On the market", num(b.available_sqft), " sq ft")}
        ${metric("Imagery", esc(o.captured || "–"))}
      </div>
    </div>
    <div class="cols">
      <div class="panel rows" id="rows">${data.rows.map((r) => `
        <button class="row" data-key="${r.key}">
          <div class="line1"><span class="req">${esc(r.requirement)}</span>${badge(r.state)}</div>
          <div class="ev">${esc(r.evidence)}</div>
          <dl class="more">
            <dt>What the published rule says</dt><dd>${esc(r.rule)} ${r.source_url ? `<a href="${esc(r.source_url)}" target="_blank" rel="noopener">Source</a>` : ""}</dd>
            <dt>Data layer</dt><dd>${esc(r.layer)}</dd>
            <dt>To be confirmed by</dt><dd>${esc(r.confirmed_by)}</dd>
          </dl>
        </button>`).join("")}</div>
      <div class="panel evidence" id="evidence"></div>
    </div>
    <h2>Work the published rules call for</h2>
    ${changesView(data)}
    <div class="bar"><h2>Next steps, by who confirms</h2>
      <a class="btn" href="/api/spaces/${id}/next-steps.md${query}">Export for an architect</a></div>
    <div class="panel steps">${data.next_steps.map((g) => `
      <h4>${esc(g.who)}</h4>
      <ul>${g.items.map((i) => `<li><b>${esc(i.requirement)}</b> ${badge(i.state)}<br><span class="sub">${esc(i.evidence)}</span></li>`).join("")}</ul>`).join("")}
    </div>`;

  if (o.loaded) live = buildingScene(document.getElementById("stage"), data);
  const select = (key) => {
    current = data.rows.find((r) => r.key === key);
    app.querySelectorAll(".row").forEach((el) => el.classList.toggle("on", el.dataset.key === key));
    document.getElementById("evidence").innerHTML = evidenceView(current, data);
    live?.setMode?.(key);
  };
  app.querySelectorAll(".row").forEach((el) => (el.onclick = () => select(el.dataset.key)));
  const picker = document.getElementById("scan");
  if (picker) picker.onchange = () => { stopScene(); showSpace(id, picker.value, current.key).catch(showError); };
  select(current.key);
}

function showError(error) { app.innerHTML = `<p class="loading">${esc(error.message)}</p>`; }
function route() {
  const match = location.hash.match(/^#\/space\/(\d+)/);
  stopScene();
  app.innerHTML = '<p class="loading">Reading the three data layers…</p>';
  (match ? showSpace(match[1]) : showList()).catch(showError);
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
route();
</script>
