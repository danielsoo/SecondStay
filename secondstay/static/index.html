<!doctype html>
<html lang="en">
<head>

<title>SecondStay · evidence pre-check</title>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"

<style>
  :root {
    --bg: #060a11; --panel: #0c121d; --panel2: #101827; --line: #1b2535; --ink: #e8eef8; --muted: #8493a8;
    --accent: #5ad1ff; --amber: #ffc24a; --select: #121c2e;
    --found: #5fe0a0; --found-bg: #0f2a20;
    --issue: #ffc24a; --issue-bg: #33270d;
    --nodata: #a6b0bf; --nodata-bg: #1a2230;
    --review: #8fb8ff; --review-bg: #14233f;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
  a { color: var(--accent); }
  button, select { font: inherit; color: inherit; }
  header.top { display: flex; align-items: baseline; gap: 16px; padding: 14px 24px 10px; }
  header.top .brand { font-weight: 700; font-size: 18px; letter-spacing: 0.02em; text-decoration: none; color: var(--ink); }
  header.top .brand b { color: var(--accent); font-weight: 700; }
  header.top .tag { color: var(--muted); font-size: 12px; font-family: var(--mono); letter-spacing: 0.04em; text-transform: uppercase; }
  .notice { margin: 0 24px; padding: 7px 12px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--panel); color: var(--muted); font-size: 12.5px; }
  main { padding: 16px 24px 56px; max-width: 1480px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 2px; letter-spacing: -0.01em; }
  h2 { font-size: 12px; font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin: 30px 0 10px; font-weight: 500; }
  .sub { color: var(--muted); }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }

  .badge { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px;
    font-size: 12px; font-weight: 600; white-space: nowrap; }
  .badge i { font-style: normal; font-size: 10px; }
  .s-found { color: var(--found); background: var(--found-bg); }
  .s-issue { color: var(--issue); background: var(--issue-bg); }
  .s-nodata { color: var(--nodata); background: var(--nodata-bg); }
  .s-review { color: var(--review); background: var(--review-bg); }
  .counts { display: flex; flex-wrap: wrap; gap: 6px; }

  /* 3D stage */
  .stage { position: relative; height: 560px; border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
    background: radial-gradient(120% 90% at 50% 100%, #0d1a2b 0%, #060a11 70%); }
  .stage.small { height: 440px; }
  .scene-column { min-width: 0; }
  .scene-toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
  .scene-toolbar label { margin-left: auto; color: var(--muted); }
  .scene-toolbar [aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: #102736; }
  .floor-mode .hud.bl, .floor-mode .hud.br, .floor-mode .hud.tr, .floor-mode .spacechip { display: none; }
  .floor-mode .hud.tl { max-width: 90%; }
  .floor-directory { display:flex; gap:6px; overflow:auto; padding:0 0 8px; margin-bottom:8px; }
  .floor-directory .btn { white-space:nowrap; font-size:12px; }
  .floor-directory [aria-pressed="true"] { border-color:var(--accent); color:var(--accent); background:#102736; }
  .floor-resource-bar { display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin:0 0 10px; font-size:13px; }
  .floor-resource-bar select { max-width:min(560px,70vw); }
  #floor-plan-view { position:absolute; inset:92px 16px 16px; z-index:4; background:#f2f3f0; color:#28333c; border-radius:8px; display:flex; flex-direction:column; align-items:center; justify-content:center; overflow:hidden; }
  #floor-plan-view[hidden] { display:none; }
  #floor-plan-view img { width:100%; height:calc(100% - 40px); min-height:0; object-fit:contain; }
  #floor-plan-view p { margin:8px 12px; font-size:12px; }
  #floor-plan-view a { color:#087a9e; }
  .plan-only .gl, .plan-only .labels { visibility:hidden; }
  #floor-source { display:flex; flex-wrap:wrap; gap:14px; margin:8px 0; }
  #floor-unassigned { margin-top:12px; }
  #floor-unassigned a { display:block; margin-top:6px; }
  .floor-detail { padding: 16px; margin-top: 10px; font-size: 13px; }
  .floor-detail h3 { margin: 0; color: var(--accent); }
  .floor-detail p { margin: 8px 0; }
  .floor-detail[hidden], .floor-detail [hidden] { display: none !important; }
  .plan-import { border-top: 1px solid var(--line); margin-top: 12px; padding-top: 12px; }
  .plan-import summary { cursor: pointer; }
  #plan-preview { display: block; max-width: 100%; max-height: 500px; background: white; margin: 10px 0; cursor: crosshair; touch-action: none; }
  .stage .gl, .stage .labels, .stage .flat { position: absolute; inset: 0; }
  .stage .labels, .stage .flat, .stage .flat * { pointer-events: none; }
  .stage .gl { z-index: 0; } .stage .flat { z-index: 1; overflow: hidden; } .stage .labels { z-index: 2; }
  .stage .flat img { display: block; background: #fff; border-radius: 6px; }
  .stage canvas { display: block; }
  .hud { position: absolute; z-index: 3; pointer-events: none; }
  .hud.tl { top: 16px; left: 18px; max-width: 46%; }
  .hud.tr { top: 16px; right: 18px; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; pointer-events: auto; max-width: 46%; }
  .hud.tr .counts { justify-content: flex-end; }
  .hud.bl { left: 18px; bottom: 16px; right: 18px; display: flex; flex-wrap: wrap; gap: 8px; }
  .hud.br { right: 18px; bottom: 74px; text-align: right; font: 11px var(--mono); color: var(--muted); }
  .hud.mid { left: 50%; top: 46%; transform: translate(-50%, -50%); text-align: center; font: 600 13px var(--mono); letter-spacing: 0.06em;
    padding: 7px 14px; border-radius: 8px; background: rgba(6, 10, 17, 0.78); border: 1px solid #2a3a52; color: var(--ink); display: none; }
  .hud h1 { font-size: 26px; text-shadow: 0 2px 18px #000; }
  .hud .sub { text-shadow: 0 1px 10px #000; }
  .metric { background: rgba(8, 13, 22, 0.72); backdrop-filter: blur(8px); border: 1px solid var(--line);
    border-radius: 10px; padding: 7px 12px; min-width: 112px; }
  .metric .k { font: 10px var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .metric .v { font: 600 18px var(--mono); color: var(--ink); }
  .metric .v small { font-size: 11px; color: var(--muted); font-weight: 400; }
  .metric.hot .v { color: var(--amber); }
  .spacechip { display: inline-block; margin-top: 8px; padding: 5px 10px; border-radius: 8px; font-size: 13px; pointer-events: auto;
    background: rgba(8, 13, 22, 0.78); border: 1px solid #2a3a52; backdrop-filter: blur(8px); }
  .spacechip b { color: var(--accent); }
  .spacechip a { margin-left: 8px; font-size: 12px; }
  .market { max-height: 262px; overflow: auto; }
  .market thead th { position: sticky; top: 0; background: var(--panel); }
  .yes { color: var(--found); font-weight: 600; font-size: 12.5px; }
  .tag3d { font: 600 11px var(--mono); padding: 3px 7px; border-radius: 6px; white-space: nowrap;
    background: rgba(6, 10, 17, 0.8); border: 1px solid #2a3a52; color: var(--ink); }
  .tag3d.amber { border-color: #6b5320; color: var(--amber); }
  .tag3d.cyan { border-color: #1f5670; color: var(--accent); }
  .stage .empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); padding: 40px; text-align: center; }
  .tip { position: fixed; z-index: 10; pointer-events: none; background: rgba(8, 13, 22, 0.92); border: 1px solid #2a3a52;
    border-radius: 8px; padding: 6px 10px; font-size: 12.5px; display: none; }
  .tip b { display: block; }
  .tip span { font: 11px var(--mono); color: var(--muted); }

  /* list of spaces */
  table.spaces { width: 100%; border-collapse: collapse; }
  table.spaces th { text-align: left; font: 500 11px var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted);
    padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  table.spaces td { padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  table.spaces tr:last-child td { border-bottom: 0; }
  table.spaces tbody tr { cursor: pointer; }
  table.spaces tbody tr:hover, table.spaces tbody tr.on { background: var(--select); }
  td.num, th.num { text-align: right; font-family: var(--mono); font-size: 13px; }
  .name { font-weight: 600; }

  /* one space */
  .cols { display: grid; grid-template-columns: minmax(340px, 5fr) 7fr; gap: 16px; align-items: start; margin-top: 16px; }
  @media (max-width: 900px) { .cols { grid-template-columns: 1fr; } .hud.tl { max-width: 90%; } .stage { height: 460px; } }
  .rows { overflow: hidden; }
  .row { display: block; width: 100%; text-align: left; background: none; border: 0;
    border-bottom: 1px solid var(--line); padding: 11px 14px; cursor: pointer; }
  .row:last-child { border-bottom: 0; }
  .row:hover, .row.on { background: var(--select); }
  .row.on { box-shadow: inset 3px 0 0 var(--accent); }
  .row .line1 { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
  .row .req { font-weight: 600; }
  .row .ev { color: var(--muted); font-size: 13px; margin-top: 3px; }
  .row .more { display: none; margin-top: 8px; font-size: 13px; }
  .row.on .more { display: block; }
  .more dt { color: var(--muted); font: 10px var(--mono); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 6px; }
  .more dd { margin: 0; }

  .evidence { position: sticky; top: 12px; padding: 16px; min-height: 420px; }
  .evidence h3 { margin: 0 0 2px; font-size: 17px; }
  .evidence .src { color: var(--muted); font: 11px var(--mono); margin-bottom: 12px; }
  .evidence iframe { width: 100%; height: 460px; border: 0; border-radius: 8px; background: #000; }
  .evidence [hidden] { display: none !important; }
  .aerial { position: relative; line-height: 0; }
  .aerial svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .aerial .me { fill: rgba(90, 209, 255, 0.16); stroke: #5ad1ff; stroke-width: 0.6; }
  .aerial .other { fill: none; stroke: #ffffff; stroke-width: 0.35; stroke-dasharray: 1.2 0.8; }
  .aerial img { width: 100%; border-radius: 8px; display: block; }
  img.sheet { width: 100%; border-radius: 8px; border: 1px solid var(--line); display: block; margin-bottom: 8px; }
  .legend { font-size: 12px; color: var(--muted); margin: 6px 0 0; }
  .thumbs { display: flex; gap: 6px; margin-top: 10px; }
  .thumbs img { width: 84px; height: 56px; object-fit: cover; border-radius: 6px; }
  table.kv { width: 100%; border-collapse: collapse; margin: 6px 0 12px; }
  table.kv td { padding: 9px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.kv td:first-child { color: var(--muted); width: 42%; }
  table.kv .big { font: 650 20px var(--mono); }
  table.kv code { color: #5d6b80; font-size: 11px; display: block; }
  .note { font-size: 13px; color: var(--muted); border-left: 3px solid var(--line); padding: 2px 0 2px 10px; margin: 12px 0 0; }
  .statement { margin: 0 0 12px; }

  /* changes */
  .changes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  @media (max-width: 900px) { .changes { grid-template-columns: 1fr; } }
  .lane { padding: 14px; }
  .lane h3 { margin: 0; font-size: 14px; display: flex; justify-content: space-between; align-items: baseline; }
  .lane h3 span { font: 600 20px var(--mono); }
  .lane p.sub { margin: 2px 0 10px; font-size: 12.5px; }
  .lane.c1 { border-top: 2px solid var(--accent); } .lane.c1 h3 span { color: var(--accent); }
  .lane.c2 { border-top: 2px solid var(--amber); } .lane.c2 h3 span { color: var(--amber); }
  .lane.c3 { border-top: 2px solid #55627a; } .lane.c3 h3 span { color: var(--nodata); }
  .chg { border: 1px solid var(--line); background: var(--panel2); border-radius: 9px; padding: 9px 11px; margin-top: 8px; }
  .chg .t { display: flex; justify-content: space-between; gap: 10px; font-weight: 600; font-size: 13.5px; }
  .chg .q { font: 600 12.5px var(--mono); color: var(--accent); white-space: nowrap; }
  .chg .q.none { color: var(--muted); font-weight: 400; }
  .chg .r { color: var(--muted); font-size: 12.5px; margin-top: 3px; }
  .chg .w { font: 10.5px var(--mono); color: #6c7a90; margin-top: 5px; text-transform: uppercase; letter-spacing: 0.05em; }

  .plans { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
  .plan { display: block; background: #fff; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); text-decoration: none; }
  .plan img { width: 100%; height: 170px; object-fit: contain; display: block; background: #fff; }
  .plan span { display: block; padding: 5px 8px; font: 11px var(--mono); color: #334; background: #eef1f6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .planhead { display: flex; justify-content: space-between; align-items: baseline; margin: 26px 0 8px; }
  .planhead h3 { margin: 0; font-size: 16px; }
  .steps { padding: 4px 16px 14px; }
  .steps h4 { margin: 14px 0 4px; font-size: 14px; }
  .steps ul { margin: 0; padding-left: 18px; }
  .steps li { margin: 3px 0; }
  .bar { display: flex; justify-content: space-between; align-items: center; }
  .btn { display: inline-block; border: 1px solid var(--line); background: var(--panel); border-radius: 8px;
    padding: 6px 12px; text-decoration: none; color: var(--ink); font-size: 13px; font-weight: 600; }
  .btn:hover { border-color: var(--accent); }
  select { background: rgba(8, 13, 22, 0.8); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; max-width: 260px; }
  .loading { color: var(--muted); padding: 60px 0; text-align: center; font-family: var(--mono); font-size: 13px; }

.review-layout { display:grid; grid-template-columns:minmax(0,1fr) 330px; gap:16px; align-items:start; }
.agent-panel { padding:18px; max-height:620px; overflow:auto; }
.agent-panel h2 { margin:0 0 8px; }
.agent-actions { display:flex; gap:8px; flex-wrap:wrap; margin:12px 0; }
.agent-log { padding-left:20px; font-size:13px; line-height:1.6; }
.agent-log li { margin-bottom:10px; }
.agent-log small { display:block; color:var(--muted); }
.agent-result summary { cursor:pointer; margin:14px 0; }
.agent-result article { padding:10px 0; border-top:1px solid #26354b; }
.agent-result p { font-size:13px; overflow-wrap:anywhere; }
.agent-panel button:disabled { opacity:.45; cursor:default; }
@media(max-width:1200px) {
  .review-layout { grid-template-columns:1fr; }
  .agent-panel { max-height:500px; }
}
@media(max-width:700px) {
  .stage .hud.tl { max-width:calc(100% - 32px); }
  .stage .hud.tr { top:auto; bottom:120px; left:16px; right:16px; }
  .stage .hud.tr .counts { justify-content:flex-start; }
  .stage h1 { font-size:22px; }
}

<body>
<header class="top">
  <a class="brand" href="#/">Second<b>Stay</b></a>
  <span class="tag">Evidence pre-check · housing conversion · Los Angeles</span>
  <a href="#/plans" style="margin-left:auto;font-size:13px">Floor plans on record</a>
</header>
<p class="notice" id="notice">This is a preliminary evidence review, not a legal or code determination. Final decisions are made by LADBS and licensed professionals.</p>
<main id="app"><p class="loading">Loading…</p></main>
<div class="tip" id="tip"></div>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { CSS2DRenderer, CSS2DObject } from "three/addons/renderers/CSS2DRenderer.js";
import { floorExplorer } from "/static/floor_explorer.mjs";
import { floorAssets, chooseFloorAsset } from "/static/floor_motion.mjs";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

const app = document.getElementById("app");
const tip = document.getElementById("tip");
const FT = 0.3048, HIGH_RISE_FT = 75;
const CYAN = 0x5ad1ff, AMBER = 0xffc24a, GHOST = 0x7f93b0;
const STATE_CLASS = {
  "Evidence found": ["s-found", "●"], "Possible issue": ["s-issue", "▲"],
  "Not enough data": ["s-nodata", "○"], "Needs professional review": ["s-review", "◆"],
};
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = (v) => (v ? Math.round(v).toLocaleString("en-US") : "–");
const badge = (state, text) => {
  const [cls, glyph] = STATE_CLASS[state];
  return `<span class="badge ${cls}" title="${esc(state)}"><i>${glyph}</i>${esc(text ?? state)}</span>`;
};
const counts = (c) => `<div class="counts">${Object.entries(c).map(([s, n]) => badge(s, `${s} ${n}`)).join("")}</div>`;
const shortCounts = (c) => `<div class="counts">${Object.entries(c).map(([s, n]) => badge(s, n)).join("")}</div>`;

let visit = 0; // goes up on every navigation, so a slow answer for an earlier screen is dropped
async function api(path) {
  const mine = visit;
  const response = await fetch(path);
  if (!response.ok) throw new Error(`Request did not complete (${response.status})`);
  const data = await response.json();
  if (mine !== visit) throw new Error("stale");
  return data;
}

/* ---------- shared 3D plumbing ---------- */

let live = null; // the scene currently on screen
const introSeen = new Set(); // buildings whose photo-to-model intro has already played
function stopScene() { if (live) { live.dispose(); live = null; } tip.style.display = "none"; }

function makeStage(host, options = {}) {
  const gl = host.querySelector(".gl"), labelHost = host.querySelector(".labels");
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  gl.appendChild(renderer.domElement);
  const labels = new CSS2DRenderer({ element: labelHost });
  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x060a11, 0.0016);
  const camera = new THREE.PerspectiveCamera(42, 1, 0.5, 6000);
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.autoRotate = true; controls.autoRotateSpeed = 0.55;
  controls.maxPolarAngle = Math.PI * 0.49;
  scene.add(new THREE.HemisphereLight(0xbfd9ff, 0x0a1220, 0.9));
  const sun = new THREE.DirectionalLight(0xffffff, 0.9); sun.position.set(120, 260, 80); scene.add(sun);

  const composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  if (options.bloom !== false) composer.addPass(new UnrealBloomPass(new THREE.Vector2(1, 1), 0.5, 0.6, 0.72));
  composer.addPass(new OutputPass());

  const size = () => {
    const w = host.clientWidth, h = host.clientHeight;
    renderer.setSize(w, h); composer.setSize(w, h); labels.setSize(w, h);
    camera.aspect = w / h; camera.updateProjectionMatrix();
  };
  const watcher = new ResizeObserver(size); watcher.observe(host); size();
  renderer.domElement.addEventListener("pointerdown", () => { controls.autoRotate = false; });

  const ticks = [];
  let frame = 0, alive = true;
  const clock = new THREE.Clock();
  const loop = () => {
    if (!alive) return;
    frame = requestAnimationFrame(loop);
    const t = clock.getElapsedTime();
    ticks.forEach((fn) => fn(t));
    controls.update(); composer.render(); labels.render(scene, camera);
  };
  loop();
  const dispose = () => {
    alive = false; cancelAnimationFrame(frame); watcher.disconnect(); controls.dispose();
    scene.traverse((o) => { o.geometry?.dispose(); if (o.material) [].concat(o.material).forEach((m) => { m.map?.dispose(); m.dispose(); }); });
    composer.dispose(); renderer.dispose(); gl.replaceChildren(); labelHost.replaceChildren();
  };
  return { scene, camera, controls, renderer, ticks, dispose };
}

function tag(text, cls = "") {
  const el = document.createElement("div");
  el.className = `tag3d ${cls}`; el.textContent = text;
  return new CSS2DObject(el);
}
const lineMat = (color, opacity = 1) => new THREE.LineBasicMaterial({ color, transparent: opacity < 1, opacity });
function polyline(points, material, closed = false) {
  const geo = new THREE.BufferGeometry().setFromPoints(points);
  return closed ? new THREE.LineLoop(geo, material) : new THREE.Line(geo, material);
}

/* ---------- one building in its surroundings ---------- */

function closestPair(ringsA, ringsB) {
  let best = { d: Infinity };
  const seg = (p, a, b) => {
    const dx = b[0] - a[0], dy = b[1] - a[1], len = dx * dx + dy * dy;
    const t = len ? Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / len)) : 0;
    return [a[0] + t * dx, a[1] + t * dy];
  };
  const scan = (from, to, flip) => from.forEach((ra) => ra.forEach((p) => to.forEach((rb) => {
    for (let i = 0; i < rb.length - 1; i++) {
      const q = seg(p, rb[i], rb[i + 1]), d = Math.hypot(p[0] - q[0], p[1] - q[1]);
      if (d < best.d) best = flip ? { d, a: q, b: p } : { d, a: p, b: q };
    }
  })));
  scan(ringsA, ringsB, false); scan(ringsB, ringsA, true);
  return best;
}

function introPhotoHeight(width, depth, centerX, centerY, aspect, fov, preferred) {
  // Keep every viewport edge within the georeferenced photo, without stretching it.
  const halfWidth = Math.max(0, width / 2 - Math.abs(centerX));
  const halfDepth = Math.max(0, depth / 2 - Math.abs(centerY));
  const tangent = Math.tan(fov * Math.PI / 360);
  return Math.min(preferred, 0.98 * Math.min(halfWidth / aspect, halfDepth) / tangent);
}

function buildingScene(host, data) {
  const o = data.outside, b = data.building;
  const stage = makeStage(host);
  const { scene, camera, controls, ticks } = stage;
  const [west, south, east, north] = o.bbox;
  const lat0 = (south + north) / 2, lon0 = (west + east) / 2;
  const kx = 111320 * Math.cos((lat0 * Math.PI) / 180), ky = 110540;
  const toM = ([lon, lat]) => [(lon - lon0) * kx, (lat - lat0) * ky]; // x east, y north
  const subject = o.footprint.map((ring) => ring.map(toM));
  const others = o.neighbors.map((ring) => ring.map(toM));
  const all = subject.flat();
  const minX = Math.min(...all.map((p) => p[0])), maxX = Math.max(...all.map((p) => p[0]));
  const minY = Math.min(...all.map((p) => p[1])), maxY = Math.max(...all.map((p) => p[1]));
  const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2, span = Math.max(maxX - minX, maxY - minY);
  const at = ([x, y], h = 0) => new THREE.Vector3(x - cx, h, -(y - cy)); // north is -Z, up is Y
  const v3 = (x, y, z) => new THREE.Vector3(x, y, z);

  const H = (o.height_ft || (b.stories || 2) * 12) * FT;
  const stories = b.stories || Math.max(1, Math.round(H / 4));
  const floorH = H / stories;
  const topFt = data.top_occupied_ft, highRise = topFt != null && topFt >= HIGH_RISE_FT;
  const main = highRise ? AMBER : CYAN;
  const white = lineMat(0xffffff, 0.95);

  // ground: the aerial image, toned down so the drawing reads on top of it
  const gw = (east - west) * kx, gh = (north - south) * ky;
  const groundMat = new THREE.MeshBasicMaterial({ color: 0xe3e5e1 });
  new THREE.TextureLoader().load(`/api/spaces/${b.property_id}/aerial.jpg`, (texture) => {
    texture.colorSpace = THREE.SRGBColorSpace; texture.anisotropy = 8; groundMat.map = texture; groundMat.needsUpdate = true;
  });
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(gw, gh).rotateX(-Math.PI / 2), groundMat);
  ground.position.set(-cx, 0, cy); scene.add(ground);
  // Wider, lower-resolution real imagery beneath the detailed central photo.
  // Give it its own geographic bounds; stretching the central image would misplace buildings.
  let contextMat = null;
  if (o.context_bbox?.length === 4) {
    const [cw, cs, ce, cn] = o.context_bbox;
    const [mx, my] = toM([(cw + ce) / 2, (cs + cn) / 2]);
    contextMat = new THREE.MeshBasicMaterial({ color: groundMat.color });
    const contextGround = new THREE.Mesh(new THREE.PlaneGeometry((ce - cw) * kx, (cn - cs) * ky).rotateX(-Math.PI / 2), contextMat);
    contextGround.position.set(mx - cx, -0.1, -(my - cy));
    contextGround.visible = false; scene.add(contextGround);
    new THREE.TextureLoader().load(`/api/spaces/${b.property_id}/aerial.jpg?context=1`, (texture) => {
      if (!host.isConnected) { texture.dispose(); return; }
      texture.colorSpace = THREE.SRGBColorSpace; texture.anisotropy = 8;
      contextMat.map = texture; contextMat.needsUpdate = true; contextGround.visible = true;
    }, undefined, () => { contextGround.visible = false; });
  }
  const grid = new THREE.GridHelper(Math.max(gw, gh) * 3, 60, 0x1c3148, 0x101b2a);
  grid.position.y = -0.3; scene.add(grid);

  const shapeOf = (ring) => new THREE.Shape(ring.map(([x, y]) => new THREE.Vector2(x - cx, y - cy)));
  const extrude = (ring, height) => new THREE.ExtrudeGeometry(shapeOf(ring), { depth: height, bevelEnabled: false }).rotateX(-Math.PI / 2);

  // neighbours as ghosts; the closest one is kept apart so it can be brought forward
  const pair = others.length ? closestPair(subject, others) : {};
  const nearestIndex = pair.b ? others.findIndex((ring) => ring.some((p, k) => k < ring.length - 1 &&
    Math.abs((ring[k + 1][0] - p[0]) * (pair.b[1] - p[1]) - (ring[k + 1][1] - p[1]) * (pair.b[0] - p[0])) < 0.5 &&
    Math.min(p[0], ring[k + 1][0]) - 0.5 <= pair.b[0] && pair.b[0] <= Math.max(p[0], ring[k + 1][0]) + 0.5 &&
    Math.min(p[1], ring[k + 1][1]) - 0.5 <= pair.b[1] && pair.b[1] <= Math.max(p[1], ring[k + 1][1]) + 0.5)) : -1;
  const ghosts = new THREE.Group(), nearest = new THREE.Group(); scene.add(ghosts, nearest);
  const ghostFill = new THREE.MeshStandardMaterial({ color: 0xaeb9b3, transparent: true, opacity: 0.42, roughness: 0.9, depthWrite: false });
  const ghostEdge = lineMat(0xc6d2cf, 0.18);
  const nearFill = new THREE.MeshStandardMaterial({ color: 0xb1bba9, transparent: true, opacity: 0.42, roughness: 0.9, depthWrite: false });
  const nearEdge = lineMat(0xffffff, 0.45);
  others.forEach((ring, k) => {
    const geo = extrude(ring, Math.max(3, (o.neighbor_heights_ft?.[k] ?? 20) * FT));
    const close = k === nearestIndex;
    (close ? nearest : ghosts).add(new THREE.Mesh(geo, close ? nearFill : ghostFill));
    (close ? nearest : ghosts).add(new THREE.LineSegments(new THREE.EdgesGeometry(geo, 30), close ? nearEdge : ghostEdge));
  });

  // the building: a translucent shell, and one slab per story that can be pulled apart
  const shell = new THREE.Group(); scene.add(shell);
  const shellFill = new THREE.MeshStandardMaterial({ color: 0xd5c7ad, transparent: true, opacity: 0.6, roughness: 0.65, metalness: 0.1, side: THREE.DoubleSide, depthWrite: false });
  const shellEdge = lineMat(main, 1);
  subject.forEach((ring) => {
    const geo = extrude(ring, H);
    shell.add(new THREE.Mesh(geo, shellFill));
    shell.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo, 25), shellEdge));
  });
  const slabs = new THREE.Group(); scene.add(slabs);
  const slabFill = new THREE.MeshBasicMaterial({ color: main, transparent: true, opacity: 0, side: THREE.DoubleSide, depthWrite: false });
  const slabEdge = lineMat(main, 0.32);
  const topFill = slabFill.clone();  // the floor that is opened
  const marketFill = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0, side: THREE.DoubleSide, depthWrite: false });
  const marketEdge = lineMat(0xffffff, 0.9);
  const marketed = new Set((b.spaces || []).map((sp) => sp.floor).filter(Boolean));
  const openAt = Math.min(stories, Math.max(1, data.floor || stories)) - 1; // index of the floor that opens
  const levels = [], slabMeshes = [];
  for (let n = 0; n < stories; n++) {
    const level = new THREE.Group(); level.userData.base = n * floorH; level.userData.floor = n + 1;
    const onMarket = marketed.has(n + 1);
    subject.forEach((ring) => {
      const mesh = new THREE.Mesh(new THREE.ShapeGeometry(shapeOf(ring)).rotateX(-Math.PI / 2), n === openAt ? topFill : onMarket ? marketFill : slabFill);
      mesh.userData.floor = n + 1; level.add(mesh); slabMeshes.push(mesh);
      level.add(polyline(ring.map((p) => at(p, 0)), onMarket || n === openAt ? marketEdge : slabEdge, true));
    });

  const openLevel = levels[openAt];

  // Detailed interiors live in the floor explorer; source images stay in the document view.
  const planGroup = new THREE.Group(); openLevel.add(planGroup);
  const wallMat = lineMat(0xffffff), windowMat = lineMat(CYAN), doorMat = lineMat(AMBER);
  const floorLines = null, planImage = null, planSpan = span;

  // a scan line that keeps travelling up the building
  const sweep = new THREE.Group(); scene.add(sweep);
  subject.forEach((ring) => sweep.add(polyline(ring.map((p) => at(p, 0)), white, true)));

  // 75 ft threshold, measured to the highest occupied level
  const limit = new THREE.Group(); scene.add(limit);
  const limitY = HIGH_RISE_FT * FT, half = span * 0.62;
  const limitMat = new THREE.MeshBasicMaterial({ color: AMBER, transparent: true, opacity: 0.08, side: THREE.DoubleSide, depthWrite: false });
  const plane = new THREE.Mesh(new THREE.PlaneGeometry(half * 2, half * 2).rotateX(-Math.PI / 2), limitMat);
  plane.position.y = limitY; limit.add(plane);
  const corners = [[-half, -half], [half, -half], [half, half], [-half, half]].map(([x, z]) => new THREE.Vector3(x, limitY, z));
  const limitLine = lineMat(AMBER, 0.9);
  limit.add(polyline(corners, limitLine, true));
  const limitTag = tag("75 ft · high-rise threshold", "amber"); limitTag.position.copy(corners[2]); limit.add(limitTag);

  // height read-out beside the corner furthest east
  const dims = new THREE.Group(); scene.add(dims);
  const east0 = subject[0].reduce((m, p) => (p[0] > m[0] ? p : m)), west0 = subject[0].reduce((m, p) => (p[0] < m[0] ? p : m));
  const off = at(east0).add(new THREE.Vector3(span * 0.08, 0, 0));
  dims.add(polyline([off.clone(), off.clone().setY(H)], white));
  [0, H].forEach((y) => dims.add(polyline([off.clone().setY(y).add(new THREE.Vector3(-2.5, 0, 0)), off.clone().setY(y).add(new THREE.Vector3(2.5, 0, 0))], white)));
  const tags = []; // labels do not follow a hidden group, so each is switched on its own
  if (o.height_ft) { const t = tag(`roof ≈ ${Math.round(o.height_ft)} ft`); t.position.copy(off.clone().setY(H)); dims.add(t); tags.push([t, "dims"]); }
  if (topFt != null && stories > 1) {
    const t = tag(`highest occupied level ≈ ${Math.round(topFt)} ft`, highRise ? "amber" : "cyan");
    t.position.copy(at(west0, topFt * FT)); dims.add(t); tags.push([t, "dims"]);
  }

  // gap to the closest structure
  const gap = new THREE.Group(); scene.add(gap);
  let gapMid = new THREE.Vector3(0, 4, 0), gapDir = new THREE.Vector3(1, 0, 0), gapLen = 10;
  if (pair.a) {
    const a = at(pair.a, 2), c = at(pair.b, 2);
    gap.add(polyline([a, c], white));
    [a, c].forEach((p) => gap.add(polyline([p.clone().setY(0), p.clone().setY(7)], white)));
    gapMid = a.clone().lerp(c, 0.5); gapLen = Math.max(a.distanceTo(c), 1);
    if (gapLen > 1.5) gapDir = c.clone().sub(a).setY(0).normalize();

  const streetMat = lineMat(0x9fe6ff, 0.55), laneMat = lineMat(GHOST, 0.25);
  (data.streets || []).forEach((street) => {
    roads.add(polyline(street.points.map((p) => at(toM(p), street.public ? 0.9 : 0.6)), street.public ? streetMat : laneMat));
  });
  const front = (data.streets || []).find((street) => street.public && street.distance_ft != null);
  let streetTag = null;
  if (front) {
    const near = front.points.map(toM).reduce((m, p) => (Math.hypot(p[0] - cx, p[1] - cy) < Math.hypot(m[0] - cx, m[1] - cy) ? p : m));
    streetTag = tag(`${front.name || "public street"} · ≈ ${Math.round(front.distance_ft)} ft`, "cyan"); streetTag.position.copy(at(near, 4)); roads.add(streetTag);

  const v = (x, y, z) => new THREE.Vector3(x, y, z);

  const hero = { pos: v(reach * 0.78, H * 0.75 + reach * 0.3, reach * 0.78), look: v(0, H * 0.4, 0) };
  const pulled = 1.9; // how far the stories are pulled apart
  const openY = openAt * floorH * pulled, gapUp = Math.max(floorH * 3, span * 0.55); // room made above the open floor
  const frame = Math.max(planSpan * 1.25, span * 0.55); // how far back to stand to see the plan
  const openShot = { pos: v(frame * 0.8, openY + frame * 1.05, frame * 0.8), look: v(0, openY, 0), explode: 1, ghost: 0.05, limit: 0, lift: 1 };
  const shots = {
    "": { ...hero, shell: 0.6, ghost: 0.55 },
    height: { pos: v(reach * 1.05, H * 0.5, reach * 0.3), look: v(0, H * 0.5, 0), limit: 0.24, ghost: 0.16 },
    elevator: { pos: v(reach * 0.85, H * pulled * 0.62, reach * 0.85), look: v(0, H * pulled * 0.5, 0), explode: 1, ghost: 0.08, limit: 0.03 },
    units: { ...openShot },
    exits: { ...openShot, pos: v(frame * 0.15, openY + frame * 1.45, frame * 0.5) },
    escape: { ...openShot, pos: v(frame * 1.3, openY + frame * 0.55, frame * 0.5) },
    separation: { pos: gapMid.clone().add(side.clone().multiplyScalar(Math.max(70, gapLen * 4, span))).setY(Math.max(55, gapLen * 2.5, span * 0.7)), look: gapMid.clone(), ghost: 0.14, near: 0.85, shell: 0.34, limit: 0 },
    access: { pos: v(0.5, Math.max(reach * 1.5, 230), 1), look: v(0, 0, 0), flat: 0.06, ghost: 0.5, shell: 0.3, limit: 0, street: 1, bright: 1 },
    sprinklers: { pos: v(reach * 0.5, H * 0.62, reach * 0.62), look: v(0, H * 0.5, 0), ghost: 0.1, shell: 0.3, limit: 0.03 },
    seismic: { pos: v(-reach * 0.6, H * 0.3, reach * 0.75), look: v(0, H * 0.42, 0), ghost: 0.1, shell: 0.28, limit: 0.03 },
  };

  // everything that moves is one of these numbers, eased from where it is to where the shot wants it
  const now = { explode: 0, lift: 0, flat: 1, ghost: 0.42, near: 0.42, shell: 0.2, limit: 0.08, street: 0.55 };
  const want = { ...now };
  let fly = null;
  const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  const setMode = (key) => {
    lastKey = key;
    if (intro) return; // the intro ends by coming to this view
    const shot = shots[key] || shots[""];
    Object.assign(want, { explode: 0, lift: 0, flat: 1, ghost: 0.42, near: 0.42, shell: 0.2, limit: 0.08, street: 0.55 }, shot);
    want.near = shot.near ?? want.ghost;
    fly = { t0: performance.now(), ms: 1300, fromPos: camera.position.clone(), fromLook: controls.target.clone(), toPos: shot.pos, toLook: shot.look, from: { ...now } };
    controls.autoRotate = false;
    groundMat.color.set(shot.bright ? 0xffffff : 0xe3e5e1);
    const closed = !shot.explode;
    dims.visible = closed && ["", "age", "zone", "stay", "height", "sprinklers", "alarm", "seismic", "historic"].includes(key);
    gap.visible = closed && ["", "age", "zone", "stay", "separation"].includes(key);
    tags.forEach(([t, group]) => { t.visible = group === "dims" ? dims.visible : gap.visible; });
    limitTag.visible = closed && ["", "age", "zone", "stay", "height"].includes(key);
    if (streetTag) streetTag.visible = (closed && ["", "age", "zone", "stay"].includes(key)) || key === "access";
    sweep.visible = !shot.explode && key !== "access";
  };
  ticks.push((t) => {
    if (intro) stepIntro();
    if (contextMat) contextMat.color.copy(groundMat.color);
    if (fly) {
      const k = Math.min(1, (performance.now() - fly.t0) / fly.ms), e = ease(k);
      camera.position.lerpVectors(fly.fromPos, fly.toPos, e);
      controls.target.lerpVectors(fly.fromLook, fly.toLook, e);
      Object.keys(now).forEach((name) => { now[name] = fly.from[name] + (want[name] - fly.from[name]) * e; });
      if (k === 1) { fly = null; controls.autoRotate = true; }
    }
    const spread = 1 + now.explode * (pulled - 1);
    // the stories above the open floor rise clear of it, so its plan can be seen
    levels.forEach((level, n) => { level.position.y = (level.userData.base * spread + (n > openAt ? now.lift * gapUp : 0)) * grow; });
    shell.scale.y = Math.max(grow, 0.001); slabs.visible = grow > 0.02;
    slabFill.opacity = 0.05 + now.explode * 0.3 * (1 - 0.8 * now.lift); slabEdge.opacity = 0.32 + now.explode * 0.6 * (1 - 0.6 * now.lift);
    marketFill.opacity = 0.02 + now.explode * 0.1 * (1 - 0.8 * now.lift); marketEdge.opacity = 0.45 + now.explode * 0.5;
    slabFill.opacity = 0.04 + now.explode * 0.16 * (1 - 0.85 * now.lift);
    topFill.opacity = 0.05 + now.explode * 0.2 + now.lift * 0.12;
    planGroup.visible = now.lift > 0.02;
    wallMat.opacity = 0.95 * now.lift; windowMat.opacity = now.lift; doorMat.opacity = now.lift;
    if (planImage) planImage.element.style.opacity = planImage.userData.ready ? String(0.92 * now.lift) : "0";
    shell.visible = now.explode < 0.98; shellFill.opacity = now.shell * (1 - now.explode); shellEdge.opacity = 1 - now.explode;

    ghostFill.opacity = now.ghost; ghostEdge.opacity = now.ghost * 0.3;
    nearFill.opacity = now.near; nearEdge.opacity = Math.min(1, now.near + 0.15);
    limitMat.opacity = now.limit; limitLine.opacity = Math.min(0.9, now.limit * 6); limit.visible = now.limit > 0.005;
    streetMat.opacity = now.street; laneMat.opacity = now.street * 0.5;

  const trace = new THREE.Group(); scene.add(trace);
  const traced = [];
  const outlineOf = (ring, material) => {
    const line = polyline([...ring, ring[0]].map((p) => at(p, 0.7)), material);
    line.geometry.setDrawRange(0, 0); line.userData.count = ring.length + 1; trace.add(line); traced.push(line);
  };
  subject.forEach((ring) => outlineOf(ring, lineMat(0xffffff, 1)));
  others.forEach((ring) => outlineOf(ring, lineMat(0x9fe6ff, 0.9)));
  const scanBar = polyline([v(-gw / 2 - cx, 1.2, 0), v(gw / 2 - cx, 1.2, 0)], lineMat(0xffffff, 1)); scene.add(scanBar); scanBar.visible = false;
  const caption = host.querySelector("#introcap");
  const say = (text) => { if (caption) { caption.textContent = text; caption.style.display = text ? "block" : "none"; } };
  const photoHeight = () => introPhotoHeight(gw, gh, cx, cy, camera.aspect, camera.fov, Math.max(span * 2.4, 170));
  const above = v(0, photoHeight(), 0.0001);
  const clamp = (x) => Math.max(0, Math.min(1, x));
  let intro = null, grow = 1, lastKey = "";
  const playIntro = () => {
    above.y = photoHeight();
    intro = { t0: performance.now(), ms: 6200 };
    fly = null; controls.autoRotate = false; controls.enabled = false;
    Object.assign(now, { explode: 0, lift: 0, flat: 1, ghost: 0.42, near: 0.42, shell: 0.2, limit: 0, street: 0 });
    [dims, gap, limit, roads, sweep].forEach((g) => { g.visible = false; });
    tags.forEach(([t]) => { t.visible = false; }); limitTag.visible = false; if (streetTag) streetTag.visible = false;
    camera.position.copy(above); controls.target.set(0, 0, 0);

  const stepIntro = () => {
    above.y = photoHeight(); // Refit if the panel is resized during the intro.
    const k = clamp((performance.now() - intro.t0) / intro.ms);
    // 1. the photo as it is, swept once
    scanBar.visible = k < 0.26; scanBar.position.z = cy - gh / 2 + gh * clamp(k / 0.26);
    // 2. footprints are traced on it
    const drawn = clamp((k - 0.18) / 0.27);
    traced.forEach((line) => line.geometry.setDrawRange(0, Math.ceil(line.userData.count * drawn)));
    // 3. the photo recedes and the buildings rise to their measured heights
    const rise = clamp((k - 0.45) / 0.33); grow = 1 - Math.pow(1 - rise, 3);
    groundMat.color.lerpColors(new THREE.Color(0xffffff), new THREE.Color(0xe3e5e1), clamp((k - 0.42) / 0.3));
    trace.children.forEach((line) => { line.material.opacity = 1 - clamp((k - 0.7) / 0.25); });
    // 4. the camera comes down from overhead to the working view
    const swing = ease(clamp((k - 0.5) / 0.5)), shot = shots[lastKey] || shots[""];
    camera.position.lerpVectors(above, shot.pos, swing); controls.target.lerpVectors(v(0, 0, 0), shot.look, swing);
    say(k < 0.18 ? `Vexcel aerial image${o.captured ? " · captured " + o.captured : ""}`
      : k < 0.45 ? `Tracing ${others.length + 1} building footprints`
      : k < 0.8 ? `Raising to measured height${o.height_ft ? " · " + Math.round(o.height_ft) + " ft" : ""}` : "");
    if (k === 1) {
      intro = null; grow = 1; trace.visible = false; scanBar.visible = false; controls.enabled = true; say("");
      [limit, roads].forEach((g) => { g.visible = true; });
      setMode(lastKey);
    }
  };
  host.querySelector("#replay").onclick = (event) => { event.preventDefault(); trace.visible = true; playIntro(); };

  // taking hold of the view stops the flight, so the camera never fights the person
  stage.renderer.domElement.addEventListener("pointerdown", () => { if (fly) { fly.toPos = camera.position.clone(); fly.fromPos = fly.toPos; fly.toLook = controls.target.clone(); fly.fromLook = fly.toLook; } });
  stage.renderer.domElement.addEventListener("wheel", () => { if (fly) { fly.toPos = camera.position.clone(); fly.fromPos = fly.toPos; fly.toLook = controls.target.clone(); fly.fromLook = fly.toLook; } }, { passive: true });
  // choosing a floor: a click that is not a drag, on one of the floor slabs
  const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
  let downAt = null;
  const canvas = stage.renderer.domElement;
  canvas.addEventListener("pointerdown", (event) => { downAt = [event.clientX, event.clientY]; });
  canvas.addEventListener("pointerup", (event) => {
    if (!downAt || Math.hypot(event.clientX - downAt[0], event.clientY - downAt[1]) > 5 || now.explode < 0.5) return;
    const box = canvas.getBoundingClientRect();
    mouse.set(((event.clientX - box.left) / box.width) * 2 - 1, -((event.clientY - box.top) / box.height) * 2 + 1);
    ray.setFromCamera(mouse, camera);
    const hit = ray.intersectObjects(slabMeshes, false)[0];
    if (hit) data.onFloor?.(hit.object.userData.floor);
  });
  controls.minDistance = 20; controls.maxDistance = reach * 5;
  if (data.playIntro) playIntro();
  else {
    trace.visible = false;
    camera.position.copy(hero.pos).multiplyScalar(2.2); // start far out and come in
    controls.target.copy(hero.look);
  }
  controls.update();
  setMode("");
  return { dispose: stage.dispose, setMode };
}

/* ---------- every building at once ---------- */

function skylineScene(host, spaces, onPick) {
  const stage = makeStage(host);
  const { scene, camera, controls, renderer } = stage;
  const placed = spaces.filter((s) => s.latitude && s.longitude);
  const lat0 = placed.reduce((t, s) => t + s.latitude, 0) / placed.length;
  const lon0 = placed.reduce((t, s) => t + s.longitude, 0) / placed.length;
  const kx = 111.32 * Math.cos((lat0 * Math.PI) / 180), ky = 110.54; // km
  const pos = placed.map((s) => [(s.longitude - lon0) * kx, (s.latitude - lat0) * ky]);
  // scale to where most buildings are, so a few far-off ones do not shrink the cluster
  const reachKm = pos.map(([x, y]) => Math.max(Math.abs(x), Math.abs(y))).sort((a, c) => a - c);
  const scale = 120 / Math.max(reachKm[Math.floor(reachKm.length * 0.8)], 1);

  const ground = new THREE.Mesh(new THREE.CircleGeometry(260, 64).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0x08101b }));
  ground.position.y = -0.2; scene.add(ground);
  scene.add(new THREE.GridHelper(520, 104, 0x1b3350, 0x0e1826));
  scene.fog.density = 0.0022;

  const meshes = [];
  placed.forEach((s, i) => {
    const feet = s.height_ft || (s.stories ? s.stories * 13 : 30);
    const top = s.stories ? (feet * (s.stories - 1)) / s.stories : feet;
    const color = top >= HIGH_RISE_FT ? AMBER : CYAN;
    const side = Math.max(2.2, Math.min(7, Math.sqrt(s.footprint_sqft || 8000) / 28));
    const h = Math.max(1.2, feet / 9);
    const geo = new THREE.BoxGeometry(side, h, side); geo.translate(0, h / 2, 0);
    const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color, transparent: true, opacity: 0.28, roughness: 0.4, depthWrite: false }));
    mesh.position.set(pos[i][0] * scale, 0, -pos[i][1] * scale);
    mesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo), lineMat(color, 0.95)));
    mesh.userData = s; scene.add(mesh); meshes.push(mesh);
  });

  camera.position.set(130, 95, 170); controls.target.set(0, 10, 0); controls.autoRotateSpeed = 0.35;
  controls.minDistance = 40; controls.maxDistance = 520; controls.update();

  const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
  let hot = null;
  const light = (mesh, on) => { if (mesh) { mesh.material.opacity = on ? 0.85 : 0.28; mesh.scale.setScalar(on ? 1.12 : 1); } };
  const pick = (event) => {
    const box = renderer.domElement.getBoundingClientRect();
    mouse.set(((event.clientX - box.left) / box.width) * 2 - 1, -((event.clientY - box.top) / box.height) * 2 + 1);
    ray.setFromCamera(mouse, camera);
    return ray.intersectObjects(meshes, false)[0]?.object ?? null;
  };
  const highlight = (mesh) => { if (mesh !== hot) { light(hot, false); hot = mesh; light(hot, true); } };
  renderer.domElement.addEventListener("pointermove", (event) => {
    const mesh = pick(event); highlight(mesh);
    renderer.domElement.style.cursor = mesh ? "pointer" : "grab";
    if (!mesh) { tip.style.display = "none"; return; }
    const s = mesh.userData;
    tip.innerHTML = `<b>${esc(s.name || s.address)}</b><span>${s.stories ?? "–"} stories · ${s.height_ft ? Math.round(s.height_ft) + " ft" : "height not read"} · built ${s.year_built ?? "–"}</span>`;
    tip.style.display = "block"; tip.style.left = `${event.clientX + 14}px`; tip.style.top = `${event.clientY + 14}px`;
  });
  renderer.domElement.addEventListener("pointerleave", () => { highlight(null); tip.style.display = "none"; });
  let downAt = null;
  renderer.domElement.addEventListener("pointerdown", (event) => { downAt = [event.clientX, event.clientY]; });
  renderer.domElement.addEventListener("pointerup", (event) => {
    if (downAt && Math.hypot(event.clientX - downAt[0], event.clientY - downAt[1]) < 5) { const mesh = pick(event); if (mesh) onPick(mesh.userData); }
  });
  return { dispose: stage.dispose, highlight: (id) => highlight(meshes.find((m) => m.userData.property_id === id) ?? null) };
}

function recordView(row) {
  return `<div class="src">SOURCE · CoStar commercial property record</div>
    <p class="statement">${esc(row.evidence)}</p>${fieldTable(row, true)}`;
}

function scanView(row, data) {
  const scan = data.scan;
  if (!scan.model_id) return `<p class="statement">${esc(row.evidence)}</p><p class="note">This building has no 3D scan.</p>`;
  const measured = scan.loaded ? `
    <table class="kv">
      <tr><td>Floors in the scan</td><td>${scan.floors}</td></tr>
      <tr><td>Floor area measured</td><td>${scan.area_sqft ? num(scan.area_sqft) + " sq ft" : '<span class="sub">not measured</span>'}</td></tr>
      <tr><td>Use recorded on the scan</td><td>${esc(scan.uses.join(", ") || "not recorded")}</td></tr>
      <tr><td>Room types in the scan</td><td>${esc(Object.entries(scan.room_kinds).map(([k, n]) => `${k} ${n}`).join(", ") || "none")}</td></tr>
      <tr><td>Windows in the wall geometry</td><td>${scan.windows == null ? '<span class="sub">no wall geometry</span>' : scan.windows}</td></tr>
      <tr><td>Stairs seen, by floor</td><td>${esc(Object.entries(scan.stairs).filter(([, n]) => n).map(([k, n]) => `${k || "Floor"}: ${n}`).join(", ") || "none")}</td></tr>
    </table>` : `<p class="note">${esc(scan.error)}</p>`;
  const r = scan.reading;
  const reading = r ? `
    <h3 style="margin-top:18px">Read from the panoramas</h3>
    <div class="src">SOURCE · ${esc(r.reader || "AI model")} · read from images, not measured</div>
    ${scan.sheet ? `<a href="/api/scans/${encodeURIComponent(scan.model_id)}/sheet.jpg" target="_blank" rel="noopener"><img class="sheet" src="/api/scans/${encodeURIComponent(scan.model_id)}/sheet.jpg" alt="Panoramas read from the scan"></a>` : ""}
    <table class="kv">
      <tr><td>Panoramas read</td><td>${r.panoramas}</td></tr>
      <tr><td>With a window to the outside</td><td>${r.with_windows}</td></tr>
      <tr><td>Staircases visible</td><td>${r.stairs}</td></tr>
      <tr><td>Doors marked EXIT</td><td>${r.exit_doors}</td></tr>
      <tr><td>Kind of space</td><td>${esc(r.space)}${r.indoor === false ? " (outdoors)" : ""}</td></tr>
      <tr><td>Limits of the reading</td><td>${esc(r.notes)}</td></tr>
    </table>` : "";
  const where = [scan.suite ? `Suite ${scan.suite}` : "", scan.floor ? `floor ${scan.floor} (${scan.floor_basis})` : "floor not known"].filter(Boolean).join(" · ");
  return `<div class="src">SOURCE · Matterport 3D scan${scan.name ? " · " + esc(scan.name) : ""} · ${esc(where)}</div>
    <p class="statement">${esc(row.evidence)}</p>
    ${measured}${reading}`;
}

function mountScanViewer(host, data) {
  const modelId = data.scan.model_id;
  host.hidden = true;
  if (!modelId) return () => {};
  const key = data.sdk_key ? `&applicationKey=${encodeURIComponent(data.sdk_key)}` : "";
  const url = `https://my.matterport.com/show/?m=${encodeURIComponent(modelId)}&qs=1&brand=0&help=0${key}`;
  host.innerHTML = `<h3>Interactive scan</h3>
    <p class="note">Saved evidence is shown above. Open the interactive scan when you need to explore the space.</p>
    <div class="agent-actions"><button class="btn" data-open-scan>Open interactive scan</button>
      <button class="btn" data-reload-scan hidden>Reload scan</button>
      <a class="btn" href="${esc(url)}" target="_blank" rel="noopener">Open in new tab</a></div>
    <p class="note" data-scan-note hidden>Matterport loads over the internet and may take a while. If it stays on “Connecting”, try opening it in a new tab. You can keep reviewing the saved evidence.</p>
    <div data-scan-frame></div>`;
  const open = host.querySelector("[data-open-scan]");
  const reload = host.querySelector("[data-reload-scan]");
  let frame = null;
  open.onclick = () => {
    if (frame) return;
    frame = document.createElement("iframe");
    frame.title = "Matterport interactive scan";
    frame.allow = "xr-spatial-tracking; fullscreen";
    frame.allowFullscreen = true;
    frame.src = url;
    host.querySelector("[data-scan-frame]").appendChild(frame);
    open.hidden = true;
    reload.hidden = false;
    host.querySelector("[data-scan-note]").hidden = false;
  };
  reload.onclick = () => { if (frame) frame.src = url; };
  // Keep the same iframe attached when switching checklist rows.
  return (visible) => { host.hidden = !visible; };
}

function outline(rings, box, cls) {
  const [west, south, east, north] = box;
  return rings.map((ring) => `<polygon class="${cls}" points="${ring.map(([x, y]) =>
    `${(((x - west) / (east - west)) * 100).toFixed(2)},${(((north - y) / (north - south)) * 100).toFixed(2)}`).join(" ")}"/>`).join("");
}

function aerialView(row, data) {
  const b = data.building, o = data.outside;
  const photos = b.aerial_urls.length ? b.aerial_urls : (b.photo_url ? [b.photo_url] : []);
  const photoLabel = b.aerial_urls.length ? "CoStar aerial photo" : "CoStar building photo";
  const sources = [o.loaded ? `Vexcel aerial imagery${o.captured ? ", captured " + esc(o.captured) : ""}` : "",
    row.fields.some((f) => !f.field.startsWith("Vexcel")) ? "CoStar commercial property record" : ""].filter(Boolean);
  const image = o.loaded ? `
    <div class="aerial"><img src="/api/spaces/${b.property_id}/aerial.jpg" alt="Vexcel aerial image">
      <svg viewBox="0 0 100 100" preserveAspectRatio="none">${outline(o.neighbors, o.bbox, "other")}${outline(o.footprint, o.bbox, "me")}</svg></div>
    <p class="legend">Blue: the footprint matched to this building. Dashed white: other structures nearby. The same data drives the 3D view above.</p>` : "";
  return `<div class="src">SOURCE · ${sources.join(" · ") || "no image on record"}</div>
    <p class="statement">${esc(row.evidence)}</p>
    ${row.fields.length ? fieldTable(row, false) : ""}
    ${image}
    ${photos.length ? `<div class="thumbs">${photos.map((u) => `<a href="${esc(u)}" target="_blank" rel="noopener"><img src="${esc(u)}" alt="${photoLabel}"></a>`).join("")}</div>
      <p class="legend">${photoLabel}${photos.length > 1 ? "s" : ""} from the record.</p>` : ""}
    <p class="note">${o.loaded ? "Height is the highest roof point sampled over the footprint, minus the ground below; it includes rooftop equipment. The highest occupied level is our estimate: roof height less one story. Distances are measured between footprint outlines."
      : esc(o.error)}</p>`;
}

function planView(data) {
  const p = data.plan;
  if (!p || (!p.image && !p.reading)) return data.space ? `<h3 style="margin-top:18px">Floor plan on record</h3><p class="note">CoStar holds no floor plan for this suite.</p>` : "";
  const r = p.reading;
  if (!p.image) p.image = p.reading_from;
  const shown = (v) => (v == null ? '<span class="sub">not legible on the plan</span>' : v);
  return `<h3 style="margin-top:18px">Floor plan on record</h3>
    <div class="src">SOURCE · CoStar ${p.image.source === "building" ? "building record" : "space for lease"} · ${p.count} plans on record · <a href="#/plans">see all</a></div>
    <a href="${esc(p.image.url)}" target="_blank" rel="noopener"><img class="sheet" style="background:#fff" src="${esc(p.image.url)}" alt="Floor plan"></a>
    ${p.reading_from ? `<p class="legend">The reading below is from another plan attached to this building. Check its stated coverage before using it for this suite.</p>` : ""}
    ${r ? `<table class="kv">
      <tr><td>Stairwells drawn</td><td>${shown(r.stairs)}</td></tr>
      <tr><td>Elevator cars drawn</td><td>${shown(r.elevators)}</td></tr>
      <tr><td>What the plan covers</td><td>${esc({ floor: "A whole floor with the core", part: "Part of a floor", suite: "One suite, no core", diagram: "A leasing diagram" }[r.covers] || r.covers)}</td></tr>
      <tr><td>Limits of the reading</td><td>${esc(r.notes)}</td></tr>
    </table><p class="legend">${esc(r.reader)} · read from the image, not measured</p>` : '<p class="legend">This plan has not been read yet.</p>'}`;
}

function evidenceView(row, data) {
  let body;
  if (row.view === "record") body = recordView(row) + (row.key === "elevator" ? planView(data) : "");
  else if (row.view === "scan") body = scanView(row, data) + (row.key === "exits" ? planView(data) : "");
  else if (row.view === "aerial") body = aerialView(row, data);
  else if (row.view === "setting") body = `<div class="src">SOURCE · product setting</div><p class="statement">${esc(row.evidence)}</p>
      <p class="note">SecondStay plans stays of 31 days or longer. This is a setting, not a property of the building.</p>`;
  else body = `<div class="src">SOURCE · none of our data layers</div><p class="statement">${esc(row.evidence)}</p>
      <p class="note">Records, 3D scans and aerial imagery cannot answer this requirement. To be confirmed by: ${esc(row.confirmed_by)}.</p>`;
  return `<div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start">
      <h3>${esc(row.requirement)}</h3>${badge(row.state)}</div>${body}`;
}

    <section class="panel floor-detail" id="floor-detail" hidden>
      <h3 id="floor-title"></h3><p id="floor-note" role="status"></p><p id="floor-scope-note" class="sub"></p>
      <p class="sub">Floor numbers follow the building record. Floor elevations and repeated outlines are approximate; the building footprint is not a surveyed outline of every floor.</p>
      <div id="floor-source"></div><details id="floor-unassigned"><summary>Sources without a confirmed floor</summary><div></div></details>
      <details class="plan-import"><summary>Build a draft from a 2D plan file</summary>
        <p>Choose the original, straight-on plan image for the selected floor and suite. The file stays in this browser; this draft is cleared when leaving the scene. Crop out titles and legends, then review the blue line candidates.</p>
        <input id="plan-file" type="file" accept="image/png,image/jpeg,image/webp" aria-label="Local floor plan image">
        <canvas id="plan-preview" hidden aria-label="Plan line candidates; drag to crop"></canvas>
        <p id="plan-draft-note">Image observations are read from images, not measured.</p>
        <button class="btn" id="plan-apply" disabled>Use reviewed draft on selected floor</button>
      </details>
    </section></div>
    <aside class="panel agent-panel" id="agent-panel" aria-label="Evidence agent"></aside></div>
    ${b.spaces.length ? `<h2>Spaces on the market · ${b.spaces.length}</h2>
    <div class="panel market"><table class="spaces">
      <thead><tr><th>Floor</th><th>Suite</th><th class="num">sq ft</th><th>Use</th><th class="num">Asking $/sq ft/yr</th><th>Available</th><th>Floor plan</th><th>3D scan</th></tr></thead>
      <tbody>${b.spaces.map((x) => `<tr data-space="${x.id}" class="${sp && sp.id === x.id ? "on" : ""}">
        <td>${esc(x.floor_label)}</td><td class="name">${esc(x.suite || "–")}</td><td class="num">${num(x.sqft)}</td><td>${esc(x.use || "–")}</td>
        <td class="num">${x.rent_per_sqft_year ? x.rent_per_sqft_year.toFixed(0) : "–"}</td><td>${esc(x.available_on || "–")}</td>
        <td>${x.plan_url ? '<span class="yes">on record</span>' : '<span class="sub">none</span>'}</td>
        <td>${x.scans.length ? '<span class="yes">' + x.scans.length + " scan" + (x.scans.length > 1 ? "s" : "") + "</span>" : '<span class="sub">none</span>'}</td></tr>`).join("")}</tbody>
    </table></div>` : ""}
    <div class="cols">
      <div class="panel rows" id="rows">${data.rows.map((r) => `
        <button class="row" data-key="${r.key}">
          <div class="line1"><span class="req">${esc(r.requirement)}</span>${badge(r.state)}</div>
          <div class="ev">${esc(r.evidence)}</div>
          <dl class="more">
            <dt>What the published rule says</dt><dd>${esc(r.rule)} ${r.source_url ? `<a href="${esc(r.source_url)}" target="_blank" rel="noopener">Source</a>` : ""}</dd>
            <dt>Data layer</dt><dd>${esc(r.layer)}</dd>
            <dt>To be confirmed by</dt><dd>${esc(r.confirmed_by)}</dd>
          </dl>
        </button>`).join("")}</div>
      <div class="panel evidence"><div id="evidence"></div><section id="scan-viewer" hidden></section></div>
    </div>
    <h2>Work the published rules call for</h2>
    ${changesView(data)}
    <div class="bar"><h2>Next steps, by who confirms</h2>
      <a class="btn" href="/api/spaces/${id}/next-steps.md${query}">Export for an architect</a></div>
    <div class="panel steps">${data.next_steps.map((g) => `
      <h4>${esc(g.who)}</h4>
      <ul>${g.items.map((i) => `<li><b>${esc(i.requirement)}</b> ${badge(i.state)}<br><span class="sub">${esc(i.evidence)}</span></li>`).join("")}</ul>`).join("")}
    </div>`;

  mountAgent(document.getElementById("agent-panel"), id, spaceId || "", data.scan.model_id || "");
  data.playIntro = !introSeen.has(id); introSeen.add(id);
  function updateFloorControls() {
    const assets = floorAssets(data.floor_sources, chosenFloor);
    const picked = chooseFloorAsset(data.floor_sources, chosenFloor, data.interiorAsset, sp?.floor === chosenFloor ? sp.id : "");
    data.interiorAsset = picked?.key || "";
    const resource = document.getElementById("floor-resource"); resource.replaceChildren();
    const describe = a => [a.geometry_available ? (a.units === "plan_relative" ? "3D draft · relative scale" : a.reconstructed ? "3D plan draft" : a.registered ? "3D in floor frame" : "3D suite") : a.scan_id ? "Scan tour" : "", a.plan_url ? "2D plan" : ""].filter(Boolean).join(" + ");
    for (const asset of assets) {
      const option = new Option(`${asset.label} · ${describe(asset)}`, asset.key);
      option.selected = asset.key === data.interiorAsset; resource.add(option);
    }
    if (!assets.length) resource.add(new Option("No linked interior source", ""));
    resource.disabled = !assets.length;
    const vectors = assets.filter(a=>a.geometry_available).length;
    document.getElementById("floor-resource-summary").textContent = `Floor ${chosenFloor} · ${assets.length} linked source${assets.length === 1 ? "" : "s"} · ${vectors} with 3D geometry · ${assets.filter(a=>a.registered).length} in a floor frame`;
    const directory = document.getElementById("floor-directory"); directory.replaceChildren();
    for (const floor of [...(data.floor_sources?.floors || [])].reverse()) {
      const button = document.createElement("button"); button.className = "btn";
      const kinds = [floor.assets.some(a=>a.geometry_available) ? "3D" : floor.assets.some(a=>a.scan_id) ? "tour" : "", floor.assets.some(a=>a.plan_url) ? "2D" : ""].filter(Boolean).join(" + ");
      button.textContent = `F${floor.floor} · ${kinds || "no source"}`;
      button.setAttribute("aria-label", `Floor ${floor.floor}: ${kinds || "no linked interior source"}`);
      button.setAttribute("aria-pressed", String(floor.floor === chosenFloor));
      button.onclick = () => showScene("isolated", floor.floor); directory.appendChild(button);
    }
    document.getElementById("floor-picker").value = String(chosenFloor);
  }
  function showScene(mode, floor = chosenFloor) {
    if (!o.loaded) return;
    chosenFloor = Number(floor); viewMode = mode;
    updateFloorControls();
    const host = document.getElementById("stage");
    if (mode === "building") {
      stopScene(); host.classList.remove("floor-mode");
      document.getElementById("floor-detail").hidden = true;
      document.getElementById("floor-plan-view").hidden = true; host.classList.remove("plan-only");
      live = buildingScene(host, data); data.playIntro = false;
    } else if (live?.selectFloor) {
      live.selectFloor(chosenFloor, mode);
    } else {
      stopScene(); document.getElementById("introcap").style.display = "none";
      live = floorExplorer(host, data, makeStage, chosenFloor, (floor, mode, asset) => { chosenFloor = floor; viewMode = mode; data.interiorAsset = asset || ""; updateFloorControls(); rememberScene(); });
      live.selectFloor(chosenFloor, mode);
    }
    document.querySelectorAll("[data-scene-mode]").forEach(el => el.setAttribute("aria-pressed", String(el.dataset.sceneMode === mode)));
    rememberScene();
  }
  document.querySelectorAll("[data-scene-mode]").forEach(el => el.onclick = () => showScene(el.dataset.sceneMode));
  document.getElementById("floor-resource").onchange = event => { data.interiorAsset = event.target.value; showScene("isolated"); };
  updateFloorControls();
  document.getElementById("floor-picker").onchange = event => showScene("isolated", event.target.value);
  if (o.loaded) showScene(["exploded", "isolated"].includes(requestedView) ? requestedView : sp && data.floor ? "isolated" : "building");
  const showScanViewer = mountScanViewer(document.getElementById("scan-viewer"), data);
  const select = (key) => {
    current = data.rows.find((r) => r.key === key);
    app.querySelectorAll(".row").forEach((el) => el.classList.toggle("on", el.dataset.key === key));
    document.getElementById("evidence").innerHTML = evidenceView(current, data);
    showScanViewer(current.view === "scan");
    if (viewMode === "building" && ["units", "exits", "escape", "elevator"].includes(key)) showScene("isolated");
    else live?.setMode?.(key);
  };
  app.querySelectorAll(".row").forEach((el) => (el.onclick = () => select(el.dataset.key)));
  const picker = document.getElementById("scan");
  if (picker) picker.onchange = () => reopen(spaceId, picker.value);
  app.querySelectorAll("tr[data-space]").forEach((tr) => (tr.onclick = () => reopen(tr.dataset.space)));
  const clear = document.getElementById("clearspace");
  if (clear) clear.onclick = (event) => { event.preventDefault(); reopen(""); };
  select(current.key);
}

function mountAgent(host, buildingId, spaceId, scanId) {
  let timer = null, playing = false;
  host.innerHTML = `<h2>Evidence agent</h2><p class="sub">Choose sources, gather evidence, cross-check, and record next steps.</p>
    <p class="sub" id="agent-config">Checking local model settings…</p>
    <div class="agent-actions"><button class="btn" id="agent-start" disabled>Run evidence review</button>
    <button class="btn" id="agent-replay" disabled>Replay saved run</button></div>
    <label class="sub">Saved reviews <select id="agent-history" aria-label="Saved evidence reviews"></select></label>
    <p id="agent-status" role="status" aria-live="polite"></p>
    <ol class="agent-log" id="agent-log"></ol><div class="agent-result" id="agent-result"></div>`;
  const el = (id) => host.querySelector(`#agent-${id}`);
  const query = new URLSearchParams({ space: spaceId, scan: scanId });
  const endpoint = `/api/spaces/${buildingId}/reviews`;
  const request = async (url, options) => {
    const response = await fetch(url, options);
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || "The evidence service is unavailable.");
    return data;
  };
  const showResult = (run) => {
    if (!run.result) { el("result").innerHTML = ""; return; }
    el("result").innerHTML = `<h3>Recorded agent checklist</h3>${counts(run.result.counts)}
      <p class="sub">This review uses the sources gathered during this run. Image observations are read from images, not measured.</p>
      <a class="btn" href="/api/reviews/${encodeURIComponent(run.id)}/report.md">Export this review</a>
      <details><summary>Evidence and who confirms it</summary>${run.result.rows.map(r => `<article>
        <b>${esc(r.requirement)}</b> ${badge(r.state)}<p>${esc(r.evidence)}</p>
        <p class="sub">${esc(r.layer)} · To be confirmed by ${esc(r.confirmed_by)}</p></article>`).join("")}</details>`;
  };
  const draw = (run, limit = run.events.length) => {
    const entries = run.events.slice(0, limit);
    el("log").innerHTML = entries.filter(e => e.stage !== "finished").map(e => `<li>${esc(e.message)}
      <small>${esc(new Date(e.at).toLocaleTimeString())}${e.stage ? " · tool selected" : ""}</small></li>`).join("");
    for (const event of entries.filter(e => e.stage === "finished" && (e.observation?.unavailable || e.observation?.error))) {
      const item = document.createElement("li");
      item.textContent = `${event.action.replaceAll("_", " ")}: ${event.observation.unavailable || event.observation.error}`;
      el("log").appendChild(item);
    }
    el("status").textContent = `${playing ? "Recorded replay" : run.mode === "live" ? "Model run" : "Test run"} · ${limit < run.events.length ? "playing" : run.status}`;
    if (limit === run.events.length) showResult(run);
  };
  const history = async () => {
    const data = await request(`${endpoint}?${query}`);
    if (!host.isConnected) return;
    el("history").innerHTML = data.runs.map(r => `<option value="${esc(r.id)}">${esc(new Date(r.started_at).toLocaleString())} · ${esc(r.mode)} · ${esc(r.status)}</option>`).join("");
    el("replay").disabled = !data.runs.length;
    return data.runs;
  };
  const poll = async (id) => {
    if (!host.isConnected) return;
    try {
      const run = await request(`/api/reviews/${encodeURIComponent(id)}`);
      if (!host.isConnected) return;
      draw(run);
      if (run.status === "running") timer = setTimeout(() => poll(id), 1000);
      else { el("start").disabled = false; await history(); }
    } catch (error) { if (host.isConnected) { el("status").textContent = error.message; el("start").disabled = false; } }
  };
  el("start").onclick = async () => {
    clearTimeout(timer); playing = false; el("start").disabled = true; el("replay").disabled = true;
    el("result").innerHTML = ""; el("log").innerHTML = "";
    try {
      const run = await request(endpoint, { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({space:spaceId,scan:scanId}) });
      await poll(run.id);
    } catch (error) { el("status").textContent = error.message; el("start").disabled = false; await history(); }
  };
  el("replay").onclick = async () => {
    clearTimeout(timer); playing = true; el("result").innerHTML = "";
    try {
      const run = await request(`/api/reviews/${encodeURIComponent(el("history").value)}`);
      let n = 0;
      const tick = () => {
        if (!host.isConnected) return;
        draw(run, ++n);
        if (n < run.events.length) timer = setTimeout(tick, 550);
      };
      tick();
    } catch (error) { el("status").textContent = error.message; }
  };
  Promise.all([request("/api/agent"), history()]).then(([config, runs]) => {
    if (!host.isConnected) return;
    el("config").textContent = config.message;
    el("start").disabled = !config.ready;
    if (runs?.[0]?.status === "running") { el("start").disabled = true; poll(runs[0].id); }
  }).catch(error => { if (host.isConnected) el("status").textContent = error.message; });
}

async function showPlans() {
  const data = await api("/api/spaces");
  const withPlans = data.spaces.filter((s) => s.floor_plans?.length)
    .sort((a, c) => c.floor_plans.filter((p) => p.source === "building").length - a.floor_plans.filter((p) => p.source === "building").length);
  const total = withPlans.reduce((t, s) => t + s.floor_plans.length, 0);
  app.innerHTML = `
    <p style="margin:0 0 10px"><a href="#/">← All buildings</a></p>
    <h1>Floor plans CoStar holds for these buildings</h1>
    <p class="sub">${total} plans on ${withPlans.length} of ${data.spaces.length} buildings. Plans are attached to building records or listed spaces.
      Check each sheet for its floor, suite and coverage. Select a plan to open it at full size.</p>
    ${withPlans.map((s) => {
      const shown = s.floor_plans;
      return `<div class="planhead"><h3>${esc(s.name || s.address)}</h3>
        <span class="sub">${s.floor_plans.filter((p) => p.source === "building").length} building attachments · ${s.floor_plans.filter((p) => p.source === "space").length} listing attachments ·
          <a href="#/space/${s.property_id}">open the evidence review</a></span></div>
        <div class="plans">${shown.map((p) => `<a class="plan" href="${esc(p.url)}" target="_blank" rel="noopener">
          <img loading="lazy" src="${esc(p.url)}" alt="Floor plan"><span>${p.source === "building" ? "Building attachment" : "Listing attachment"} · ${esc(p.caption)}</span></a>`).join("")}</div>`;
    }).join("")}`;
}

async function showPlansToRead(page) {
  const data = await api("/api/spaces");
  const chosen = data.spaces.filter((s) => s.plan_to_read);
  const s = chosen[page];
  if (!s) { app.innerHTML = '<p class="loading">No more plans.</p>'; return; }
  const r = s.plan_reading;
  app.innerHTML = `
    <p style="margin:0 0 8px"><a href="#/plans">← All floor plans</a> · the plan read for each building, ${page + 1} of ${chosen.length}
      · ${page ? `<a href="#/plans/read/${page - 1}">previous</a> · ` : ""}${page + 1 < chosen.length ? `<a href="#/plans/read/${page + 1}">next</a>` : ""}
      · <a href="#/space/${s.property_id}">${esc(s.name || s.address)}</a></p>
    <div style="background:#fff;border-radius:8px;overflow:hidden">
      <div style="font:600 12px var(--mono);color:#123;background:#dfe6f0;padding:4px 8px">#${s.property_id} · ${s.plan_to_read.source === "building" ? "building attachment" : "listing attachment"} · ${s.stories ?? "?"} stories on record${r ? ` · read: ${r.stairs} stairs, ${r.elevators} elevators` : ""}</div>
      <img src="${esc(s.plan_to_read.url)}" alt="Floor plan" style="width:100%;height:740px;object-fit:contain;display:block"></div>`;
}

function flash(text) {
  const el = document.getElementById("flash");
  if (!el) return;
  el.textContent = text; el.style.display = "block";
  clearTimeout(flash.timer); flash.timer = setTimeout(() => { el.style.display = "none"; }, 2600);
}

function showError(error) { if (error.message === "stale") return; app.innerHTML = `<p class="loading">${esc(error.message)}</p>`; }
function route() {
  const match = location.hash.match(/^#\/space\/(\d+)/);
  visit += 1;
  stopScene();
  app.innerHTML = '<p class="loading">Reading the three data layers…</p>';
  const read = location.hash.match(/^#\/plans\/read\/(\d+)/);
  const selection = new URLSearchParams(location.hash.split("?")[1] || "");
  (match ? showSpace(match[1], selection.get("scan"), undefined, selection.get("space"), selection.get("floor"), selection.get("view"), selection.get("interior")) : read ? showPlansToRead(Number(read[1])) : location.hash.startsWith("#/plans") ? showPlans() : showList()).catch(showError);
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
route();
</script>
